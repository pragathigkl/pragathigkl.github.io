(Rauwolfia vomitoria reserpine across Himalayas, >50,000 rice strains, 1,000 mango varieties), species (Western Ghats > Eastern Ghats amphibians) and ecological (India's deserts, rain forests, mangroves, coral reefs, wetlands, es", "tag": "NCERT"}, {"id": "II_Bio_89_5", "qno": 5, "q": "India has more than _______ genetically different strains of rice and _______ varieties of mango.", "a": "27; 2,00,000", "b": "45,000; 90,000", "c": "50,000; 1,000", "d": "1,000; 50,000", "ans": "C", "exp": "Correct answer: 50,000; 1,000. Edward Wilson popularised 'biodiversity' across genetic (Rauwolfia vomitoria reserpine across Himalayas, >50,000 rice strains, 1,000 mango varieties), species (Western Ghats > Eastern Ghats amphibians) and ecological (India's deserts, rain forests, mangroves, coral reefs, wetlands, estuar", "tag": "NCERT"}]}, {"chapter": "Verified PYQs (NEET)", "questions": [{"id": "II_Bio_90_1", "qno": 1, "q": "[NEET 2026] Arrange the following cell layers/structures around the female gamete from outer to inner side:\nA. Zona pellucida\nB. Perivitelline space\nC. Corona radiata\nD. Plasma membrane of ovum\nChoose the correct answer:", "a": "C, A, D, B", "b": "C, A, B, D", "c": "A, C, B, D", "d": "D, B, A, C", "ans": "B", "exp": "From outside inward around the ovum, the order is corona radiata (C), zona pellucida (A), perivitelline space (B), and plasma membrane of the ovum (D).", "tag": "PYQ"}, {"id": "II_Bio_90_2", "qno": 2, "q": "[NEET 2025] Consider the following statements:\nA. Reductive division for human female gametogenesis starts earlier than that of male gametogenesis.\nB. The gap between meiosis I and meiosis II is much shorter for males compared to females.\nC. The first polar body is associated with the formation of the primary oocyte.\nD. LH surge leads to disintegration of the endometrium and onset of menstrual bleeding.\nChoose the co", "a": "A and C are true", "b": "B and D are true", "c": "B and C are true", "d": "A and B are true", "ans": "D", "exp": "Female meiosis I starts during fetal life and arrests until ovulation, whereas male spermatogenesis starts at puberty and completes meiosis I and II rapidly; first polar body forms with the secondary oocyte and LH surge triggers ovulation.", "tag": "PYQ"}, {"id": "II_Bio_90_3", "qno": 3, "q": "[NEET 2024] Which of the following is not a component of the Fallopian tube?", "a": "Ampulla", "b": "Isthmus", "c": "Uterine fundus", "d": "Infundibulum", "ans": "C", "exp": "The Fallopian tube (oviduct) comprises the infundibulum, ampulla, and isthmus; the uterine fundus is the upper dome-shaped region of the uterus.", "tag": "PYQ"}, {"id": "II_Bio_90_4", "qno": 4, "q": "[NEET 2026] Which of the following statements are correct regarding packaging of the DNA helix?\nA. Histones are organized to form a histone octamer of eight molecules.\nB. Histones are negatively charged basic proteins.\nC. Histones are rich in basic amino acid residues lysine and arginine.\nD. Positively charged DNA is wrapped around the histone octamer to form a nucleosome.\nE. Higher-level chromatin packaging requires", "a": "A, C and E only", "b": "B, D and E only", "c": "C, D and E only", "d": "A, B and D only", "ans": "A", "exp": "Histones are positively charged basic proteins rich in lysine and arginine, and negatively charged DNA wraps around the histone octamer; thus B and D are false while A, C, and E are true.", "tag": "PYQ"}, {"id": "II_Bio_90_5", "qno": 5, "q": "[NEET 2025] Given below are two statements:\nStatement I: In the RNA world, RNA is considered the first genetic material and also acts as a catalyst; being reactive, RNA is unstable.\nStatement II: DNA evolved from RNA and is a more stable genetic material whose complementary double strands resist changes via repair mechanisms.\nChoose the correct option:", "a": "Both Statement I and Statement II are incorrect", "b": "Both Statement I and Statement II are correct", "c": "Statement I is incorrect but Statement II is correct", "d": "Statement I is correct but Statement II is incorrect", "ans": "B", "exp": "RNA's 2'-OH group makes it reactive and catalytic (ribozymes) yet unstable, whereas DNA evolved as a more stable double-stranded molecule with complementary-strand repair.", "tag": "PYQ"}]}], "I PUC|Mathematics": [{"chapter": "Chapter 1 - Sets", "questions": [{"id": "I _Mat_91_1", "qno": 1, "q": "Which of the following collections is NOT a well-defined set?", "a": "The collection of vowels in the English alphabet", "b": "The collection of the five most talented cricketers in India", "c": "The set of solutions of x2 − 5x + 6 = 0", "d": "The collection of all even natural numbers", "ans": "B", "exp": "'The collection of the five most talented cricketers in India' satisfies the required condition. A set of n elements has 2n subsets, 2n − 1 proper subsets, and 2n − 1 non-empty subsets.", "tag": "NCERT"}, {"id": "I _Mat_91_2", "qno": 2, "q": "The empty set (null set) is denoted by ∅ or {} and contains:", "a": "Zero elements, and is a subset of every set", "b": "Infinitely many elements", "c": "Only negative integers", "d": "One element, namely 0", "ans": "A", "exp": "Zero elements, and is a subset of every set. A set of n elements has 2n subsets, 2n − 1 proper subsets, and 2n − 1 non-empty subsets.", "tag": "NCERT"}, {"id": "I _Mat_91_3", "qno": 3, "q": "Two finite sets A and B are called EQUAL sets (A = B) if and only if:", "a": "They have exactly the same elements (A ⊆ B and B ⊆ A)", "b": "A ∩ B = ∅", "c": "n(A) < n(B)", "d": "They have the same number of elements only", "ans": "A", "exp": "They have exactly the same elements (A ⊆ B and B ⊆ A). A set of n elements has 2n subsets, 2n − 1 proper subsets, and 2n − 1 non-empty subsets.", "tag": "NCERT"}, {"id": "I _Mat_91_4", "qno": 4, "q": "If A = {x ∈ ℕ : 1 < x < 2}, then A is:", "a": "Equal to {1, 2}", "b": "An infinite set", "c": "An empty set (∅)", "d": "A singleton set {1}", "ans": "C", "exp": "Correct answer: An empty set (∅). A set of n elements has 2n subsets, 2n − 1 proper subsets, and 2n − 1 non-empty subsets.", "tag": "NCERT"}, {"id": "I _Mat_91_5", "qno": 5, "q": "If A ⊂ B and A ≠ B, then A is called a:", "a": "Complement of B", "b": "Universal set of B", "c": "Proper subset of B", "d": "Disjoint set from B", "ans": "C", "exp": "Correct answer: Proper subset of B. A set of n elements has 2n subsets, 2n − 1 proper subsets, and 2n − 1 non-empty subsets.", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Relations & Func", "questions": [{"id": "I _Mat_92_1", "qno": 1, "q": "Two ordered pairs (a, b) and (c, d) are equal if and only if:", "a": "a + b = c + d", "b": "a = d and b = c", "c": "a = c and b = d", "d": "a · b = c · d", "ans": "C", "exp": "Correct answer: a = c and b = d. Ordered pairs satisfy (a, b) = (c, d) iff a = c and b = d; Cartesian product cardinality is n(A × B) = n(A) · n(B).", "tag": "NCERT"}, {"id": "I _Mat_92_2", "qno": 2, "q": "If n(A) = p and n(B) = q, then the number of elements in the Cartesian product A × B is:", "a": "pq", "b": "p · q", "c": "p + q", "d": "2p+q", "ans": "B", "exp": "Correct answer: p · q. Ordered pairs satisfy (a, b) = (c, d) iff a = c and b = d; Cartesian product cardinality is n(A × B) = n(A) · n(B).", "tag": "NCERT"}, {"id": "I _Mat_92_3", "qno": 3, "q": "If A = ∅ or B = ∅, then A × B is:", "a": "∅ (empty set)", "b": "{(0, 0)}", "c": "Infinite", "d": "A ∪ B", "ans": "A", "exp": "Correct answer: ∅ (empty set). Ordered pairs satisfy (a, b) = (c, d) iff a = c and b = d; Cartesian product cardinality is n(A × B) = n(A) · n(B).", "tag": "NCERT"}, {"id": "I _Mat_92_4", "qno": 4, "q": "For non-empty sets A, B, and C, A × (B ∪ C) equals:", "a": "(A × B) ∩ (A × C)", "b": "A × (B ∩ C)", "c": "(A ∪ B) × C", "d": "(A × B) ∪ (A × C)", "ans": "D", "exp": "Correct answer: (A × B) ∪ (A × C). Ordered pairs satisfy (a, b) = (c, d) iff a = c and b = d; Cartesian product cardinality is n(A × B) = n(A) · n(B).", "tag": "NCERT"}, {"id": "I _Mat_92_5", "qno": 5, "q": "If A = {1, 2}, the number of ordered triplets in A × A × A is:", "a": "9", "b": "6", "c": "8 (= 23)", "d": "4", "ans": "C", "exp": "Correct answer: 8 (= 23). Ordered pairs satisfy (a, b) = (c, d) iff a = c and b = d; Cartesian product cardinality is n(A × B) = n(A) · n(B).", "tag": "NCERT"}]}, {"chapter": "Chapter 3 - Trig Functions", "questions": [{"id": "I _Mat_93_1", "qno": 1, "q": "One radian is defined as the angle subtended at the centre of a circle by an arc whose length is:", "a": "Equal to the radius of the circle (1 rad ≈ 57° 16′)", "b": "Equal to half the circumference", "c": "Equal to the diameter of the circle", "d": "Equal to 1 cm", "ans": "A", "exp": "Equal to the radius of the circle (1 rad ≈ 57° 16′). Radian and degree measures satisfy π rad = 180°, and arc length is l = r θ (with θ in radians).", "tag": "NCERT"}, {"id": "I _Mat_93_2", "qno": 2, "q": "The exact relation between degree measure and radian measure is:", "a": "π rad = 90°", "b": "2π rad = 180°", "c": "1 rad = 180°", "d": "π rad = 180°", "ans": "D", "exp": "Correct answer: π rad = 180°. Radian and degree measures satisfy π rad = 180°, and arc length is l = r θ (with θ in radians).", "tag": "NCERT"}, {"id": "I _Mat_93_3", "qno": 3, "q": "If a central angle θ (in radians) intercepts an arc of length l on a circle of radius r, then:", "a": "l = π r θ", "b": "l = θ / r", "c": "l = r / θ", "d": "l = r θ", "ans": "D", "exp": "Correct answer: l = r θ. Radian and degree measures satisfy π rad = 180°, and arc length is l = r θ (with θ in radians).", "tag": "NCERT"}, {"id": "I _Mat_93_4", "qno": 4, "q": "The minute hand of a clock rotates through an angle of how many radians in 20 minutes?", "a": "π / 2 rad", "b": "π rad", "c": "π / 3 rad", "d": "2π / 3 rad", "ans": "D", "exp": "Correct answer: 2π / 3 rad. Radian and degree measures satisfy π rad = 180°, and arc length is l = r θ (with θ in radians).", "tag": "NCERT"}, {"id": "I _Mat_93_5", "qno": 5, "q": "Match List I with List II:\nList I:\n(A) 30°\n(B) 45°\n(C) 60°\n(D) 90°\nList II:\n(I) π / 3 rad\n(II) π / 2 rad\n(III) π / 6 rad\n(IV) π / 4 rad\nChoose the correct answer:", "a": "(A)-(IV), (B)-(III), (C)-(I), (D)-(II)", "b": "(A)-(II), (B)-(IV), (C)-(I), (D)-(III)", "c": "(A)-(III), (B)-(I), (C)-(IV), (D)-(II)", "d": "(A)-(III), (B)-(IV), (C)-(I), (D)-(II)", "ans": "D", "exp": "(A)-(III), (B)-(IV), (C)-(I), (D)-(II). Radian and degree measures satisfy π rad = 180°, and arc length is l = r θ (with θ in radians).", "tag": "NCERT"}]}, {"chapter": "Chapter 4 - Complex Numbers", "questions": [{"id": "I _Mat_94_1", "qno": 1, "q": "The sum of any four consecutive integral powers of i, namely in + in+1 + in+2 + in+3, is always equal to:", "a": "i", "b": "1", "c": "−1", "d": "0", "ans": "D", "exp": "Correct answer: 0. Powers of i repeat cyclically with period 4 (i1 = i, i2 = −1, i3 = −i, i4 = 1); four consecutive powers sum to 0.", "tag": "NCERT"}, {"id": "I _Mat_94_2", "qno": 2, "q": "For two negative real numbers −a and −b (a, b > 0), √(−a) · √(−b) is equal to:", "a": "−√(ab)", "b": "i √(ab)", "c": "+√(ab)", "d": "0", "ans": "A", "exp": "Correct answer: −√(ab). Powers of i repeat cyclically with period 4 (i1 = i, i2 = −1, i3 = −i, i4 = 1); four consecutive powers sum to 0.", "tag": "NCERT"}, {"id": "I _Mat_94_3", "qno": 3, "q": "Two complex numbers z1 = a + ib and z2 = c + id (a, b, c, d ∈ ℝ) are equal if and only if:", "a": "a2 + b2 = c2 + d2", "b": "a + b = c + d", "c": "a = c and b = d", "d": "a = d and b = c", "ans": "C", "exp": "Correct answer: a = c and b = d. Powers of i repeat cyclically with period 4 (i1 = i, i2 = −1, i3 = −i, i4 = 1); four consecutive powers sum to 0.", "tag": "NCERT"}, {"id": "I _Mat_94_4", "qno": 4, "q": "The multiplicative identity in the set of complex numbers ℂ is:", "a": "0 + 1i", "b": "0 + 0i", "c": "1 + 0i", "d": "1 + 1i", "ans": "C", "exp": "Correct answer: 1 + 0i. Powers of i repeat cyclically with period 4 (i1 = i, i2 = −1, i3 = −i, i4 = 1); four consecutive powers sum to 0.", "tag": "NCERT"}, {"id": "I _Mat_94_5", "qno": 5, "q": "Assertion (A): The order relation z1 < z2 is not defined in the field of complex numbers ℂ.\nReason (R): If an order existed in ℂ compatible with multiplication, i2 = −1 would have to be positive, contradicting 1 > 0.", "a": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "b": "(A) is true but (R) is false", "c": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "d": "(A) is false but (R) is true", "ans": "A", "exp": "Both statements are true, and (R) directly explains (A): If an order existed in ℂ compatible with multiplication, i2 = −1 would have to be positive, contradicting 1 > 0.", "tag": "NCERT"}]}, {"chapter": "Chapter 5 - Linear Ineq", "questions": [{"id": "I _Mat_95_1", "qno": 1, "q": "When both sides of an inequality a < b are multiplied or divided by a NEGATIVE real number c (c < 0), the inequality sign:", "a": "Remains unchanged (a c < b c)", "b": "Vanishes", "c": "Reverses (a c > b c)", "d": "Becomes an equality", "ans": "C", "exp": "Correct answer: Reverses (a c > b c). Multiplying or dividing an inequality by a negative number reverses the inequality sign; adding any real constant preserves it.", "tag": "NCERT"}, {"id": "I _Mat_95_2", "qno": 2, "q": "If a > b and c is any real number, then adding c to both sides gives:", "a": "a + c < b + c", "b": "a c > b c always", "c": "a + c = b + c", "d": "a + c > b + c (the sign of inequality is preserved)", "ans": "D", "exp": "a + c > b + c (the sign of inequality is preserved). Multiplying or dividing an inequality by a negative number reverses the inequality sign; adding any real constant preserves it.", "tag": "NCERT"}, {"id": "I _Mat_95_3", "qno": 3, "q": "If 0 < a < b, then taking reciprocals of both sides yields:", "a": "1/a = 1/b", "b": "1/a > 1/b", "c": "1/a < 0", "d": "1/a < 1/b", "ans": "B", "exp": "Correct answer: 1/a > 1/b. Multiplying or dividing an inequality by a negative number reverses the inequality sign; adding any real constant preserves it.", "tag": "NCERT"}, {"id": "I _Mat_95_4", "qno": 4, "q": "The solution set of 24x < 100 when x is a natural number (x ∈ ℕ) is:", "a": "{1, 2, 3, 4}", "b": "{1, 2, 3, 4, 5}", "c": "{0, 1, 2, 3, 4}", "d": "(−∞, 25/6)", "ans": "A", "exp": "Correct answer: {1, 2, 3, 4}. Multiplying or dividing an inequality by a negative number reverses the inequality sign; adding any real constant preserves it.", "tag": "NCERT"}, {"id": "I _Mat_95_5", "qno": 5, "q": "Assertion (A): The inequality −3x ≥ 12 has solution x ≤ −4.\nReason (R): Dividing both sides of an inequality by a negative number (−3) reverses the direction of the inequality sign.", "a": "(A) is true but (R) is false", "b": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "c": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "d": "(A) is false but (R) is true", "ans": "C", "exp": "Both statements are true, and (R) directly explains (A): Dividing both sides of an inequality by a negative number (−3) reverses the direction of the inequality sign.", "tag": "NCERT"}]}, {"chapter": "Chapter 6 - Perm & Comb", "questions": [{"id": "I _Mat_96_1", "qno": 1, "q": "According to the Fundamental Principle of Counting, if an event can occur in m ways and a second independent event can occur in n ways, both events in succession can occur in:", "a": "m + n ways", "b": "m × n ways", "c": "mn ways", "d": "nm ways", "ans": "B", "exp": "Correct answer: m × n ways. Fundamental Principle of Counting multiplies independent choices (m × n × k), and n! / (n − 2)! = n(n − 1).", "tag": "NCERT"}, {"id": "I _Mat_96_2", "qno": 2, "q": "By convention, the value of 0! (zero factorial) is defined as:", "a": "−1", "b": "1", "c": "0", "d": "∞", "ans": "B", "exp": "Correct answer: 1. Fundamental Principle of Counting multiplies independent choices (m × n × k), and n! / (n − 2)! = n(n − 1).", "tag": "NCERT"}, {"id": "I _Mat_96_3", "qno": 3, "q": "For any positive integer n, n! / (n − 1)! simplifies to:", "a": "n2", "b": "1", "c": "n − 1", "d": "n", "ans": "D", "exp": "Correct answer: n. Fundamental Principle of Counting multiplies independent choices (m × n × k), and n! / (n − 2)! = n(n − 1).", "tag": "NCERT"}, {"id": "I _Mat_96_4", "qno": 4, "q": "The number of 3-digit numbers that can be formed from the digits 1, 2, 3, 4, 5 when repetition of digits IS allowed is:", "a": "15", "b": "53 = 125", "c": "5 × 4 × 3 = 60", "d": "5! = 120", "ans": "B", "exp": "Correct answer: 53 = 125. Fundamental Principle of Counting multiplies independent choices (m × n × k), and n! / (n − 2)! = n(n − 1).", "tag": "NCERT"}, {"id": "I _Mat_96_5", "qno": 5, "q": "The number of 3-digit numbers that can be formed from the digits 1, 2, 3, 4, 5 when repetition of digits is NOT allowed is:", "a": "10", "b": "5 × 4 × 3 = 60", "c": "20", "d": "125", "ans": "B", "exp": "Correct answer: 5 × 4 × 3 = 60. Fundamental Principle of Counting multiplies independent choices (m × n × k), and n! / (n − 2)! = n(n − 1).", "tag": "NCERT"}]}, {"chapter": "Chapter 7 - Binomial Theorem", "questions": [{"id": "I _Mat_97_1", "qno": 1, "q": "The number of terms in the binomial expansion of (a + b)n (where n ∈ ℕ) is:", "a": "n + 1", "b": "2n", "c": "n", "d": "n − 1", "ans": "A", "exp": "Correct answer: n + 1. The expansion of (a + b)n has n + 1 terms; for even n = 2k, (x + a)n + (x − a)n leaves k + 1 surviving terms.", "tag": "NCERT"}, {"id": "I _Mat_97_2", "qno": 2, "q": "In the expansion of (a + b)n, the sum of the exponents of a and b in every single term is always:", "a": "2n", "b": "n − 1", "c": "n", "d": "n + 1", "ans": "C", "exp": "Correct answer: n. The expansion of (a + b)n has n + 1 terms; for even n = 2k, (x + a)n + (x − a)n leaves k + 1 surviving terms.", "tag": "NCERT"}, {"id": "I _Mat_97_3", "qno": 3, "q": "In the expansion of (a + b)n, the binomial coefficients equidistant from the beginning and the end are:", "a": "Reciprocals of each other", "b": "Equal (since nCr = nCn−r)", "c": "Unrelated", "d": "Negatives of each other", "ans": "B", "exp": "Correct answer: Equal (since nCr = nCn−r). The expansion of (a + b)n has n + 1 terms; for even n = 2k, (x + a)n + (x − a)n leaves k + 1 surviving terms.", "tag": "NCERT"}, {"id": "I _Mat_97_4", "qno": 4, "q": "The number of terms after simplification in (x + a)n + (x − a)n when n is EVEN is:", "a": "n / 2", "b": "n + 1", "c": "(n / 2) + 1", "d": "n", "ans": "C", "exp": "Correct answer: (n / 2) + 1. The expansion of (a + b)n has n + 1 terms; for even n = 2k, (x + a)n + (x − a)n leaves k + 1 surviving terms.", "tag": "NCERT"}, {"id": "I _Mat_97_5", "qno": 5, "q": "The number of terms after simplification in (x + a)n − (x − a)n when n is EVEN is:", "a": "n / 2", "b": "n", "c": "(n / 2) + 1", "d": "n + 1", "ans": "A", "exp": "Correct answer: n / 2. The expansion of (a + b)n has n + 1 terms; for even n = 2k, (x + a)n + (x − a)n leaves k + 1 surviving terms.", "tag": "NCERT"}]}, {"chapter": "Chapter 8 - Seq & Series", "questions": [{"id": "I _Mat_98_1", "qno": 1, "q": "In an Arithmetic Progression (AP) with first term a and common difference d, the n-th term an is:", "a": "a dn−1", "b": "a − (n − 1) d", "c": "a + (n − 1) d", "d": "a + n d", "ans": "C", "exp": "Correct answer: a + (n − 1) d. In an AP, an = a + (n − 1)d and Sn = (n/2)(a + l); sum of first n natural numbers is n(n + 1)/2.", "tag": "NCERT"}, {"id": "I _Mat_98_2", "qno": 2, "q": "The sum Sn of the first n terms of an AP with first term a and last term l is:", "a": "2n (a + l)", "b": "n (a + l)", "c": "(n / 2)(a − l)", "d": "(n / 2)(a + l)", "ans": "D", "exp": "Correct answer: (n / 2)(a + l). In an AP, an = a + (n − 1)d and Sn = (n/2)(a + l); sum of first n natural numbers is n(n + 1)/2.", "tag": "NCERT"}, {"id": "I _Mat_98_3", "qno": 3, "q": "The sum of the first n natural numbers 1 + 2 + 3 + ··· + n equals:", "a": "n(n + 1)(2n + 1) / 6", "b": "n(n + 1) / 2", "c": "n(n − 1) / 2", "d": "n2", "ans": "B", "exp": "Correct answer: n(n + 1) / 2. In an AP, an = a + (n − 1)d and Sn = (n/2)(a + l); sum of first n natural numbers is n(n + 1)/2.", "tag": "NCERT"}, {"id": "I _Mat_98_4", "qno": 4, "q": "The sum of the first n positive odd integers 1 + 3 + 5 + ··· + (2n − 1) equals:", "a": "n2 + 1", "b": "n2", "c": "2n − 1", "d": "n(n + 1)", "ans": "B", "exp": "Correct answer: n2. In an AP, an = a + (n − 1)d and Sn = (n/2)(a + l); sum of first n natural numbers is n(n + 1)/2.", "tag": "NCERT"}, {"id": "I _Mat_98_5", "qno": 5, "q": "If a, b, c are in AP, then:", "a": "a + b + c = 0", "b": "2b = a + c", "c": "b = 2ac / (a + c)", "d": "b2 = ac", "ans": "B", "exp": "Correct answer: 2b = a + c. In an AP, an = a + (n − 1)d and Sn = (n/2)(a + l); sum of first n natural numbers is n(n + 1)/2.", "tag": "NCERT"}]}, {"chapter": "Chapter 9 - Straight Lines", "questions": [{"id": "I _Mat_99_1", "qno": 1, "q": "The slope m of a non-vertical straight line making inclination θ (0° ≤ θ < 180°, θ ≠ 90°) with the positive x-axis is:", "a": "m = cos θ", "b": "m = cot θ", "c": "m = tan θ", "d": "m = sin θ", "ans": "C", "exp": "Correct answer: m = tan θ. Slope of line through (x1, y1) and (x2, y2) is (y2 − y1)/(x2 − x1); parallel lines have m1 = m2, perpendicular lines have m1 m2 = −1.", "tag": "NCERT"}, {"id": "I _Mat_99_2", "qno": 2, "q": "Two non-vertical lines with slopes m1 and m2 are PERPENDICULAR if and only if:", "a": "m1 · m2 = −1", "b": "m1 = m2", "c": "m1 + m2 = 0", "d": "m1 · m2 = 1", "ans": "A", "exp": "Correct answer: m1 · m2 = −1. Slope of line through (x1, y1) and (x2, y2) is (y2 − y1)/(x2 − x1); parallel lines have m1 = m2, perpendicular lines have m1 m2 = −1.", "tag": "NCERT"}, {"id": "I _Mat_99_3", "qno": 3, "q": "Two non-vertical lines with slopes m1 and m2 are PARALLEL if and only if:", "a": "m1 · m2 = −1", "b": "m1 = m2", "c": "m1 + m2 = 1", "d": "m1 · m2 = 0", "ans": "B", "exp": "Correct answer: m1 = m2. Slope of line through (x1, y1) and (x2, y2) is (y2 − y1)/(x2 − x1); parallel lines have m1 = m2, perpendicular lines have m1 m2 = −1.", "tag": "NCERT"}, {"id": "I _Mat_99_4", "qno": 4, "q": "The acute angle θ between two non-vertical lines with slopes m1 and m2 (m1 m2 ≠ −1) is given by:", "a": "tan θ = |(m2 − m1) / (1 + m1 m2)|", "b": "tan θ = |m1 m2|", "c": "tan θ = |m1 − m2|", "d": "tan θ = |(m1 + m2) / (1 − m1 m2)|", "ans": "A", "exp": "tan θ = |(m2 − m1) / (1 + m1 m2)|. Slope of line through (x1, y1) and (x2, y2) is (y2 − y1)/(x2 − x1); parallel lines have m1 = m2, perpendicular lines have m1 m2 = −1.", "tag": "NCERT"}, {"id": "I _Mat_99_5", "qno": 5, "q": "The slope of any line parallel to the x-axis and any line parallel to the y-axis are respectively:", "a": "undefined and 0", "b": "0 and undefined (∞)", "c": "0 and 1", "d": "1 and −1", "ans": "B", "exp": "Correct answer: 0 and undefined (∞). Slope of line through (x1, y1) and (x2, y2) is (y2 − y1)/(x2 − x1); parallel lines have m1 = m2, perpendicular lines have m1 m2 = −1.", "tag": "NCERT"}]}, {"chapter": "Chapter 10 - Conic Sections", "questions": [{"id": "I _Mat_100_1", "qno": 1, "q": "The equation of a circle with centre (h, k) and radius r is:", "a": "x2 + y2 = r", "b": "(x + h)2 + (y + k)2 = r2", "c": "(x − h)2 − (y − k)2 = r2", "d": "(x − h)2 + (y − k)2 = r2", "ans": "D", "exp": "Correct answer: (x − h)2 + (y − k)2 = r2. Circle x2 + y2 + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g2 + f2 − c).", "tag": "NCERT"}, {"id": "I _Mat_100_2", "qno": 2, "q": "For the general circle x2 + y2 + 2gx + 2fy + c = 0, the centre and radius are respectively:", "a": "(−g, −f) and √(g2 + f2 − c)", "b": "(g, f) and √(g2 + f2 + c)", "c": "(g, f) and √(g2 + f2 − c)", "d": "(−2g, −2f) and √(g2 + f2 − c)", "ans": "A", "exp": "(−g, −f) and √(g2 + f2 − c). Circle x2 + y2 + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g2 + f2 − c).", "tag": "NCERT"}, {"id": "I _Mat_100_3", "qno": 3, "q": "A circle of radius r touching BOTH coordinate axes in the first quadrant has centre:", "a": "(r, 0)", "b": "(r, r)", "c": "(0, r)", "d": "(0, 0)", "ans": "B", "exp": "Correct answer: (r, r). Circle x2 + y2 + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g2 + f2 − c).", "tag": "NCERT"}, {"id": "I _Mat_100_4", "qno": 4, "q": "The equation of a circle with the line segment joining (x1, y1) and (x2, y2) as a diameter is:", "a": "(x + x1)(x + x2) + (y + y1)(y + y2) = 0", "b": "x2 + y2 = x1x2 + y1y2", "c": "(x − x1)(x − x2) − (y − y1)(y − y2) = 0", "d": "(x − x1)(x − x2) + (y − y1)(y − y2) = 0", "ans": "D", "exp": "(x − x1)(x − x2) + (y − y1)(y − y2) = 0. Circle x2 + y2 + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g2 + f2 − c).", "tag": "NCERT"}, {"id": "I _Mat_100_5", "qno": 5, "q": "The circle x2 + y2 + 2gx + 2fy + c = 0 represents a REAL circle with positive radius if and only if:", "a": "g2 + f2 = c", "b": "g2 + f2 − c > 0", "c": "c > 0", "d": "g2 + f2 − c < 0", "ans": "B", "exp": "Correct answer: g2 + f2 − c > 0. Circle x2 + y2 + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g2 + f2 − c).", "tag": "NCERT"}]}, {"chapter": "Chapter 11 - Intro to 3D Geom", "questions": [{"id": "I _Mat_101_1", "qno": 1, "q": "Three mutually perpendicular coordinate planes divide three-dimensional space into how many octants?", "a": "6 octants", "b": "4 quadrants", "c": "8 octants", "d": "12 octants", "ans": "C", "exp": "Correct answer: 8 octants. Three mutually perpendicular coordinate planes divide 3D space into 8 octants determined by the signs of (x, y, z).", "tag": "NCERT"}, {"id": "I _Mat_101_2", "qno": 2, "q": "Any point lying on the x-axis in 3D space has coordinates of the form:", "a": "(0, y, 0)", "b": "(x, 0, 0)", "c": "(x, y, 0)", "d": "(0, 0, z)", "ans": "B", "exp": "Correct answer: (x, 0, 0). Three mutually perpendicular coordinate planes divide 3D space into 8 octants determined by the signs of (x, y, z).", "tag": "NCERT"}, {"id": "I _Mat_101_3", "qno": 3, "q": "Any point lying in the YZ-plane has coordinates of the form:", "a": "(0, y, z)", "b": "(x, 0, z)", "c": "(x, 0, 0)", "d": "(x, y, 0)", "ans": "A", "exp": "Correct answer: (0, y, z). Three mutually perpendicular coordinate planes divide 3D space into 8 octants determined by the signs of (x, y, z).", "tag": "NCERT"}, {"id": "I _Mat_101_4", "qno": 4, "q": "The perpendicular distance of the point P(x, y, z) from the XY-plane is:", "a": "|x|", "b": "|y|", "c": "|z|", "d": "√(x2 + y2)", "ans": "C", "exp": "Correct answer: |z|. Three mutually perpendicular coordinate planes divide 3D space into 8 octants determined by the signs of (x, y, z).", "tag": "NCERT"}, {"id": "I _Mat_101_5", "qno": 5, "q": "The perpendicular distance of the point P(x, y, z) from the z-axis is:", "a": "√(y2 + z2)", "b": "|z|", "c": "√(x2 + y2)", "d": "√(x2 + z2)", "ans": "C", "exp": "Correct answer: √(x2 + y2). Three mutually perpendicular coordinate planes divide 3D space into 8 octants determined by the signs of (x, y, z).", "tag": "NCERT"}]}, {"chapter": "Chapter 12 - Limits & Deriv", "questions": [{"id": "I _Mat_102_1", "qno": 1, "q": "The limit limx→a f(x) exists if and only if:", "a": "Both the left-hand limit (LHL) and right-hand limit (RHL) exist, are finite, and are equal", "b": "f(x) is a polynomial", "c": "LHL = 0", "d": "f(a) is defined", "ans": "A", "exp": "Both the left-hand limit (LHL) and right-hand limit (RHL) exist, are finite, and are equal. A limit exists iff LHL = RHL is finite; for any polynomial P(x), limx→a P(x) = P(a) by direct substitution.", "tag": "NCERT"}, {"id": "I _Mat_102_2", "qno": 2, "q": "For any polynomial function P(x), the limit limx→a P(x) is always equal to:", "a": "0", "b": "P′(a)", "c": "∞", "d": "P(a)", "ans": "D", "exp": "Correct answer: P(a). A limit exists iff LHL = RHL is finite; for any polynomial P(x), limx→a P(x) = P(a) by direct substitution.", "tag": "NCERT"}, {"id": "I _Mat_102_3", "qno": 3, "q": "The limit limx→0 (|x| / x):", "a": "Equals 0", "b": "Equals 1", "c": "Does not exist (LHL = −1 ≠ RHL = +1)", "d": "Equals −1", "ans": "C", "exp": "Does not exist (LHL = −1 ≠ RHL = +1). A limit exists iff LHL = RHL is finite; for any polynomial P(x), limx→a P(x) = P(a) by direct substitution.", "tag": "NCERT"}, {"id": "I _Mat_102_4", "qno": 4, "q": "If limx→a f(x) = L and limx→a g(x) = M (M ≠ 0), then limx→a [f(x) / g(x)] equals:", "a": "0", "b": "L · M", "c": "L − M", "d": "L / M", "ans": "D", "exp": "Correct answer: L / M. A limit exists iff LHL = RHL is finite; for any polynomial P(x), limx→a P(x) = P(a) by direct substitution.", "tag": "NCERT"}, {"id": "I _Mat_102_5", "qno": 5, "q": "Assertion (A): The existence of limx→a f(x) does not depend on the value of f(a).\nReason (R): A limit describes the behaviour of f(x) as x approaches a arbitrarily closely (x ≠ a), not at x = a itself.", "a": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "b": "(A) is false but (R) is true", "c": "(A) is true but (R) is false", "d": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "ans": "A", "exp": "Both statements are true, and (R) directly explains (A): A limit describes the behaviour of f(x) as x approaches a arbitrarily closely (x ≠ a), not at x = a itself.", "tag": "NCERT"}]}, {"chapter": "Chapter 13 - Statistics", "questions": [{"id": "I _Mat_103_1", "qno": 1, "q": "The simplest measure of dispersion, defined as the difference between the maximum and minimum observations, is the:", "a": "Range", "b": "Variance", "c": "Standard deviation", "d": "Mean deviation", "ans": "A", "exp": "Correct answer: Range. Mean deviation about mean is (1/n) ∑ |xi − x̄|; sum of deviations from mean is 0, and absolute deviations are minimal about the median.", "tag": "NCERT"}, {"id": "I _Mat_103_2", "qno": 2, "q": "The mean deviation about the mean x̄ for n ungrouped observations x1, x2, ..., xn is:", "a": "(1 / n) ∑ |xi − x̄|", "b": "(1 / n) ∑ (xi − x̄)2", "c": "(1 / n) ∑ (xi − x̄)", "d": "√[(1 / n) ∑ (xi − x̄)2]", "ans": "A", "exp": "Correct answer: (1 / n) ∑ |xi − x̄|. Mean deviation about mean is (1/n) ∑ |xi − x̄|; sum of deviations from mean is 0, and absolute deviations are minimal about the median.", "tag": "NCERT"}, {"id": "I _Mat_103_3", "qno": 3, "q": "The sum of the algebraic deviations of all observations from their arithmetic mean, ∑ (xi − x̄), is ALWAYS equal to:", "a": "σ2", "b": "0", "c": "n x̄", "d": "1", "ans": "B", "exp": "Correct answer: 0. Mean deviation about mean is (1/n) ∑ |xi − x̄|; sum of deviations from mean is 0, and absolute deviations are minimal about the median.", "tag": "NCERT"}, {"id": "I _Mat_103_4", "qno": 4, "q": "The sum of absolute deviations ∑ |xi − a| is MINIMUM when the reference value a is taken as the:", "a": "Mode", "b": "Range", "c": "Median of the data", "d": "Arithmetic mean", "ans": "C", "exp": "Correct answer: Median of the data. Mean deviation about mean is (1/n) ∑ |xi − x̄|; sum of deviations from mean is 0, and absolute deviations are minimal about the median.", "tag": "NCERT"}, {"id": "I _Mat_103_5", "qno": 5, "q": "The sum of squared deviations ∑ (xi − a)2 is MINIMUM when the reference value a is taken as the:", "a": "Mode", "b": "Median", "c": "Arithmetic mean x̄", "d": "Minimum observation", "ans": "C", "exp": "Correct answer: Arithmetic mean x̄. Mean deviation about mean is (1/n) ∑ |xi − x̄|; sum of deviations from mean is 0, and absolute deviations are minimal about the median.", "tag": "NCERT"}]}, {"chapter": "Chapter 14 - Probability", "questions": [{"id": "I _Mat_104_1", "qno": 1, "q": "The set of all possible outcomes of a random experiment is called the:", "a": "Frequency distribution", "b": "Mean", "c": "Event", "d": "Sample space (S)", "ans": "D", "exp": "Correct answer: Sample space (S). Sample space S lists all possible outcomes; mutually exclusive events satisfy A ∩ B = ∅, exhaustive events satisfy union = S.", "tag": "NCERT"}, {"id": "I _Mat_104_2", "qno": 2, "q": "Two events A and B of a sample space S are called MUTUALLY EXCLUSIVE if:", "a": "A ∩ B = ∅ (they cannot occur simultaneously)", "b": "A ⊆ B", "c": "A ∪ B = S", "d": "P(A) = P(B)", "ans": "A", "exp": "A ∩ B = ∅ (they cannot occur simultaneously). Sample space S lists all possible outcomes; mutually exclusive events satisfy A ∩ B = ∅, exhaustive events satisfy union = S.", "tag": "NCERT"}, {"id": "I _Mat_104_3", "qno": 3, "q": "Events E1, E2, ..., En are called EXHAUSTIVE events if:", "a": "E1 ∩ E2 ∩ ··· ∩ En = ∅", "b": "P(E1) = 0", "c": "Each Ei is a singleton", "d": "E1 ∪ E2 ∪ ··· ∪ En = S", "ans": "D", "exp": "Correct answer: E1 ∪ E2 ∪ ··· ∪ En = S. Sample space S lists all possible outcomes; mutually exclusive events satisfy A ∩ B = ∅, exhaustive events satisfy union = S.", "tag": "NCERT"}, {"id": "I _Mat_104_4", "qno": 4, "q": "An event having NO sample points (∅) is called an impossible event, and its probability is:", "a": "Undefined", "b": "0", "c": "1 / 2", "d": "1", "ans": "B", "exp": "Correct answer: 0. Sample space S lists all possible outcomes; mutually exclusive events satisfy A ∩ B = ∅, exhaustive events satisfy union = S.", "tag": "NCERT"}, {"id": "I _Mat_104_5", "qno": 5, "q": "When a fair coin is tossed n times simultaneously, the total number of outcomes in the sample space S is:", "a": "n2", "b": "n!", "c": "2 n", "d": "2n", "ans": "D", "exp": "Correct answer: 2n. Sample space S lists all possible outcomes; mutually exclusive events satisfy A ∩ B = ∅, exhaustive events satisfy union = S.", "tag": "NCERT"}]}, {"chapter": "Verified KCET PYQs", "questions": [{"id": "I _Mat_105_1", "qno": 1, "q": "[KCET 2025] If A = {x : x ∈ Z and x2 − 9 = 0}, B = {x : x ∈ N and 2 ≤ x < 5}, and C = {x : x is a prime number ≤ 4}, then (B − C) ∪ A is:", "a": "{2, 3, 5}", "b": "{−3, 3, 4}", "c": "{3, 4, 5}", "d": "{2, 3, 4}", "ans": "B", "exp": "A = {−3, 3}, B = {2, 3, 4}, C = {2, 3}. Hence B − C = {4}, and (B − C) ∪ A = {−3, 3, 4}.", "tag": "PYQ"}, {"id": "I _Mat_105_2", "qno": 2, "q": "[KCET 2025] A and B are two sets having 3 and 6 elements respectively.\nStatement (I): Minimum number of elements in A ∪ B is 3.\nStatement (II): Maximum number of elements in A ∩ B is 3.\nWhich of the following is correct?", "a": "Both Statements (I) and (II) are false", "b": "Statement (I) is true, Statement (II) is false", "c": "Both Statements (I) and (II) are true", "d": "Statement (I) is false, Statement (II) is true", "ans": "D", "exp": "Minimum n(A ∪ B) = max(3, 6) = 6 (Statement I false), and maximum n(A ∩ B) = min(3, 6) = 3 (Statement II true).", "tag": "PYQ"}, {"id": "I _Mat_105_3", "qno": 3, "q": "[KCET 2025] The domain of the real function f(x) = 1 / √((x − 2)(x − 5)) is:", "a": "(−∞, 3] ∪ (5, ∞)", "b": "(−∞, 2] ∪ [5, ∞)", "c": "(−∞, 3) ∪ (5, ∞)", "d": "(−∞, 2) ∪ (5, ∞)", "ans": "D", "exp": "For f(x) to be real and defined, (x − 2)(x − 5) > 0, which holds for x < 2 or x > 5, i.e., (−∞, 2) ∪ (5, ∞).", "tag": "PYQ"}, {"id": "I _Mat_105_4", "qno": 4, "q": "[KCET 2025] If cos x + cos2 x = 1, then the value of sin2 x + sin4 x is:", "a": "2", "b": "0", "c": "1", "d": "−1", "ans": "C", "exp": "From cos x = 1 − cos2 x = sin2 x, we get sin2 x + sin4 x = cos x + cos2 x = 1.", "tag": "PYQ"}, {"id": "I _Mat_105_5", "qno": 5, "q": "[KCET 2025] Which of the following trigonometric equalities is NOT correct?", "a": "cos 5π = cos 4π", "b": "sin 4π = sin 6π", "c": "tan 45° = tan(−315°)", "d": "sin 2π = sin(−2π)", "ans": "A", "exp": "cos 5π = −1 whereas cos 4π = +1, so cos 5π = cos 4π is false.", "tag": "PYQ"}]}], "II PUC|Mathematics": [{"chapter": "Chapter 1 - Relations & Func", "questions": [{"id": "II_Mat_106_1", "qno": 1, "q": "A relation R on a non-empty set A is called an EQUIVALENCE relation if and only if R is:", "a": "Symmetric and transitive only", "b": "Reflexive and symmetric only", "c": "Empty", "d": "Reflexive, symmetric, and transitive", "ans": "D", "exp": "Reflexive, symmetric, and transitive. An equivalence relation is reflexive, symmetric, and transitive; on n elements there are 2 raised to (n2−n) reflexive and 2 raised to (n(n+1)/2) symmetric relations.", "tag": "NCERT"}, {"id": "II_Mat_106_2", "qno": 2, "q": "A relation R on set A is reflexive if:", "a": "(a, a) ∉ R for all a ∈ A", "b": "R = ∅", "c": "(a, b) ∈ R ⇒ (b, a) ∈ R", "d": "(a, a) ∈ R for every a ∈ A", "ans": "D", "exp": "(a, a) ∈ R for every a ∈ A. An equivalence relation is reflexive, symmetric, and transitive; on n elements there are 2 raised to (n2−n) reflexive and 2 raised to (n(n+1)/2) symmetric relations.", "tag": "NCERT"}, {"id": "II_Mat_106_3", "qno": 3, "q": "The relation R = {(a, b) ∈ ℤ × ℤ : a − b is divisible by 5} on the set of integers ℤ is:", "a": "Reflexive only", "b": "An equivalence relation", "c": "Symmetric only", "d": "Neither reflexive nor transitive", "ans": "B", "exp": "Correct answer: An equivalence relation. An equivalence relation is reflexive, symmetric, and transitive; on n elements there are 2 raised to (n2−n) reflexive and 2 raised to (n(n+1)/2) symmetric relations.", "tag": "NCERT"}, {"id": "II_Mat_106_4", "qno": 4, "q": "The relation 'is perpendicular to' on the set of all straight lines in a plane is:", "a": "An equivalence relation", "b": "Transitive only", "c": "Symmetric, but neither reflexive nor transitive", "d": "Reflexive and transitive", "ans": "C", "exp": "Symmetric, but neither reflexive nor transitive. An equivalence relation is reflexive, symmetric, and transitive; on n elements there are 2 raised to (n2−n) reflexive and 2 raised to (n(n+1)/2) symmetric relations.", "tag": "NCERT"}, {"id": "II_Mat_106_5", "qno": 5, "q": "Assertion (A): The relation R = {(a, b) ∈ ℝ × ℝ : a ≤ b} is reflexive and transitive, but NOT symmetric.\nReason (R): While a ≤ a and (a ≤ b, b ≤ c ⇒ a ≤ c) hold for all reals, 2 ≤ 3 does not imply 3 ≤ 2.", "a": "(A) is true but (R) is false", "b": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "c": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "d": "(A) is false but (R) is true", "ans": "B", "exp": "Both statements are true, and (R) directly explains (A): While a ≤ a and (a ≤ b, b ≤ c ⇒ a ≤ c) hold for all reals, 2 ≤ 3 does not imply 3 ≤ 2.", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Inverse Trig Func", "questions": [{"id": "II_Mat_107_1", "qno": 1, "q": "The domain and principal value branch (range) of y = sin−1 x are respectively:", "a": "[−1, 1] and [0, π]", "b": "ℝ and (−π/2, π/2)", "c": "[−1, 1] and [−π/2, π/2]", "d": "ℝ and [−π/2, π/2]", "ans": "C", "exp": "Correct answer: [−1, 1] and [−π/2, π/2]. Principal value branches: sin−1 x ∈ [−π/2, π/2], cos−1 x ∈ [0, π], tan−1 x ∈ (−π/2, π/2), cot−1 x ∈ (0, π).", "tag": "NCERT"}, {"id": "II_Mat_107_2", "qno": 2, "q": "The domain and principal value branch (range) of y = cos−1 x are respectively:", "a": "[−1, 1] and [−π/2, π/2]", "b": "(−1, 1) and (0, π)", "c": "[−1, 1] and [0, π]", "d": "ℝ and (0, π)", "ans": "C", "exp": "Correct answer: [−1, 1] and [0, π]. Principal value branches: sin−1 x ∈ [−π/2, π/2], cos−1 x ∈ [0, π], tan−1 x ∈ (−π/2, π/2), cot−1 x ∈ (0, π).", "tag": "NCERT"}, {"id": "II_Mat_107_3", "qno": 3, "q": "The domain and principal value branch (range) of y = tan−1 x are respectively:", "a": "ℝ and (0, π)", "b": "[−1, 1] and (−π/2, π/2)", "c": "ℝ and (−π/2, π/2)", "d": "ℝ and [−π/2, π/2]", "ans": "C", "exp": "Correct answer: ℝ and (−π/2, π/2). Principal value branches: sin−1 x ∈ [−π/2, π/2], cos−1 x ∈ [0, π], tan−1 x ∈ (−π/2, π/2), cot−1 x ∈ (0, π).", "tag": "NCERT"}, {"id": "II_Mat_107_4", "qno": 4, "q": "The principal value branch (range) of y = cot−1 x is:", "a": "(−π/2, π/2)", "b": "[−π/2, π/2] − {0}", "c": "(0, π)", "d": "[0, π]", "ans": "C", "exp": "Correct answer: (0, π). Principal value branches: sin−1 x ∈ [−π/2, π/2], cos−1 x ∈ [0, π], tan−1 x ∈ (−π/2, π/2), cot−1 x ∈ (0, π).", "tag": "NCERT"}, {"id": "II_Mat_107_5", "qno": 5, "q": "The principal value branch (range) of y = sec−1 x is:", "a": "[−π/2, π/2] − {0}", "b": "(0, π)", "c": "ℝ − (−1, 1)", "d": "[0, π] − {π/2}", "ans": "D", "exp": "Correct answer: [0, π] − {π/2}. Principal value branches: sin−1 x ∈ [−π/2, π/2], cos−1 x ∈ [0, π], tan−1 x ∈ (−π/2, π/2), cot−1 x ∈ (0, π).", "tag": "NCERT"}]}, {"chapter": "Chapter 3 - Matrices", "questions": [{"id": "II_Mat_108_1", "qno": 1, "q": "A square matrix A = [aiⱼ] of order n × n is a DIAGONAL matrix if:", "a": "aiⱼ = 0 whenever i ≠ j", "b": "aiⱼ = 0 whenever i = j", "c": "aiⱼ = 1 for all i, j", "d": "aiⱼ = aⱼi for all i, j", "ans": "A", "exp": "Correct answer: aiⱼ = 0 whenever i ≠ j. A matrix of order m × n has m n entries; diagonal matrices have aiⱼ = 0 for i ≠ j, and scalar matrices have equal diagonal entries.", "tag": "NCERT"}, {"id": "II_Mat_108_2", "qno": 2, "q": "A diagonal matrix in which all principal diagonal elements are equal to the same scalar k is called a:", "a": "Skew-symmetric matrix", "b": "Row matrix", "c": "Column matrix", "d": "Scalar matrix", "ans": "D", "exp": "Correct answer: Scalar matrix. A matrix of order m × n has m n entries; diagonal matrices have aiⱼ = 0 for i ≠ j, and scalar matrices have equal diagonal entries.", "tag": "NCERT"}, {"id": "II_Mat_108_3", "qno": 3, "q": "The number of all possible matrices of order 3 × 3 with each entry being either 0 or 1 is:", "a": "27", "b": "18", "c": "29 = 512", "d": "81", "ans": "C", "exp": "Correct answer: 29 = 512. A matrix of order m × n has m n entries; diagonal matrices have aiⱼ = 0 for i ≠ j, and scalar matrices have equal diagonal entries.", "tag": "NCERT"}, {"id": "II_Mat_108_4", "qno": 4, "q": "If a matrix has m rows and n columns, the total number of elements in the matrix is:", "a": "mn", "b": "2mn", "c": "m × n", "d": "m + n", "ans": "C", "exp": "Correct answer: m × n. A matrix of order m × n has m n entries; diagonal matrices have aiⱼ = 0 for i ≠ j, and scalar matrices have equal diagonal entries.", "tag": "NCERT"}, {"id": "II_Mat_108_5", "qno": 5, "q": "A matrix A = [aiⱼ]mxn is a square matrix if and only if:", "a": "m = n", "b": "m > n", "c": "m · n = 1", "d": "m < n", "ans": "A", "exp": "Correct answer: m = n. A matrix of order m × n has m n entries; diagonal matrices have aiⱼ = 0 for i ≠ j, and scalar matrices have equal diagonal entries.", "tag": "NCERT"}]}, {"chapter": "Chapter 4 - Determinants", "questions": [{"id": "II_Mat_109_1", "qno": 1, "q": "If A is a square matrix of order n and k is a scalar, then |k A| equals:", "a": "kn |A|", "b": "kn−1 |A|", "c": "k |A|", "d": "n k |A|", "ans": "A", "exp": "Correct answer: kn |A|. For an n × n matrix A, |k A| = kn |A|, |AB| = |A||B|, |Aᵀ| = |A|, and odd-order skew-symmetric matrices have determinant 0.", "tag": "NCERT"}, {"id": "II_Mat_109_2", "qno": 2, "q": "For any two square matrices A and B of the same order, |AB| equals:", "a": "|A| / |B|", "b": "|A| + |B|", "c": "|A| · |B|", "d": "|A| − |B|", "ans": "C", "exp": "Correct answer: |A| · |B|. For an n × n matrix A, |k A| = kn |A|, |AB| = |A||B|, |Aᵀ| = |A|, and odd-order skew-symmetric matrices have determinant 0.", "tag": "NCERT"}, {"id": "II_Mat_109_3", "qno": 3, "q": "The determinant of any skew-symmetric matrix of ODD order (such as 3 × 3) is always:", "a": "−1", "b": "1", "c": "0", "d": "Undefined", "ans": "C", "exp": "Correct answer: 0. For an n × n matrix A, |k A| = kn |A|, |AB| = |A||B|, |Aᵀ| = |A|, and odd-order skew-symmetric matrices have determinant 0.", "tag": "NCERT"}, {"id": "II_Mat_109_4", "qno": 4, "q": "For any square matrix A, |Aᵀ| (determinant of transpose) is equal to:", "a": "0", "b": "|A|", "c": "1 / |A|", "d": "−|A|", "ans": "B", "exp": "Correct answer: |A|. For an n × n matrix A, |k A| = kn |A|, |AB| = |A||B|, |Aᵀ| = |A|, and odd-order skew-symmetric matrices have determinant 0.", "tag": "NCERT"}, {"id": "II_Mat_109_5", "qno": 5, "q": "If a square matrix A has |A| = 0, then A is called a:", "a": "Non-singular matrix", "b": "Singular matrix (non-invertible)", "c": "Orthogonal matrix", "d": "Identity matrix", "ans": "B", "exp": "Singular matrix (non-invertible). For an n × n matrix A, |k A| = kn |A|, |AB| = |A||B|, |Aᵀ| = |A|, and odd-order skew-symmetric matrices have determinant 0.", "tag": "NCERT"}]}, {"chapter": "Chapter 5 - Cont & Diff", "questions": [{"id": "II_Mat_110_1", "qno": 1, "q": "A real function f(x) is continuous at x = c if and only if:", "a": "limx→c f(x) = 0", "b": "f′(c) = 0", "c": "limx→c f(x) exists, f(c) is defined, and limx→c f(x) = f(c)", "d": "f(c) is defined only", "ans": "C", "exp": "limx→c f(x) exists, f(c) is defined, and limx→c f(x) = f(c). Continuity at x = c requires LHL = RHL = f(c); differentiability implies continuity, though corners like |x| are continuous yet non-differentiable.", "tag": "NCERT"}, {"id": "II_Mat_110_2", "qno": 2, "q": "The greatest integer function f(x) = [x] is discontinuous at:", "a": "Every integer point x ∈ ℤ (and continuous at all non-integers)", "b": "Only x = 0", "c": "Every real number", "d": "No real numbers", "ans": "A", "exp": "Every integer point x ∈ ℤ (and continuous at all non-integers). Continuity at x = c requires LHL = RHL = f(c); differentiability implies continuity, though corners like |x| are continuous yet non-differentiable.", "tag": "NCERT"}, {"id": "II_Mat_110_3", "qno": 3, "q": "Every polynomial function, sin x, cos x, and ex are continuous on:", "a": "Only integers", "b": "Only [−1, 1]", "c": "Only (0, ∞)", "d": "The entire real line ℝ", "ans": "D", "exp": "Correct answer: The entire real line ℝ. Continuity at x = c requires LHL = RHL = f(c); differentiability implies continuity, though corners like |x| are continuous yet non-differentiable.", "tag": "NCERT"}, {"id": "II_Mat_110_4", "qno": 4, "q": "If f(x) = |x|, then at x = 0 the function f is:", "a": "Continuous, but NOT differentiable", "b": "Neither continuous nor differentiable", "c": "Both continuous and differentiable", "d": "Differentiable, but not continuous", "ans": "A", "exp": "Continuous, but NOT differentiable. Continuity at x = c requires LHL = RHL = f(c); differentiability implies continuity, though corners like |x| are continuous yet non-differentiable.", "tag": "NCERT"}, {"id": "II_Mat_110_5", "qno": 5, "q": "Assertion (A): Every differentiable function is continuous, but the converse is NOT necessarily true.\nReason (R): f(x) = |x| is continuous at x = 0, yet its left-hand derivative (−1) does not equal its right-hand derivative (+1).", "a": "(A) is false but (R) is true", "b": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "c": "(A) is true but (R) is false", "d": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "ans": "D", "exp": "Both statements are true, and (R) directly explains (A): f(x) = |x| is continuous at x = 0, yet its left-hand derivative (−1) does not equal its right-hand derivative (+1).", "tag": "NCERT"}]}, {"chapter": "Chapter 6 - Appl of Deriv", "questions": [{"id": "II_Mat_111_1", "qno": 1, "q": "The rate of change of the area A = π r2 of a circle with respect to its radius r is:", "a": "4 π r", "b": "π r", "c": "π r2", "d": "2 π r (equal to its circumference)", "ans": "D", "exp": "2 π r (equal to its circumference). Instantaneous rates apply chain rule: dA/dt = 2π r (dr/dt) for a circle and dV/dt = 3x2 (dx/dt) for a cube.", "tag": "NCERT"}, {"id": "II_Mat_111_2", "qno": 2, "q": "The rate of change of the volume V = (4/3) π r3 of a sphere with respect to its radius r is:", "a": "(4/3) π r2", "b": "8 π r", "c": "2 π r2", "d": "4 π r2 (equal to its surface area)", "ans": "D", "exp": "4 π r2 (equal to its surface area). Instantaneous rates apply chain rule: dA/dt = 2π r (dr/dt) for a circle and dV/dt = 3x2 (dx/dt) for a cube.", "tag": "NCERT"}, {"id": "II_Mat_111_3", "qno": 3, "q": "The rate of change of the volume V = x3 of a cube with respect to its edge length x is:", "a": "3 x", "b": "6 x2", "c": "x2", "d": "3 x2", "ans": "D", "exp": "Correct answer: 3 x2. Instantaneous rates apply chain rule: dA/dt = 2π r (dr/dt) for a circle and dV/dt = 3x2 (dx/dt) for a cube.", "tag": "NCERT"}, {"id": "II_Mat_111_4", "qno": 4, "q": "In economics, the marginal cost MC(x) is defined as the instantaneous rate of change of total cost C(x) with respect to output x, namely:", "a": "dC / dx", "b": "d2C / dx2", "c": "x · C(x)", "d": "C(x) / x", "ans": "A", "exp": "Correct answer: dC / dx. Instantaneous rates apply chain rule: dA/dt = 2π r (dr/dt) for a circle and dV/dt = 3x2 (dx/dt) for a cube.", "tag": "NCERT"}, {"id": "II_Mat_111_5", "qno": 5, "q": "If a balloon's radius r increases at rate dr/dt, then its volume V = (4/3) π r3 increases at rate:", "a": "(4/3) π r3 (dr/dt)", "b": "4 π r (dr/dt)", "c": "π r2 (dr/dt)", "d": "dV/dt = 4 π r2 (dr/dt)", "ans": "D", "exp": "Correct answer: dV/dt = 4 π r2 (dr/dt). Instantaneous rates apply chain rule: dA/dt = 2π r (dr/dt) for a circle and dV/dt = 3x2 (dx/dt) for a cube.", "tag": "NCERT"}]}, {"chapter": "Chapter 7 - Integrals", "questions": [{"id": "II_Mat_112_1", "qno": 1, "q": "For n ≠ −1, the indefinite integral ∫ xn dx equals:", "a": "xn+1 / (n + 1) + C", "b": "xn / n + C", "c": "xn+1 + C", "d": "n xn−1 + C", "ans": "A", "exp": "Correct answer: xn+1 / (n + 1) + C. Power rule gives ∫ xn dx = xn+1/(n + 1) + C (n ≠ −1), ∫ (1/x) dx = ln|x| + C, and ∫ [f′(x)/f(x)] dx = ln|f(x)| + C.", "tag": "NCERT"}, {"id": "II_Mat_112_2", "qno": 2, "q": "The indefinite integral ∫ (1 / x) dx (for x ≠ 0) equals:", "a": "x + C", "b": "ex + C", "c": "ln |x| + C", "d": "−1 / x2 + C", "ans": "C", "exp": "Correct answer: ln |x| + C. Power rule gives ∫ xn dx = xn+1/(n + 1) + C (n ≠ −1), ∫ (1/x) dx = ln|x| + C, and ∫ [f′(x)/f(x)] dx = ln|f(x)| + C.", "tag": "NCERT"}, {"id": "II_Mat_112_3", "qno": 3, "q": "The indefinite integral ∫ sec2 x dx equals:", "a": "tan x + C", "b": "cot x + C", "c": "−tan x + C", "d": "sec x + C", "ans": "A", "exp": "Correct answer: tan x + C. Power rule gives ∫ xn dx = xn+1/(n + 1) + C (n ≠ −1), ∫ (1/x) dx = ln|x| + C, and ∫ [f′(x)/f(x)] dx = ln|f(x)| + C.", "tag": "NCERT"}, {"id": "II_Mat_112_4", "qno": 4, "q": "The indefinite integral ∫ (1 / (1 + x2)) dx equals:", "a": "ln(1 + x2) + C", "b": "tan−1 x + C", "c": "sin−1 x + C", "d": "sec−1 x + C", "ans": "B", "exp": "Correct answer: tan−1 x + C. Power rule gives ∫ xn dx = xn+1/(n + 1) + C (n ≠ −1), ∫ (1/x) dx = ln|x| + C, and ∫ [f′(x)/f(x)] dx = ln|f(x)| + C.", "tag": "NCERT"}, {"id": "II_Mat_112_5", "qno": 5, "q": "The indefinite integral ∫ (1 / √(1 − x2)) dx equals:", "a": "ln|1 − x2| + C", "b": "sin−1 x + C", "c": "tan−1 x + C", "d": "sec−1 x + C", "ans": "B", "exp": "Correct answer: sin−1 x + C. Power rule gives ∫ xn dx = xn+1/(n + 1) + C (n ≠ −1), ∫ (1/x) dx = ln|x| + C, and ∫ [f′(x)/f(x)] dx = ln|f(x)| + C.", "tag": "NCERT"}]}, {"chapter": "Chapter 8 - Appl of Integrals", "questions": [{"id": "II_Mat_113_1", "qno": 1, "q": "The area bounded by a continuous curve y = f(x), the x-axis, and the vertical lines x = a and x = b (a < b) is:", "a": "∫aᵇ f(x) dx (even if f changes sign)", "b": "∫aᵇ |f(x)| dx", "c": "f(b) − f(a)", "d": "f′(b) − f′(a)", "ans": "B", "exp": "Correct answer: ∫aᵇ |f(x)| dx. Geometric area under y = f(x) over [a, b] is ∫aᵇ |f(x)| dx, taking absolute values where f(x) < 0.", "tag": "NCERT"}, {"id": "II_Mat_113_2", "qno": 2, "q": "The area bounded by a curve x = g(y), the y-axis, and horizontal lines y = c and y = d (c < d) is:", "a": "∫ from c to d of |g(y)| dy", "b": "∫ from c to d of g′(y) dy", "c": "π ∫ g(y) dy", "d": "g(d) − g(c)", "ans": "A", "exp": "∫ from c to d of |g(y)| dy. Geometric area under y = f(x) over [a, b] is ∫aᵇ |f(x)| dx, taking absolute values where f(x) < 0.", "tag": "NCERT"}, {"id": "II_Mat_113_3", "qno": 3, "q": "The area bounded by y = x, the x-axis, and the ordinates x = −1 and x = 2 is:", "a": "½ + 2 = 5 / 2 sq. units", "b": "3 / 2 sq. units", "c": "3 sq. units", "d": "2 sq. units", "ans": "A", "exp": "Correct answer: ½ + 2 = 5 / 2 sq. units. Geometric area under y = f(x) over [a, b] is ∫aᵇ |f(x)| dx, taking absolute values where f(x) < 0.", "tag": "NCERT"}, {"id": "II_Mat_113_4", "qno": 4, "q": "The area bounded by the curve y = x3, the x-axis, and the lines x = −2 and x = 2 is:", "a": "4 sq. units", "b": "0 sq. units", "c": "2 × ∫02 x3 dx = 8 sq. units", "d": "16 sq. units", "ans": "C", "exp": "2 × ∫02 x3 dx = 8 sq. units. Geometric area under y = f(x) over [a, b] is ∫aᵇ |f(x)| dx, taking absolute values where f(x) < 0.", "tag": "NCERT"}, {"id": "II_Mat_113_5", "qno": 5, "q": "Assertion (A): To find the geometric area enclosed by y = sin x and the x-axis from x = 0 to x = 2π, we integrate |sin x|, obtaining 4 sq. units.\nReason (R): A signed definite integral ∫ from 0 to 2π sin x dx equals 0 because the positive and negative lobes cancel, whereas geometric area is always non-negative.", "a": "(A) is false but (R) is true", "b": "(A) is true but (R) is false", "c": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "d": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "ans": "C", "exp": "Both statements are true, and (R) directly explains (A): A signed definite integral ∫ from 0 to 2π sin x dx equals 0 because the positive and negative lobes cancel, whereas geometric area is always non-negative.", "tag": "NCERT"}]}, {"chapter": "Chapter 9 - Diff Equations", "questions": [{"id": "II_Mat_114_1", "qno": 1, "q": "The ORDER of a differential equation is defined as:", "a": "The number of arbitrary constants plus one", "b": "The order of the highest-order derivative appearing in the equation", "c": "The highest power of x", "d": "The power of the lowest derivative", "ans": "B", "exp": "The order of the highest-order derivative appearing in the equation. Order is the highest derivative order; degree is its highest positive integral power (when polynomial in derivatives); general solution has n constants.", "tag": "NCERT"}, {"id": "II_Mat_114_2", "qno": 2, "q": "The DEGREE of a differential equation (when it is a polynomial equation in derivatives) is:", "a": "The highest positive integral power of the highest-order derivative", "b": "Always equal to its order", "c": "Always 1", "d": "The highest p     function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (s.exams) state.exams = s.exams;
          if (s.lecturerProfiles) state.lecturerProfiles = s.lecturerProfiles;
          if (s.appsScriptUrl) state.appsScriptUrl = s.appsScriptUrl;
          if (s.firebaseConfig && s.firebaseConfig.apiKey) state.firebaseConfig = s.firebaseConfig;
          if (s.session && s.session.email) state.session = s.session;
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          exams: state.exams,
          lecturerProfiles: state.lecturerProfiles,
          appsScriptUrl: state.appsScriptUrl,
          firebaseConfig: state.firebaseConfig,
          session: state.session
        }));
      } catch (e) {}
    }

    function isFirebaseConfigured() {
      return !!(state.firebaseConfig && state.firebaseConfig.apiKey && state.firebaseConfig.projectId);
    }

    function initFirebaseIfReady() {
      if (!isFirebaseConfigured() || typeof firebase === 'undefined') {
        fbAuth = null;
        return false;
      }
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(state.firebaseConfig);
        }
        fbAuth = firebase.auth();
        try { fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
        fbAuth.onAuthStateChanged((user) => {
          if (user && user.email) {
            completeLogin(user.email, user.displayName || user.email.split('@')[0], true);
          }
        });
        return true;
      } catch (err) {
        fbAuth = null;
        return false;
      }
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function toast(msg, kind = 'info') {
      const box = document.getElementById('toastBox');
      const colors = {
        success: 'bg-emerald-700 text-white border-emerald-500',
        error: 'bg-rose-700 text-white border-rose-500',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `fade-in px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ${colors[kind] || colors.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => { el.remove(); }, 3800);
    }

    async function callAppsScript(method, payloadOrParams) {
      const url = (state.appsScriptUrl || '').trim();
      if (!url || !url.startsWith('https://')) {
        return { ok: false, offline: true };
      }
      try {
        let resp;
        if (method === 'GET') {
          const qs = new URLSearchParams(payloadOrParams || {}).toString();
          resp = await fetch(url + (url.includes('?') ? '&' : '?') + qs);
        } else {
          resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payloadOrParams || {})
          });
        }
        return await resp.json();
      } catch (err) {
        return { ok: false, error: String(err) };
      }
    }

    async function completeLogin(rawEmail, displayName, silent = false) {
      const email = String(rawEmail || '').trim().toLowerCase();
      if (!email || !email.includes('@')) {
        toast('Please enter a valid email address.', 'error');
        return;
      }
      // Pull latest Drive registry if Apps Script URL is connected
      if (state.appsScriptUrl) {
        const synced = await callAppsScript('GET', { action: 'getState' });
        if (synced && synced.ok) {
          if (synced.exams) state.exams = synced.exams;
          if (synced.lecturerProfiles) state.lecturerProfiles = synced.lecturerProfiles;
          saveState();
        }
      }

      if (PORTAL_MODE === 'admin' && email !== ADMIN_EMAIL) {
        toast('Admin access is restricted to ' + ADMIN_EMAIL + '. Lecturers please use Lecturer Login on the homepage.', 'error');
        return;
      }
      if (email === ADMIN_EMAIL) {
        state.session = { email, name: displayName || 'Admin', role: 'admin', subject: null };
        if (!silent) toast('Signed in as Admin (' + ADMIN_EMAIL + ')', 'success');
      } else {
        const prof = state.lecturerProfiles[email] || null;
        state.session = {
          email,
          name: (prof && prof.name) || displayName || email.split('@')[0],
          role: 'lecturer',
          subject: prof ? prof.subject : null
        };
        state.lecView = 'exams';
        if (!silent) {
          toast(prof ? `Welcome back! Locked to ${prof.subject}.` : 'First-time login: please select your subject.', 'success');
        }
      }
      saveState();
      render();
    }

    function downloadExamExcelAdminOnly(examId) {
      if (!state.session || state.session.role !== 'admin') return;
      const exam = state.exams.find(e => e.id === examId);
      if (!exam || typeof XLSX === 'undefined') return;
      const cfg = TEMPLATE_CONFIG[exam.type] || TEMPLATE_CONFIG.NEET;
      const wb = XLSX.utils.book_new();
      const headers = ['Q.No', 'Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Diagram (Optional)', 'Correct Answer'];

      cfg.subjects.forEach(sub => {
        const picked = (exam.selections && exam.selections[sub.name]) ? exam.selections[sub.name] : [];
        const rows = [headers];
        const totalRows = Math.max(sub.quota, picked.length);
        for (let i = 0; i < totalRows; i++) {
          const q = picked[i];
          rows.push(q ? [i + 1, q.q || '', q.a || '', q.b || '', q.c || '', q.d || '', q.img || q.diagram || '', q.ans || ''] : [i + 1, '', '', '', '', '', '', '']);
        }
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{ wch: 8 }, { wch: 54 }, { wch: 24 }, { wch: 24 }, { wch: 24 }, { wch: 24 }, { wch: 24 }, { wch: 15 }];
        XLSX.utils.book_append_sheet(wb, ws, sub.name);
      });

      const safeName = (exam.name || 'Exam').replace(/[^a-zA-Z0-9_-]+/g, '_');
      const fname = `${safeName}_${exam.examClass.replace(/\s+/g, '_')}_${exam.type}_${cfg.total}Q.xlsx`;
      XLSX.writeFile(wb, fname);
      toast(`Downloaded ${fname}`, 'success');
    }

    function handleUploadBankXlsx(file, cls, subj) {
      if (!file || typeof XLSX === 'undefined') return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          const chapters = [];
          let loadedQ = 0;
          wb.SheetNames.forEach((sname, sIdx) => {
            const ws = wb.Sheets[sname];
            const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            const qs = [];
            for (let r = 1; r < aoa.length; r++) {
              const row = aoa[r];
              const qno = Number(row[0]);
              if (!qno || isNaN(qno)) continue;
              const ans = String(row[7] || '').trim().toUpperCase();
              if (!['A', 'B', 'C', 'D'].includes(ans)) continue;
              qs.push({
                id: `${cls.slice(0,2)}_${subj.slice(0,3)}_${sIdx}_${qno}`,
                qno,
                q: String(row[1] || '').trim(),
                a: String(row[2] || '').trim(),
                b: String(row[3] || '').trim(),
                c: String(row[4] || '').trim(),
                d: String(row[5] || '').trim(),
                ans,
                exp: String(row[8] || '').trim() || 'Verified against NCERT textbook.',
                tag: /PYQ/i.test(sname) ? 'PYQ' : (/(Booster|High-Order|Statement|Experimental|Practical)/i.test(sname) ? 'Booster' : 'NCERT')
              });
            }
            if (qs.length > 0) {
              chapters.push({ chapter: sname, questions: qs });
              loadedQ += qs.length;
            }
          });
          if (loadedQ === 0) { toast('No valid MCQ rows found.', 'error'); return; }
          state.bank[`${cls}|${subj}`] = chapters;
          toast(`Loaded ${loadedQ.toLocaleString()} questions (${chapters.length} chapters) into ${cls} ${subj}!`, 'success');
          render();
        } catch (err) {
          toast('Failed to read Excel file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    let DIAGRAMS_MAP = {};
    let diagramsLoaded = false;

    async function ensureDiagramsLoaded() {
      if (diagramsLoaded) return;
      try {
        const resp = await fetch('question_banks_json/diagrams_bundle.json.gz');
        if (resp.ok && typeof DecompressionStream !== 'undefined' && resp.body) {
          const ds = new DecompressionStream('gzip');
          const text = await new Response(resp.body.pipeThrough(ds)).text();
          DIAGRAMS_MAP = JSON.parse(text) || {};
          diagramsLoaded = true;
          render();
        }
      } catch (e) {}
    }

    function getDiagramSrc(imgKey) {
      if (!imgKey) return '';
      if (imgKey.startsWith('data:') || imgKey.startsWith('http')) return imgKey;
      return DIAGRAMS_MAP[imgKey] || '';
    }

    // Word-style Math & Chemical Equation HTML Formatter (Cambria Math / Times New Roman)
    const UNI_SUP = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-','ⁿ':'n','ⁱ':'i' };
    const UNI_SUB = { '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','₊':'+','₋':'-','ₐ':'a','ₑ':'e','ₒ':'o','ₓ':'x','ₘ':'m','ₙ':'n' };

    function renderRichEq(raw) {
      if (raw == null) return '';
      let s = esc(String(raw));
      // 1. Convert Unicode superscripts & subscripts runs into true <sup> / <sub>
      s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ⁿⁱ]+/g, m => '<sup>' + Array.from(m).map(c => UNI_SUP[c] || c).join('') + '</sup>');
      s = s.replace(/[₀₁₂₃₄₅₆₇₈₉₊₋ₐₑₒₓₘₙ]+/g, m => '<sub>' + Array.from(m).map(c => UNI_SUB[c] || c).join('') + '</sub>');
      // 2. Convert caret powers: x^(2n), 10^-19, x^2, cm^-1
      s = s.replace(/\^\(([^)]+)\)/g, '<sup>$1</sup>');
      s = s.replace(/\^([+\-−]?\d+[+\-−]?|[a-zA-Z])/g, '<sup>$1</sup>');
      // 3. Convert underscore subscripts: v_max, K_b, ΔT_f, a_0
      s = s.replace(/_\(([^)]+)\)/g, '<sub>$1</sub>');
      s = s.replace(/([A-Za-zΔαβγλμωρσ])_([A-Za-z0-9]+)/g, '$1<sub>$2</sub>');
      // 4. Flattened powers of 10 (e.g., 10-12, 10-9, 10-24, 6.022 × 1023, 3.0 × 108, (iv) 106, (v) 109)
      s = s.replace(/\b10(?:-|−)(\d{1,2})\b/g, '10<sup>−$1</sup>');
      s = s.replace(/(×\s*10)(\d{1,2})\b/g, '$1<sup>$2</sup>');
      s = s.replace(/(\b10)(3|6|8|9|10|12|15|18|19|20|22|23|24)(?=\s*(?:mol|m\b|s\b|g\b|kg|J|W|Hz|eV|Pa|N|C|V|A|,|\)|\.|$))/g, '10<sup>$2</sup>');
      // 5. Flattened SI unit powers (e.g., mol-1, m-3, cm-3, L-1, s-2, dm3, cm3, m2, m3)
      s = s.replace(/\b(mol|m|cm|mm|dm|km|s|kg|L|K|A|g|J|N|Pa|Hz|rad)(?:-|−)(\d)\b/g, '$1<sup>−$2</sup>');
      s = s.replace(/\b(m|cm|mm|dm|km)(2|3)\b/g, '$1<sup>$2</sup>');
      // 6. Flattened isotope mass numbers (e.g., 12C, 16O, 35Cl, 37Cl, 32P, 35S, 14N, 235U)
      s = s.replace(/\b(12|13|14|16|18|23|32|35|37|235|238)(C|O|H|N|P|S|Cl|Na|U)\b/g, '<sup>$1</sup>$2');
      // 7. Flattened chemical charges (e.g., Fe3+, Ca2+, Mg2+, SO42-, Cr2O72-, NAD+, FAD+, H+, OH-)
      s = s.replace(/\b(Ca|Mg|Fe|Cu|Zn|Al|Mn|Cr|Pb|Ba|Hg|Ni|Co|Ag|Na|K|Li|NH4|H3O|SO4|CO3|PO4|NO3|OH|Cl|Br|I|NADP|NAD|FAD|H)(\d?[+\-])(?=\s|,|\)|\.|$)/g, '$1<sup>$2</sup>');
      // 8. Chemical formula digits (including with stoichiometric coefficients like 2O2, 2H2O, 6CO2, C6H12O6)
      s = s.replace(/(\b\d*(?:[A-Z][a-z]?(?:\d+)?){2,}\b|\b\d*(?:H|O|N|C|S|P|F|Cl|Br|I|Na|Ca|Mg|Al|Fe|Cu|Zn|Ag|Ba|Mn|Cr|Pb|Hg|NH|OH|NO|SO|CO|PO|CH)\d+\b)/g, (tok) => {
        if (/^(Q\d+|A\d+|B\d+|C\d+|D\d+|I\d+|Ch\d+|C\d+H\d+O\d+|G\d+|F\d+)$/.test(tok) && !/^C\d+H\d+/.test(tok)) return tok;
        return tok.replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
      });
      // 9. Preserve newlines cleanly
      s = s.replace(/\n/g, '<br/>');
      return s;
    }

    // Build exact WEEKLY TEST - 13.docx A4 2-Column Pragathi P.U. College Paper HTML
    function buildPragathiPaperHtml(exam, forWord = false) {
      const cfg = TEMPLATE_CONFIG[exam.type] || TEMPLATE_CONFIG.NEET;
      const mins = exam.type === 'NEET' ? 180 : 100;
      const marks = exam.type === 'NEET' ? 720 : 100;
      const roman = ['I', 'II', 'III', 'IV'];
      let qCounter = 1;
      let answerKeyRows = [];
      let bodyBlocks = [];

      cfg.subjects.forEach((sub, sIdx) => {
        const list = (exam.selections && exam.selections[sub.name]) ? exam.selections[sub.name] : [];
        if (list.length === 0) return;
        const chNames = Array.from(new Set(list.map(x => x.chapter).filter(Boolean))).slice(0, 3).join(', ');
        bodyBlocks.push(`
          <div class="part-hdr">PART – ${roman[sIdx] || (sIdx+1)} : ${esc(sub.name.toUpperCase())}${chNames ? ' (' + esc(chNames) + ')' : ''}</div>
        `);
        list.forEach(q => {
          const num = qCounter++;
          answerKeyRows.push({ num, sub: sub.name, ans: q.ans });
          const diagSrc = getDiagramSrc(q.img || q.diagram);
          const optLens = [q.a, q.b, q.c, q.d].map(o => String(o || '').trim().length);
          const maxOptLen = Math.max(...optLens);
          let optHtml = '';
          if (maxOptLen <= 18) {
            optHtml = `<div class="opts-4"><span><b>(A)</b> ${renderRichEq(q.a)}</span><span><b>(B)</b> ${renderRichEq(q.b)}</span><span><b>(C)</b> ${renderRichEq(q.c)}</span><span><b>(D)</b> ${renderRichEq(q.d)}</span></div>`;
          } else if (maxOptLen <= 52) {
            optHtml = `<div class="opts-2"><div><b>(A)</b> ${renderRichEq(q.a)}</div><div><b>(B)</b> ${renderRichEq(q.b)}</div><div><b>(C)</b> ${renderRichEq(q.c)}</div><div><b>(D)</b> ${renderRichEq(q.d)}</div></div>`;
          } else {
            optHtml = `<div class="opts-1"><div><b>(A)</b> ${renderRichEq(q.a)}</div><div><b>(B)</b> ${renderRichEq(q.b)}</div><div><b>(C)</b> ${renderRichEq(q.c)}</div><div><b>(D)</b> ${renderRichEq(q.d)}</div></div>`;
          }
          bodyBlocks.push(`

    async function exportExamPdfAdminOnly(examId) {
      if (!state.session || state.session.role !== 'admin') return;
      const exam = state.exams.find(e => e.id === examId);
      if (!exam) return;

    async function exportExamWordAdminOnly(examId) {
      if (!state.session || state.session.role !== 'admin') return;
      const exam = state.exams.find(e => e.id === examId);
      if (!exam) return;
      await ensureDiagramsLoaded();
      const html = buildPragathiPaperHtml(exam, true);
      if (!html) { toast('No questions selected in this exam yet.', 'error'); return; }
      if (window.AndroidBridge && typeof window.AndroidBridge.saveTextFile === 'function') {
        const safeNameA = (exam.name || 'Weekly_Test').replace(/[^a-zA-Z0-9_-]+/g, '_');
        window.AndroidBridge.saveTextFile(`${safeNameA}_${exam.examClass.replace(/\s+/g, '_')}_${exam.type}.doc`, html, 'application/msword');
        toast('Saved Word (.doc) file to Downloads!', 'success');
        return;
      }
      const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const safeName = (exam.name || 'Weekly_Test').replace(/[^a-zA-Z0-9_-]+/g, '_');
      a.href = url;
      a.download = `${safeName}_${exam.examClass.replace(/\s+/g, '_')}_${exam.type}.doc`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(`Downloaded Word paper (${a.download})!`, 'success');

    // =========================================================================
    // ADMIN-ONLY NEET-PATTERN SMART RANDOM QUESTION SELECTOR

    const NEET_DEFAULT_MIX = {
      Physics:   { concept: 25, numerical: 55, stmtAR: 10, diagramPyq: 10 },
      Chemistry: { concept: 45, numerical: 25, stmtAR: 20, diagramPyq: 10 },
      Botany:    { concept: 40, numerical: 5,  stmtAR: 35, diagramPyq: 20 },
      Zoology:   { concept: 40, numerical: 5,  stmtAR: 35, diagramPyq: 20 },
      Biology:   { concept: 40, numerical: 5,  stmtAR: 35, diagramPyq: 20 },
      Maths:     { concept: 35, numerical: 55, stmtAR: 10, diagramPyq: 0  }
    };

    function classifyQuestionType(q) {
      const txt = (q.q || '');
      if (/\b(assertion|reason|statement\s*[i1]|match\s+list|match\s+column|how many of the following|consider the following statements)\b/i.test(txt)) {
        return 'stmtAR';
      }
      if (q.tag === 'PYQ' || /\b(diagram|figure|graph|shown|circuit|plot|curve|structure|labelled)\b/i.test(txt)) {
        return 'diagramPyq';
      }
      if (/\b\d+(\.\d+)?\s*(m\/s|m s|kg|g\b|cm|mm|nm|km|hz|v\b|a\b|ohm|ω|j\b|kj|ev|w\b|n\b|pa|atm|bar|k\b|°c|mol|m\b|ml|s\b|%|t\b|c\b|f\b|rad|°)\b/i.test(txt) || /[=×÷√∫]/.test(txt)) {
        return 'numerical';
      }
      return 'concept';
    }

    function shuffleArr(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function openAdminRandomModal(examId) {
      if (!state.session || state.session.role !== 'admin') return;
      const ex = state.exams.find(e => e.id === examId);
      if (!ex) return;
      const cfg = TEMPLATE_CONFIG[ex.type] || TEMPLATE_CONFIG.NEET;

      const buildModalInner = (subName) => {

        const chapters = getBankChaptersFor(ex.examClass, subName);
        const existingCount = (ex.selections && ex.selections[subName]) ? ex.selections[subName].length : 0;
        const mix = NEET_DEFAULT_MIX[subName] || NEET_DEFAULT_MIX.Physics;

        return `

                <label class="block text-xs font-bold text-slate-700 mb-1">Subject Sheet</label>
