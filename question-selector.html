    // Embedded real Pragathi PCMB question bank (120 chapters, 600 real NCERT/PYQ/Booster MCQs)
    const EMBEDDED_BANK = {"I PUC|Physics": [{"chapter": "Chapter 1 - Units & Meas", "questions": [{"id": "I _Phy_0_1", "qno": 1, "q": "How many base (fundamental) physical quantities are defined in the International System of Units (SI)?", "a": "6", "b": "5", "c": "7 (length, mass, time, electric current, thermodynamic temperature, amount of substance, luminous intensity)", "d": "9", "ans": "C", "exp": "7 (length, mass, time, electric current, thermodynamic temperature, amount of substance, luminous intensity). SI has 7 base units (m, kg, s, A, K, mol, cd) and 2 supplementary units (rad, sr). Astronomical lengths: 1 parsec (3.08 × 1016 m) > 1 ly (9.46 × 1015 m) > 1 AU (1.496 × 1011 m); parallax distance D = b/θ. Least", "tag": "NCERT"}, {"id": "I _Phy_0_2", "qno": 2, "q": "The two dimensionless supplementary units in the SI system are:", "a": "Degree and Candela", "b": "Radian (plane angle) and Steradian (solid angle)", "c": "Hertz and Joule", "d": "Mole and Kelvin", "ans": "B", "exp": "Radian (plane angle) and Steradian (solid angle). SI has 7 base units (m, kg, s, A, K, mol, cd) and 2 supplementary units (rad, sr). Astronomical lengths: 1 parsec (3.08 × 1016 m) > 1 ly (9.46 × 1015 m) > 1 AU (1.496 × 1011 m); parallax distance D = b/θ. Least count of screw gauge = pitch/N.", "tag": "NCERT"}, {"id": "I _Phy_0_3", "qno": 3, "q": "One parsec (parallactic second) is approximately equal to:", "a": "9.46 × 1015 m", "b": "1.496 × 1011 m", "c": "3.08 × 1016 m (≈ 3.26 light years)", "d": "10-15 m", "ans": "C", "exp": "3.08 × 1016 m (≈ 3.26 light years). SI has 7 base units (m, kg, s, A, K, mol, cd) and 2 supplementary units (rad, sr). Astronomical lengths: 1 parsec (3.08 × 1016 m) > 1 ly (9.46 × 1015 m) > 1 AU (1.496 × 1011 m); parallax distance D = b/θ. Least count of screw gauge = pitch/N.", "tag": "NCERT"}, {"id": "I _Phy_0_4", "qno": 4, "q": "One light year (1 ly) is a unit of:", "a": "Luminous intensity", "b": "Time", "c": "Distance (≈ 9.46 × 1015 m)", "d": "Speed", "ans": "C", "exp": "Distance (≈ 9.46 × 1015 m). SI has 7 base units (m, kg, s, A, K, mol, cd) and 2 supplementary units (rad, sr). Astronomical lengths: 1 parsec (3.08 × 1016 m) > 1 ly (9.46 × 1015 m) > 1 AU (1.496 × 1011 m); parallax distance D = b/θ. Least count of screw gauge = pitch/N.", "tag": "NCERT"}, {"id": "I _Phy_0_5", "qno": 5, "q": "One astronomical unit (1 AU, mean Earth–Sun distance) is approximately:", "a": "1.496 × 1011 m", "b": "3.08 × 1016 m", "c": "9.46 × 1015 m", "d": "6.37 × 106 m", "ans": "A", "exp": "Correct answer: 1.496 × 1011 m. SI has 7 base units (m, kg, s, A, K, mol, cd) and 2 supplementary units (rad, sr). Astronomical lengths: 1 parsec (3.08 × 1016 m) > 1 ly (9.46 × 1015 m) > 1 AU (1.496 × 1011 m); parallax distance D = b/θ. Least count of screw gauge = pitch/N.", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Motion in Line", "questions": [{"id": "I _Phy_1_1", "qno": 1, "q": "For a moving particle, the ratio of the magnitude of displacement to the distance travelled is always:", "a": "Strictly equal to 1", "b": "Zero", "c": "Less than or equal to 1 (≤ 1)", "d": "Greater than 1", "ans": "C", "exp": "Less than or equal to 1 (≤ 1). Displacement ≤ distance (equal for unidirectional 1D motion). Equal-distance average speed = 2v1v2/(v1+v2); equal-time average speed = (v1+v2)/2. Slope of x–t gives v = dx/dt; slope of v–t gives a = dv/dt; area under v–t gives displacement.", "tag": "NCERT"}, {"id": "I _Phy_1_2", "qno": 2, "q": "When a particle moves along a straight line in one direction without reversing, the magnitude of its displacement is:", "a": "Zero", "b": "Equal to the distance travelled", "c": "Less than the distance travelled", "d": "Greater than the distance travelled", "ans": "B", "exp": "Equal to the distance travelled. Displacement ≤ distance (equal for unidirectional 1D motion). Equal-distance average speed = 2v1v2/(v1+v2); equal-time average speed = (v1+v2)/2. Slope of x–t gives v = dx/dt; slope of v–t gives a = dv/dt; area under v–t gives displacement.", "tag": "NCERT"}, {"id": "I _Phy_1_3", "qno": 3, "q": "If a car travels the first half of a straight-line distance at constant speed v1 and the second half at speed v2, its average speed is:", "a": "(v1 + v2) / 2", "b": "√(v1 v2)", "c": "2 v1 v2 / (v1 + v2) (harmonic mean)", "d": "v1 + v2", "ans": "C", "exp": "2 v1 v2 / (v1 + v2) (harmonic mean). Displacement ≤ distance (equal for unidirectional 1D motion). Equal-distance average speed = 2v1v2/(v1+v2); equal-time average speed = (v1+v2)/2. Slope of x–t gives v = dx/dt; slope of v–t gives a = dv/dt; area under v–t gives displacement.", "tag": "NCERT"}, {"id": "I _Phy_1_4", "qno": 4, "q": "If a car travels for the first half of total time at constant speed v1 and the second half of time at speed v2, its average speed is:", "a": "2 v1 v2 / (v1 + v2)", "b": "√(v1 v2)", "c": "|v1 − v2|", "d": "(v1 + v2) / 2 (arithmetic mean)", "ans": "D", "exp": "(v1 + v2) / 2 (arithmetic mean). Displacement ≤ distance (equal for unidirectional 1D motion). Equal-distance average speed = 2v1v2/(v1+v2); equal-time average speed = (v1+v2)/2. Slope of x–t gives v = dx/dt; slope of v–t gives a = dv/dt; area under v–t gives displacement.", "tag": "NCERT"}, {"id": "I _Phy_1_5", "qno": 5, "q": "A body completes one full circular lap of radius R in time T. Its average velocity and average speed are respectively:", "a": "2 R / T and 2π R / T", "b": "0 and 2π R / T", "c": "Both zero", "d": "2π R / T and 0", "ans": "B", "exp": "Correct answer: 0 and 2π R / T. Displacement ≤ distance (equal for unidirectional 1D motion). Equal-distance average speed = 2v1v2/(v1+v2); equal-time average speed = (v1+v2)/2. Slope of x–t gives v = dx/dt; slope of v–t gives a = dv/dt; area under v–t gives displacement.", "tag": "NCERT"}]}, {"chapter": "Chapter 3 - Motion in Plane", "questions": [{"id": "I _Phy_2_1", "qno": 1, "q": "Which of the following is a VECTOR quantity?", "a": "Distance", "b": "Electric current", "c": "Displacement (or velocity, acceleration, force, momentum)", "d": "Speed", "ans": "C", "exp": "Displacement (or velocity, acceleration, force, momentum). Vector resultant R = √(A2 + B2 + 2AB cos θ) (max A+B at 0°, min |A−B| at 180°, R = A at 120° for equal vectors). Resolution: Ax = A cos θ, Ay = A sin θ; electric current is a scalar.", "tag": "NCERT"}, {"id": "I _Phy_2_2", "qno": 2, "q": "Which of the following is a SCALAR quantity despite having a direction of flow?", "a": "Velocity", "b": "Torque", "c": "Force", "d": "Electric current (does not obey vector law of addition)", "ans": "D", "exp": "Electric current (does not obey vector law of addition). Vector resultant R = √(A2 + B2 + 2AB cos θ) (max A+B at 0°, min |A−B| at 180°, R = A at 120° for equal vectors). Resolution: Ax = A cos θ, Ay = A sin θ; electric current is a scalar.", "tag": "NCERT"}, {"id": "I _Phy_2_3", "qno": 3, "q": "The magnitude of the resultant R of two vectors A and B inclined at an angle θ to each other is:", "a": "R = A + B", "b": "R = √(A2 + B2 − 2 A B cos θ)", "c": "R = √(A2 + B2 + 2 A B cos θ)", "d": "R = √(A2 + B2 + 2 A B sin θ)", "ans": "C", "exp": "R = √(A2 + B2 + 2 A B cos θ). Vector resultant R = √(A2 + B2 + 2AB cos θ) (max A+B at 0°, min |A−B| at 180°, R = A at 120° for equal vectors). Resolution: Ax = A cos θ, Ay = A sin θ; electric current is a scalar.", "tag": "NCERT"}, {"id": "I _Phy_2_4", "qno": 4, "q": "The magnitude of the resultant of two vectors A and B is MAXIMUM when the angle θ between them is:", "a": "60°", "b": "90°", "c": "0° (Rmax = A + B)", "d": "180°", "ans": "C", "exp": "Correct answer: 0° (Rmax = A + B). Vector resultant R = √(A2 + B2 + 2AB cos θ) (max A+B at 0°, min |A−B| at 180°, R = A at 120° for equal vectors). Resolution: Ax = A cos θ, Ay = A sin θ; electric current is a scalar.", "tag": "NCERT"}, {"id": "I _Phy_2_5", "qno": 5, "q": "The magnitude of the resultant of two vectors A and B is MINIMUM when the angle θ between them is:", "a": "90°", "b": "180° (Rmin = |A − B|)", "c": "120°", "d": "0°", "ans": "B", "exp": "Correct answer: 180° (Rmin = |A − B|). Vector resultant R = √(A2 + B2 + 2AB cos θ) (max A+B at 0°, min |A−B| at 180°, R = A at 120° for equal vectors). Resolution: Ax = A cos θ, Ay = A sin θ; electric current is a scalar.", "tag": "NCERT"}]}, {"chapter": "Chapter 4 - Laws of Motion", "questions": [{"id": "I _Phy_3_1", "qno": 1, "q": "Newton's first law of motion defines:", "a": "Action-reaction pairs", "b": "Inertia and qualitative concept of force (and inertial reference frames)", "c": "Conservation of energy", "d": "Quantitative measure of momentum", "ans": "B", "exp": "Inertia and qualitative concept of force (and inertial reference frames). Newton's 1st law defines inertia (measured by mass); 2nd law gives F = dp/dt = ma; impulse J = Favg Δt = Δp (area under F–t graph). 3rd law action-reaction pairs act on two different bodies; rocket propulsion obeys momentum conservation.", "tag": "NCERT"}, {"id": "I _Phy_3_2", "qno": 2, "q": "The quantitative measure of the inertia of a body in translational motion is its:", "a": "Weight", "b": "Mass", "c": "Velocity", "d": "Acceleration", "ans": "B", "exp": "Correct answer: Mass. Newton's 1st law defines inertia (measured by mass); 2nd law gives F = dp/dt = ma; impulse J = Favg Δt = Δp (area under F–t graph). 3rd law action-reaction pairs act on two different bodies; rocket propulsion obeys momentum conservation.", "tag": "NCERT"}, {"id": "I _Phy_3_3", "qno": 3, "q": "According to Newton's second law of motion, the net external force F acting on a body equals:", "a": "Rate of change of linear momentum (F = dp / dt; F = ma for constant mass)", "b": "Total linear momentum p", "c": "Work done per unit time", "d": "Impulse × time", "ans": "A", "exp": "Rate of change of linear momentum (F = dp / dt; F = ma for constant mass). Newton's 1st law defines inertia (measured by mass); 2nd law gives F = dp/dt = ma; impulse J = Favg Δt = Δp (area under F–t graph). 3rd law action-reaction pairs act on two different bodies; rocket propulsion obeys momentum conservation.", "tag": "NCERT"}, {"id": "I _Phy_3_4", "qno": 4, "q": "Impulse J of a force acting over a short time interval Δt is equal to:", "a": "F / Δt", "b": "m a2", "c": "Favg Δt = Δp (change in linear momentum; area under F–t graph)", "d": "½ m v2", "ans": "C", "exp": "Favg Δt = Δp (change in linear momentum; area under F–t graph). Newton's 1st law defines inertia (measured by mass); 2nd law gives F = dp/dt = ma; impulse J = Favg Δt = Δp (area under F–t graph). 3rd law action-reaction pairs act on two different bodies; rocket propulsion obeys momentum conservation.", "tag": "NCERT"}, {"id": "I _Phy_3_5", "qno": 5, "q": "Why does a cricketer pull his hands backward while catching a fast-moving cricket ball?", "a": "To increase the impulse imparted", "b": "To decrease the change in momentum Δp", "c": "To increase the time interval Δt of stopping the ball, thereby reducing the average impact force F = Δp / Δt", "d": "To reduce the mass of the ball", "ans": "C", "exp": "To increase the time interval Δt of stopping the ball, thereby reducing the average impact force F = Δp / Δt. Newton's 1st law defines inertia (measured by mass); 2nd law gives F = dp/dt = ma; impulse J = Favg Δt = Δp (area under F–t graph). 3rd law action-reaction pairs act on two different bodies; rocket propulsion o", "tag": "NCERT"}]}, {"chapter": "Chapter 5 - Work Energy Power", "questions": [{"id": "I _Phy_4_1", "qno": 1, "q": "Work done W by a constant force F causing displacement s at angle θ to F is:", "a": "W = F × s = F s sin θ", "b": "W = F / s", "c": "W = F s tan θ", "d": "W = F · s = F s cos θ (a scalar quantity, SI unit Joule)", "ans": "D", "exp": "W = F · s = F s cos θ (a scalar quantity, SI unit Joule). Work W = F · s = Fs cos θ (zero at 90°, e.g., centripetal force); variable-force work = area under F–x curve; spring PE U = ½kx2. Conservative forces (gravity, spring) are path-independent with F = −dU/dx.", "tag": "NCERT"}, {"id": "I _Phy_4_2", "qno": 2, "q": "The work done by a force is ZERO when the angle θ between force and displacement is:", "a": "180°", "b": "0°", "c": "45°", "d": "90° (e.g., centripetal force in uniform circular motion, or coolie carrying load horizontally)", "ans": "D", "exp": "90° (e.g., centripetal force in uniform circular motion, or coolie carrying load horizontally). Work W = F · s = Fs cos θ (zero at 90°, e.g., centripetal force); variable-force work = area under F–x curve; spring PE U = ½kx2. Conservative forces (gravity, spring) are path-independent with F = −dU/dx.", "tag": "NCERT"}, {"id": "I _Phy_4_3", "qno": 3, "q": "The work done by a variable force F(x) in displacing a particle from x1 to x2 equals:", "a": "Zero always", "b": "The slope of the F–x graph", "c": "The area enclosed between the F–x graph and the displacement axis (∫ F dx)", "d": "F(x2) − F(x1)", "ans": "C", "exp": "The area enclosed between the F–x graph and the displacement axis (∫ F dx). Work W = F · s = Fs cos θ (zero at 90°, e.g., centripetal force); variable-force work = area under F–x curve; spring PE U = ½kx2. Conservative forces (gravity, spring) are path-independent with F = −dU/dx.", "tag": "NCERT"}, {"id": "I _Phy_4_4", "qno": 4, "q": "The work done in stretching or compressing an ideal spring of force constant k by extension x from its natural length is:", "a": "W = k x2", "b": "W = ½ k2 x", "c": "W = ½ k x2 (stored as elastic potential energy)", "d": "W = k x", "ans": "C", "exp": "W = ½ k x2 (stored as elastic potential energy). Work W = F · s = Fs cos θ (zero at 90°, e.g., centripetal force); variable-force work = area under F–x curve; spring PE U = ½kx2. Conservative forces (gravity, spring) are path-independent with F = −dU/dx.", "tag": "NCERT"}, {"id": "I _Phy_4_5", "qno": 5, "q": "A force is called CONSERVATIVE (such as gravitational, electrostatic, or spring force) if:", "a": "It always opposes motion", "b": "The work done by it depends only on initial and final positions (independent of path; zero around any closed loop)", "c": "The work done depends on the path length", "d": "It dissipates mechanical energy as heat", "ans": "B", "exp": "The work done by it depends only on initial and final positions (independent of path; zero around any closed loop). Work W = F · s = Fs cos θ (zero at 90°, e.g., centripetal force); variable-force work = area under F–x curve; spring PE U = ½kx2. Conservative forces (gravity, spring) are path-independent with F = −dU/dx", "tag": "NCERT"}]}, {"chapter": "Chapter 6 - Rotational Motion", "questions": [{"id": "I _Phy_5_1", "qno": 1, "q": "The centre of mass (COM) of a system of particles moves as if:", "a": "All internal forces acted there", "b": "It always lies inside the solid material of the body", "c": "Its velocity is always zero", "d": "All the mass of the system were concentrated there and all EXTERNAL forces were applied there", "ans": "D", "exp": "All the mass of the system were concentrated there and all EXTERNAL forces were applied there. Centre of mass xcm = Σmixi/Σmi moves solely under external forces (internal forces cancel). Cross product |A × B| = AB sin θ (anti-commutative). Rotational kinematics: v = ω × r, ω = ω0 + αt, θ = ω0t + ½αt2.", "tag": "NCERT"}, {"id": "I _Phy_5_2", "qno": 2, "q": "Can the centre of mass of a rigid body lie OUTSIDE the physical material of the body?", "a": "Yes — e.g., a uniform circular ring, hollow sphere, or L-shaped boomerang", "b": "Only in zero gravity", "c": "Only for irregular liquids", "d": "No — COM must always lie inside the solid material", "ans": "A", "exp": "Yes — e.g., a uniform circular ring, hollow sphere, or L-shaped boomerang. Centre of mass xcm = Σmixi/Σmi moves solely under external forces (internal forces cancel). Cross product |A × B| = AB sin θ (anti-commutative). Rotational kinematics: v = ω × r, ω = ω0 + αt, θ = ω0t + ½αt2.", "tag": "NCERT"}, {"id": "I _Phy_5_3", "qno": 3, "q": "A bomb projected along a parabolic trajectory explodes in mid-air due to internal forces. The centre of mass of all fragments:", "a": "Continues to move along the exact same parabolic path until fragments hit the ground", "b": "Stops abruptly at the explosion point", "c": "Moves horizontally at constant speed", "d": "Falls vertically straight down", "ans": "A", "exp": "Continues to move along the exact same parabolic path until fragments hit the ground. Centre of mass xcm = Σmixi/Σmi moves solely under external forces (internal forces cancel). Cross product |A × B| = AB sin θ (anti-commutative). Rotational kinematics: v = ω × r, ω = ω0 + αt, θ = ω0t + ½αt2.", "tag": "NCERT"}, {"id": "I _Phy_5_4", "qno": 4, "q": "For two particles of masses m1 and m2 separated by distance d, the distance of their centre of mass from m1 is:", "a": "m2 d / (m1 + m2) (closer to the heavier mass)", "b": "(m1 + m2) d / m2", "c": "m1 d / (m1 + m2)", "d": "d / 2 always", "ans": "A", "exp": "m2 d / (m1 + m2) (closer to the heavier mass). Centre of mass xcm = Σmixi/Σmi moves solely under external forces (internal forces cancel). Cross product |A × B| = AB sin θ (anti-commutative). Rotational kinematics: v = ω × r, ω = ω0 + αt, θ = ω0t + ½αt2.", "tag": "NCERT"}, {"id": "I _Phy_5_5", "qno": 5, "q": "The vector (cross) product A × B of two vectors A and B inclined at angle θ has magnitude:", "a": "A B cos θ", "b": "A B sin θ (directed perpendicular to both A and B by right-hand rule)", "c": "A B tan θ", "d": "A + B", "ans": "B", "exp": "A B sin θ (directed perpendicular to both A and B by right-hand rule). Centre of mass xcm = Σmixi/Σmi moves solely under external forces (internal forces cancel). Cross product |A × B| = AB sin θ (anti-commutative). Rotational kinematics: v = ω × r, ω = ω0 + αt, θ = ω0t + ½αt2.", "tag": "NCERT"}]}, {"chapter": "Chapter 7 - Gravitation", "questions": [{"id": "I _Phy_6_1", "qno": 1, "q": "Kepler's first law (Law of Orbits) states that every planet revolves around the Sun in:", "a": "A circular orbit with the Sun at
