G = 6.67 × 10-11 N m2 kg-2 (Cavendish balance); inside a hollow shell, gravitational force is zero.", "tag": "NCERT"}, {"id": "I _Phy_6_5", "qno": 5, "q": "The universal gravitational constant G was first determined experimentally by Henry Cavendish using a torsion balance and equals:", "a": "8.85 × 10-12 N m2 kg-2", "b": "9.8 N m2 kg-2", "c": "6.67 × 10-11 N m2 kg-2", "d": "6.67 × 1011 N m2 kg-2", "ans": "C", "exp": "Correct answer: 6.67 × 10-11 N m2 kg-2. Kepler's laws: elliptical orbits (Sun at focus), equal areas in equal times (dA/dt = L/(2m) → conservation of L, v1r1 = v2r2), and T2 ∝ a3. G = 6.67 × 10-11 N m2 kg-2 (Cavendish balance); inside a hollow shell, gravitational force is zero.", "tag": "NCERT"}]}, {"chapter": "Chapter 8 - Mech Prop Solids", "questions": [{"id": "I _Phy_7_1", "qno": 1, "q": "The property of a body by virtue of which it tends to regain its original size and shape when the applied deforming force is removed is called:", "a": "Viscosity", "b": "Plasticity", "c": "Elasticity", "d": "Malleability", "ans": "C", "exp": "Correct answer: Elasticity. Stress = F/A (N m-2), strain = ΔL/L (dimensionless), and within the proportional limit Hooke's law gives stress ∝ strain.", "tag": "NCERT"}, {"id": "I _Phy_7_2", "qno": 2, "q": "A body that does not regain its original shape and size after removal of the deforming force (such as putty or mud) is called:", "a": "A perfectly elastic body", "b": "An isotropic fluid", "c": "A plastic body", "d": "A rigid body", "ans": "C", "exp": "Correct answer: A plastic body. Stress = F/A (N m-2), strain = ΔL/L (dimensionless), and within the proportional limit Hooke's law gives stress ∝ strain.", "tag": "NCERT"}, {"id": "I _Phy_7_3", "qno": 3, "q": "The restoring force per unit cross-sectional area developed inside a deformed body is defined as:", "a": "Strain", "b": "Stress", "c": "Surface tension", "d": "Impulse", "ans": "B", "exp": "Correct answer: Stress. Stress = F/A (N m-2), strain = ΔL/L (dimensionless), and within the proportional limit Hooke's law gives stress ∝ strain.", "tag": "NCERT"}, {"id": "I _Phy_7_4", "qno": 4, "q": "The SI unit and dimensional formula of stress are respectively:", "a": "N m-1 and [M T-2]", "b": "N m2 and [M L3 T-2]", "c": "Dimensionless", "d": "N m-2 (or Pa) and [M L-1 T-2]", "ans": "D", "exp": "N m-2 (or Pa) and [M L-1 T-2]. Stress = F/A (N m-2), strain = ΔL/L (dimensionless), and within the proportional limit Hooke's law gives stress ∝ strain.", "tag": "NCERT"}, {"id": "I _Phy_7_5", "qno": 5, "q": "Strain is defined as the ratio of change in dimension to the original dimension; therefore strain is:", "a": "Measured in N m-2", "b": "Measured in J m-3", "c": "Measured in metres", "d": "A pure dimensionless number with no SI unit", "ans": "D", "exp": "A pure dimensionless number with no SI unit. Stress = F/A (N m-2), strain = ΔL/L (dimensionless), and within the proportional limit Hooke's law gives stress ∝ strain.", "tag": "NCERT"}]}, {"chapter": "Chapter 9 - Mech Prop Fluids", "questions": [{"id": "I _Phy_8_1", "qno": 1, "q": "Pressure at a point inside a static fluid is a:", "a": "Vector quantity acting only vertically downward", "b": "Tensor of rank 3", "c": "Quantity dependent on the shape of the vessel", "d": "Scalar quantity acting equally in all directions", "ans": "D", "exp": "Scalar quantity acting equally in all directions. Hydrostatic pressure is P = Pa + ρgh; by Pascal's law, a hydraulic lift multiplies force as F2/F1 = A2/A1 = (r2/r1)2.", "tag": "NCERT"}, {"id": "I _Phy_8_2", "qno": 2, "q": "The gauge pressure at a depth h below the free surface of an incompressible liquid of density ρ at rest is:", "a": "ρ g h", "b": "P0 + ρ g h", "c": "½ ρ g h2", "d": "ρ g / h", "ans": "A", "exp": "Correct answer: ρ g h. Hydrostatic pressure is P = Pa + ρgh; by Pascal's law, a hydraulic lift multiplies force as F2/F1 = A2/A1 = (r2/r1)2.", "tag": "NCERT"}, {"id": "I _Phy_8_3", "qno": 3, "q": "The hydrostatic paradox demonstrates that liquid pressure at a given depth depends ONLY on:", "a": "The total volume of liquid in the container", "b": "The vertical depth h, liquid density ρ, and g — NOT on the shape or base area of the container", "c": "The mass of the container", "d": "The cross-sectional area of the base", "ans": "B", "exp": "The vertical depth h, liquid density ρ, and g — NOT on the shape or base area of the container. Hydrostatic pressure is P = Pa + ρgh; by Pascal's law, a hydraulic lift multiplies force as F2/F1 = A2/A1 = (r2/r1)2.", "tag": "NCERT"}, {"id": "I _Phy_8_4", "qno": 4, "q": "Pascal's law states that whenever external pressure is applied to any part of an enclosed incompressible fluid at rest:", "a": "It acts only along the direction of applied force", "b": "It decreases inversely with distance from the piston", "c": "It doubles at every bend", "d": "It is transmitted undiminished and equally in all directions throughout the fluid", "ans": "D", "exp": "It is transmitted undiminished and equally in all directions throughout the fluid. Hydrostatic pressure is P = Pa + ρgh; by Pascal's law, a hydraulic lift multiplies force as F2/F1 = A2/A1 = (r2/r1)2.", "tag": "NCERT"}, {"id": "I _Phy_8_5", "qno": 5, "q": "Hydraulic lifts and hydraulic brakes operate on the principle of:", "a": "Bernoulli's principle", "b": "Stokes' law", "c": "Pascal's law", "d": "Torricelli's theorem", "ans": "C", "exp": "Correct answer: Pascal's law. Hydrostatic pressure is P = Pa + ρgh; by Pascal's law, a hydraulic lift multiplies force as F2/F1 = A2/A1 = (r2/r1)2.", "tag": "NCERT"}]}, {"chapter": "Chapter 10 - Thermal Prop", "questions": [{"id": "I _Phy_9_1", "qno": 1, "q": "The temperature at which the Celsius and Fahrenheit scales read the exact same numerical value is:", "a": "0°", "b": "−273.15°", "c": "−40°", "d": "+40°", "ans": "C", "exp": "Correct answer: −40°. Temperature conversions use T(K) = t(°C) + 273.15 and tF = (9/5)tC + 32; thermal expansion follows ΔL = LαΔT with α : β : γ = 1 : 2 : 3.", "tag": "NCERT"}, {"id": "I _Phy_9_2", "qno": 2, "q": "Absolute zero (0 K) on the Celsius scale corresponds to:", "a": "−100 °C", "b": "0 °C", "c": "−273.15 °C", "d": "−459.67 °C", "ans": "C", "exp": "Correct answer: −273.15 °C. Temperature conversions use T(K) = t(°C) + 273.15 and tF = (9/5)tC + 32; thermal expansion follows ΔL = LαΔT with α : β : γ = 1 : 2 : 3.", "tag": "NCERT"}, {"id": "I _Phy_9_3", "qno": 3, "q": "The triple point of water on the Kelvin scale is defined as:", "a": "273.15 K", "b": "373.15 K", "c": "0 K", "d": "273.16 K", "ans": "D", "exp": "Correct answer: 273.16 K. Temperature conversions use T(K) = t(°C) + 273.15 and tF = (9/5)tC + 32; thermal expansion follows ΔL = LαΔT with α : β : γ = 1 : 2 : 3.", "tag": "NCERT"}, {"id": "I _Phy_9_4", "qno": 4, "q": "For an isotropic solid, the coefficients of linear (α), area (β), and volume (γ) thermal expansion are related by:", "a": "α : β : γ = 1 : 2 : 3", "b": "α : β : γ = 1 : 4 : 9", "c": "α : β : γ = 3 : 2 : 1", "d": "α : β : γ = 1 : 1 : 1", "ans": "A", "exp": "Correct answer: α : β : γ = 1 : 2 : 3. Temperature conversions use T(K) = t(°C) + 273.15 and tF = (9/5)tC + 32; thermal expansion follows ΔL = LαΔT with α : β : γ = 1 : 2 : 3.", "tag": "NCERT"}, {"id": "I _Phy_9_5", "qno": 5, "q": "Water exhibits anomalous thermal expansion between 0 °C and 4 °C, which means that as water is heated from 0 °C to 4 °C, its:", "a": "Specific heat becomes zero", "b": "Volume increases and density decreases", "c": "Density remains constant", "d": "Volume decreases and density increases, reaching maximum density at 4 °C", "ans": "D", "exp": "Volume decreases and density increases, reaching maximum density at 4 °C. Temperature conversions use T(K) = t(°C) + 273.15 and tF = (9/5)tC + 32; thermal expansion follows ΔL = LαΔT with α : β : γ = 1 : 2 : 3.", "tag": "NCERT"}]}, {"chapter": "Chapter 11 - Thermodynamics", "questions": [{"id": "I _Phy_10_1", "qno": 1, "q": "The Zeroth law of thermodynamics introduces the fundamental concept of:", "a": "Temperature (and thermal equilibrium)", "b": "Internal energy", "c": "Entropy", "d": "Enthalpy", "ans": "A", "exp": "Temperature (and thermal equilibrium). First law of thermodynamics is ΔQ = ΔU + ΔW, internal energy U is a state function of T for an ideal gas, isobaric work is PΔV, and Cp − Cv = R.", "tag": "NCERT"}, {"id": "I _Phy_10_2", "qno": 2, "q": "The First law of thermodynamics (ΔQ = ΔU + ΔW) is a statement of the conservation of:", "a": "Momentum", "b": "Entropy", "c": "Mass", "d": "Energy", "ans": "D", "exp": "Correct answer: Energy. First law of thermodynamics is ΔQ = ΔU + ΔW, internal energy U is a state function of T for an ideal gas, isobaric work is PΔV, and Cp − Cv = R.", "tag": "NCERT"}, {"id": "I _Phy_10_3", "qno": 3, "q": "For an ideal gas, the internal energy U depends ONLY on:", "a": "Its absolute temperature T", "b": "Its pressure P only", "c": "The path taken to reach the state", "d": "Its volume V only", "ans": "A", "exp": "Its absolute temperature T. First law of thermodynamics is ΔQ = ΔU + ΔW, internal energy U is a state function of T for an ideal gas, isobaric work is PΔV, and Cp − Cv = R.", "tag": "NCERT"}, {"id": "I _Phy_10_4", "qno": 4, "q": "Among internal energy (U), heat (Q), and work (W), which one is a STATE variable (independent of the thermodynamic path)?", "a": "Internal energy U only (Q and W are path-dependent)", "b": "Heat Q only", "c": "All three U, Q, and W", "d": "Work W only", "ans": "A", "exp": "Internal energy U only (Q and W are path-dependent). First law of thermodynamics is ΔQ = ΔU + ΔW, internal energy U is a state function of T for an ideal gas, isobaric work is PΔV, and Cp − Cv = R.", "tag": "NCERT"}, {"id": "I _Phy_10_5", "qno": 5, "q": "In a cyclic thermodynamic process, the system returns to its initial state; therefore:", "a": "ΔW = 0 always", "b": "ΔQ = 0 always", "c": "Temperature remains constant throughout the cycle", "d": "ΔU = 0 and net heat absorbed ΔQ equals net work done ΔW", "ans": "D", "exp": "ΔU = 0 and net heat absorbed ΔQ equals net work done ΔW. First law of thermodynamics is ΔQ = ΔU + ΔW, internal energy U is a state function of T for an ideal gas, isobaric work is PΔV, and Cp − Cv = R.", "tag": "NCERT"}]}, {"chapter": "Chapter 12 - Kinetic Theory", "questions": [{"id": "I _Phy_11_1", "qno": 1, "q": "A real gas approaches ideal gas behaviour most closely under conditions of:", "a": "High pressure and high temperature", "b": "Low pressure and low temperature", "c": "High pressure and low temperature", "d": "Low pressure and high temperature", "ans": "D", "exp": "Low pressure and high temperature. Kinetic pressure is P = (1/3)ρvrms2 = (2/3)E, molecular speeds satisfy vrms > vav > vp with vrms = √(3RT/M), and average translational KE is (3/2)k8T.", "tag": "NCERT"}, {"id": "I _Phy_11_2", "qno": 2, "q": "According to the kinetic theory of gases, the pressure P exerted by an ideal gas of density ρ and root-mean-square speed vrms is:", "a": "P = (1/2) ρ vrms2", "b": "P = (2/3) ρ vrms2", "c": "P = ρ vrms2", "d": "P = (1/3) ρ vrms2", "ans": "D", "exp": "Correct answer: P = (1/3) ρ vrms2. Kinetic pressure is P = (1/3)ρvrms2 = (2/3)E, molecular speeds satisfy vrms > vav > vp with vrms = √(3RT/M), and average translational KE is (3/2)k8T.", "tag": "NCERT"}, {"id": "I _Phy_11_3", "qno": 3, "q": "The pressure P of an ideal gas is related to its translational kinetic energy per unit volume (E) by:", "a": "P = E", "b": "P = (3/2) E", "c": "P = (1/3) E", "d": "P = (2/3) E", "ans": "D", "exp": "Correct answer: P = (2/3) E. Kinetic pressure is P = (1/3)ρvrms2 = (2/3)E, molecular speeds satisfy vrms > vav > vp with vrms = √(3RT/M), and average translational KE is (3/2)k8T.", "tag": "NCERT"}, {"id": "I _Phy_11_4", "qno": 4, "q": "The average translational kinetic energy of ONE molecule of any ideal gas at absolute temperature T is:", "a": "(3/2) k8 T (independent of the mass or nature of the gas)", "b": "(5/2) k8 T", "c": "(3/2) R T", "d": "(1/2) k8 T", "ans": "A", "exp": "(3/2) k8 T (independent of the mass or nature of the gas). Kinetic pressure is P = (1/3)ρvrms2 = (2/3)E, molecular speeds satisfy vrms > vav > vp with vrms = √(3RT/M), and average translational KE is (3/2)k8T.", "tag": "NCERT"}, {"id": "I _Phy_11_5", "qno": 5, "q": "For an ideal gas at temperature T and molar mass M, the root-mean-square speed vrms, average speed vav, and most probable speed vp follow the strict order:", "a": "vp > vav > vrms", "b": "vrms = vav = vp", "c": "vav > vrms > vp", "d": "vrms > vav > vp (ratio √3 : √(8/π) : √2 ≈ 1.732 : 1.596 : 1.414)", "ans": "D", "exp": "vrms > vav > vp (ratio √3 : √(8/π) : √2 ≈ 1.732 : 1.596 : 1.414). Kinetic pressure is P = (1/3)ρvrms2 = (2/3)E, molecular speeds satisfy vrms > vav > vp with vrms = √(3RT/M), and average translational KE is (3/2)k8T.", "tag": "NCERT"}]}, {"chapter": "Chapter 13 - Oscillations", "questions": [{"id": "I _Phy_12_1", "qno": 1, "q": "Every oscillatory motion is periodic, whereas every periodic motion is:", "a": "Never repeating", "b": "Always oscillatory", "c": "Always simple harmonic", "d": "Not necessarily oscillatory (for example, uniform circular motion is periodic but not oscillatory)", "ans": "D", "exp": "Not necessarily oscillatory (for example, uniform circular motion is periodic but not oscillatory). SHM obeys a = −ω2x, velocity v = ω√(A2 − x2) leads displacement by π/2, acceleration leads by π, vmax = Aω, and amax = Aω2.", "tag": "NCERT"}, {"id": "I _Phy_12_2", "qno": 2, "q": "The defining differential equation of Simple Harmonic Motion (SHM) with angular frequency ω is:", "a": "d2x/dt2 + ω2 x = 0 (i.e., a = −ω2 x)", "b": "d2x/dt2 − ω2 x = 0", "c": "a = +ω x", "d": "dx/dt + ω x = 0", "ans": "A", "exp": "d2x/dt2 + ω2 x = 0 (i.e., a = −ω2 x). SHM obeys a = −ω2x, velocity v = ω√(A2 − x2) leads displacement by π/2, acceleration leads by π, vmax = Aω, and amax = Aω2.", "tag": "NCERT"}, {"id": "I _Phy_12_3", "qno": 3, "q": "In SHM described by x = A sin(ωt), the phase difference between velocity v(t) and displacement x(t) is:", "a": "π rad", "b": "π/2 rad (velocity leads displacement by π/2)", "c": "Zero", "d": "3π/2 rad", "ans": "B", "exp": "π/2 rad (velocity leads displacement by π/2). SHM obeys a = −ω2x, velocity v = ω√(A2 − x2) leads displacement by π/2, acceleration leads by π, vmax = Aω, and amax = Aω2.", "tag": "NCERT"}, {"id": "I _Phy_12_4", "qno": 4, "q": "In SHM, the phase difference between acceleration a(t) and displacement x(t) is:", "a": "Zero", "b": "π/2 rad", "c": "π/4 rad", "d": "π rad (acceleration is always opposite in direction to displacement)", "ans": "D", "exp": "π rad (acceleration is always opposite in direction to displacement). SHM obeys a = −ω2x, velocity v = ω√(A2 − x2) leads displacement by π/2, acceleration leads by π, vmax = Aω, and amax = Aω2.", "tag": "NCERT"}, {"id": "I _Phy_12_5", "qno": 5, "q": "During SHM, the speed of the oscillating particle is MAXIMUM at the:", "a": "Extreme positions (x = ±A)", "b": "Mean (equilibrium) position (x = 0), where vmax = A ω", "c": "Point where acceleration is maximum", "d": "Half-amplitude position (x = A/2)", "ans": "B", "exp": "Mean (equilibrium) position (x = 0), where vmax = A ω. SHM obeys a = −ω2x, velocity v = ω√(A2 − x2) leads displacement by π/2, acceleration leads by π, vmax = Aω, and amax = Aω2.", "tag": "NCERT"}]}, {"chapter": "Chapter 14 - Waves", "questions": [{"id": "I _Phy_13_1", "qno": 1, "q": "A mechanical wave transfers:", "a": "Energy and momentum from one point to another without net transport of matter", "b": "Matter permanently along the medium", "c": "Mass without energy", "d": "Neither energy nor momentum", "ans": "A", "exp": "Energy and momentum from one point to another without net transport of matter. Progressive wave y = A sin(kx − ωt) has speed v = ω/k = fλ; transverse string speed is √(T/μ) and Laplace sound speed is √(γP/ρ) ∝ √T.", "tag": "NCERT"}, {"id": "I _Phy_13_2", "qno": 2, "q": "Transverse mechanical waves can propagate ONLY through media that possess:", "a": "Zero density", "b": "Bulk modulus only", "c": "Shear modulus (rigidity) — namely solids and liquid surfaces, NOT inside gases", "d": "Infinite compressibility", "ans": "C", "exp": "Shear modulus (rigidity) — namely solids and liquid surfaces, NOT inside gases. Progressive wave y = A sin(kx − ωt) has speed v = ω/k = fλ; transverse string speed is √(T/μ) and Laplace sound speed is √(γP/ρ) ∝ √T.", "tag": "NCERT"}, {"id": "I _Phy_13_3", "qno": 3, "q": "Longitudinal waves (such as sound waves) propagate via alternating compressions and rarefactions and can travel through:", "a": "Solids only", "b": "Vacuum only", "c": "Solids, liquids, and gases (all media possessing bulk modulus)", "d": "Gases only", "ans": "C", "exp": "Solids, liquids, and gases (all media possessing bulk modulus). Progressive wave y = A sin(kx − ωt) has speed v = ω/k = fλ; transverse string speed is √(T/μ) and Laplace sound speed is √(γP/ρ) ∝ √T.", "tag": "NCERT"}, {"id": "I _Phy_13_4", "qno": 4, "q": "In a progressive wave y(x, t) = A sin(k x − ω t), the angular wave number k, angular frequency ω, and wave speed v are related by:", "a": "k = λ / 2π and v = k / ω", "b": "v = ω k", "c": "k = 2π f", "d": "k = 2π / λ and v = ω / k = f λ", "ans": "D", "exp": "k = 2π / λ and v = ω / k = f λ. Progressive wave y = A sin(kx − ωt) has speed v = ω/k = fλ; transverse string speed is √(T/μ) and Laplace sound speed is √(γP/ρ) ∝ √T.", "tag": "NCERT"}, {"id": "I _Phy_13_5", "qno": 5, "q": "The speed of a transverse wave along a stretched string of tension T and linear mass density μ (mass per unit length) is:", "a": "v = √(T / μ)", "b": "v = T / μ", "c": "v = √(μ / T)", "d": "v = √(T μ)", "ans": "A", "exp": "Correct answer: v = √(T / μ). Progressive wave y = A sin(kx − ωt) has speed v = ω/k = fλ; transverse string speed is √(T/μ) and Laplace sound speed is √(γP/ρ) ∝ √T.", "tag": "NCERT"}]}, {"chapter": "NEET High-Order Mastery", "questions": [{"id": "I _Phy_14_1", "qno": 1, "q": "How many of the following statements about Kinematics & Laws of Motion are CORRECT?\n(i) A body can have zero velocity and non-zero acceleration simultaneously.\n(ii) Static friction is a self-adjusting force up to its limiting value μₛ N.\n(iii) On a banked frictionless road, optimum speed v = √(R g tan θ) is independent of vehicle mass.\n(iv) Pseudo force acts on a body only in an inertial reference frame.", "a": "All four statements are correct", "b": "Three statements ((i), (ii), and (iii) are correct; pseudo force acts in non-inertial frames)", "c": "Only one statement is correct", "d": "Only two statements are correct", "ans": "B", "exp": "Correct answer: Three statements ((i), (ii), and (iii) are correct; pseudo force acts in non-inertial frames). Verified against NCERT Class 11 Physics high-order multi-concept principles.", "tag": "Booster"}, {"id": "I _Phy_14_2", "qno": 2, "q": "A block of mass m slides down a rough inclined plane of angle θ with constant velocity. If the same block is now projected UP the same incline with initial speed v₀, its retardation while moving upward is:", "a": "2 g sin θ", "b": "Zero", "c": "g sin θ", "d": "g cos θ", "ans": "A", "exp": "Correct answer: 2 g sin θ. Verified against NCERT Class 11 Physics high-order multi-concept principles.", "tag": "Booster"}, {"id": "I _Phy_14_3", "qno": 3, "q": "A projectile is fired at angle θ with horizontal so that its maximum height H equals its horizontal range R. The angle of projection θ satisfies:", "a": "tan θ = 1/4", "b": "tan θ = 2", "c": "tan θ = 4", "d": "tan θ = 1", "ans": "C", "exp": "Correct answer: tan θ = 4. Verified against NCERT Class 11 Physics high-order multi-concept principles.", "tag": "Booster"}, {"id": "I _Phy_14_4", "qno": 4, "q": "A bullet of mass m moving at speed v embeds itself into a stationary wooden block of mass M suspended by a light string (ballistic pendulum). The maximum vertical height h risen by the combined block-bullet system is:", "a": "v² / (2g)", "b": "(1 / 2g) [m v / (M + m)]²", "c": "[(M + m) v / m]² / (2g)", "d": "m v² / (2 M g)", "ans": "B", "exp": "Correct answer: (1 / 2g) [m v / (M + m)]². Verified against NCERT Class 11 Physics high-order multi-concept principles.", "tag": "Booster"}, {"id": "I _Phy_14_5", "qno": 5, "q": "Statement I: In an elastic head-on collision between two identical bodies, they completely exchange their velocities.\nStatement II: In an inelastic collision, linear momentum is conserved (if net external force is zero), while total kinetic energy decreases.\nChoose the correct option:", "a": "Both Statement I and Statement II are incorrect", "b": "Both Statement I and Statement II are correct", "c": "Statement I is incorrect but Statement II is correct", "d": "Statement I is correct but Statement II is incorrect", "ans": "B", "exp": "Correct answer: Both Statement I and Statement II are correct. Verified against NCERT Class 11 Physics high-order multi-concept principles.", "tag": "Booster"}]}, {"chapter": "Verified PYQs (NEET & KCET)", "questions": [{"id": "I _Phy_15_1", "qno": 1, "q": "[KCET 2025] A body of mass 0.25 kg travels along a straight line from x = 0 to x = 2 m with speed v = k x^(3/2) where k = 2 SI units. The work done by the net force during this displacement is:", "a": "32 J", "b": "8 J", "c": "4 J", "d": "16 J", "ans": "C", "exp": "By the work-energy theorem, W_net = (1/2)m(v2 − u2) = (1/2)(0.25)(4 × 8 − 0) = 4 J.", "tag": "PYQ"}, {"id": "I _Phy_15_2", "qno": 2, "q": "[KCET 2025] During an elastic collision between two bodies, which of the following statements are correct?\nI. Initial kinetic energy equals final kinetic energy of the system.\nII. Linear momentum is conserved.\nIII. Kinetic energy during collision time Δt is not conserved.", "a": "I, II and III", "b": "I and III only", "c": "II and III only", "d": "I and II only", "ans": "A", "exp": "Linear momentum is conserved throughout and initial KE equals final KE, while during the brief contact interval Δt part of KE is temporarily stored as elastic potential energy.", "tag": "PYQ"}, {"id": "I _Phy_15_3", "qno": 3, "q": "[NEET 2026] The angular speed of a flywheel is increased from 600 rpm to 1200 rpm in 10 s. The number of revolutions completed by the flywheel during this time is:", "a": "150", "b": "600", "c": "900", "d": "300", "ans": "A", "exp": "Initial frequency n1 = 600/60 = 10 rev/s, final n2 = 1200/60 = 20 rev/s. Revolutions = ((n1 + n2)/2) × t = 15 × 10 = 150.", "tag": "PYQ"}, {"id": "I _Phy_15_4", "qno": 4, "q": "[NEET 2025] The Sun rotates around its centre once in 27 days. What will be the period of revolution if the Sun were to expand to twice its present radius without any external influence? (Assume uniform density sphere.)", "a": "100 days", "b": "108 days", "c": "115 days", "d": "105 days", "ans": "B", "exp": "By conservation of angular momentum, I1ω1 = I2ω2 → (2/5)MR2(2π/T) = (2/5)M(2R)2(2π/T') → T' = 4T = 4 × 27 = 108 days.", "tag": "PYQ"}, {"id": "I _Phy_15_5", "qno": 5, "q": "[NEET 2024] The moment of inertia of a thin rod about an axis passing through its mid-point and perpendicular to the rod is 2400 g cm2. The length of the 400 g rod is nearly:", "a": "20.7 cm", "b": "17.5 cm", "c": "72.0 cm", "d": "8.5 cm", "ans": "D", "exp": "I = mL2/12 → 2400 = 400 × L2/12 → L2 = 72 → L = √72 ≈ 8.5 cm.", "tag": "PYQ"}]}, {"chapter": "NEET Statement, A-R & Match", "questions": [{"id": "I _Phy_16_1", "qno": 1, "q": "Given below are two statements:\nStatement I: All dimensionally correct equations are necessarily physically correct.\nStatement II: A dimensionless quantity may still possess a unit, such as plane angle in radian.\nIn the light of the above statements, choose the correct option:", "a": "Both Statement I and Statement II are correct", "b": "Statement I is correct but Statement II is incorrect", "c": "Both Statement I and Statement II are incorrect", "d": "Statement I is incorrect but Statement II is correct", "ans": "D", "exp": "Dimensional consistency is necessary but not sufficient (e.g., s = ut + at2 is dimensionally right but physically wrong), whereas radian and steradian are dimensionless quantities with units.", "tag": "Booster"}, {"id": "I _Phy_16_2", "qno": 2, "q": "Given below are two statements:\nStatement I: Trailing zeroes in a number with a decimal point are significant figures.\nStatement II: Changing the unit of measurement changes the number of significant figures in a recorded value.\nIn the light of the above statements, choose the correct option:", "a": "Statement I is incorrect but Statement II is correct", "b": "Statement I is correct but Statement II is incorrect", "c": "Both Statement I and Statement II are correct", "d": "Both Statement I and Statement II are incorrect", "ans": "B", "exp": "Trailing zeroes after a decimal point are significant (e.g., 3.500 has 4 SF), and unit conversion using scientific notation never alters the number of significant figures.", "tag": "Booster"}, {"id": "I _Phy_16_3", "qno": 3, "q": "Given below are two statements:\nStatement I: Torque and work have identical dimensional formula [M L2 T-2].\nStatement II: Surface tension and spring constant share the same dimensional formula [M T-2].\nIn the light of the above statements, choose the correct option:", "a": "Statement I is incorrect but Statement II is correct", "b": "Both Statement I and Statement II are correct", "c": "Both Statement I and Statement II are incorrect", "d": "Statement I is correct but Statement II is incorrect", "ans": "B", "exp": "Both torque (r × F) and work (F · d) have dimensions [M L2 T-2]; both surface tension (F/L) and spring constant (F/x) have dimensions [M T-2].", "tag": "Booster"}, {"id": "I _Phy_16_4", "qno": 4, "q": "Given below are two statements:\nStatement I: Random errors can be minimized by taking the arithmetic mean of a large number of observations.\nStatement II: Zero error of a Vernier calliper is an example of a random error.\nIn the light of the above statements, choose the correct option:", "a": "Both Statement I and Statement II are correct", "b": "Both Statement I and Statement II are incorrect", "c": "Statement I is correct but Statement II is incorrect", "d": "Statement I is incorrect but Statement II is correct", "ans": "C", "exp": "Repeating measurements reduces random error by 1/√N, whereas zero error of an instrument is a systematic (instrumental) error.", "tag": "Booster"}, {"id": "I _Phy_16_5", "qno": 5, "q": "Given below are two statements:\nStatement I: Planck's constant h and angular momentum L have the same dimensions [M L2 T-1].\nStatement II: Stress, pressure, and Young's modulus all have identical dimensions [M L-1 T-2].\nIn the light of the above statements, choose the correct option:", "a": "Both Statement I and Statement II are correct", "b": "Statement I is incorrect but Statement II is correct", "c": "Both Statement I and Statement II are incorrect", "d": "Statement I is correct but Statement II is incorrect", "ans": "A", "exp": "Both h = E/ν and L = mvr have dimensions [M L2 T-1]; stress, pressure, and elastic moduli all have dimensions of force per unit area [M L-1 T-2].", "tag": "Booster"}]}], "II PUC|Physics": [{"chapter": "Chapter 1 - Electric Charges", "questions": [{"id": "II_Phy_17_1", "qno": 1, "q": "What are the THREE fundamental properties of electric charge?", "a": "Vector nature, non-conservation and continuity", "b": "Attraction only, non-additivity and divisibility", "c": "Additivity (algebraic sum), Conservation (total charge of isolated system is constant) and Quantisation (q = ±ne)", "d": "Mass dependence, velocity dependence and polarity only", "ans": "C", "exp": "Additivity (algebraic sum), Conservation (total charge of isolated system is constant) and Quantisation (q = ±ne). Electric charge is additive, conserved, invariant and quantised (q = ±ne, e = 1.602 × 10-19 C; 1 C = 6.25 × 1018 electrons). Repulsion is the sure test of charge; charging occurs by friction, conduction or", "tag": "NCERT"}, {"id": "II_Phy_17_2", "qno": 2, "q": "According to quantisation of charge q = ±ne (where e = 1.6 × 10-19 C), which of the following charges CANNOT exist on a body?", "a": "6.4 × 10-19 C (4e)", "b": "−4e", "c": "2e", "d": "3.5e  (or 2.4 × 10-19 C — not an integral multiple of e)", "ans": "D", "exp": "'3.5e (or 2.4 × 10-19 C — not an integral multiple of e)' is the incorrect/exception choice; the other three options are accurate. Electric charge is additive, conserved, invariant and quantised (q = ±ne, e = 1.602 × 10-19 C; 1 C = 6.25 × 1018 electrons). Repulsion is the sure test of charge; charging occurs by frictio", "tag": "NCERT"}, {"id": "II_Phy_17_3", "qno": 3, "q": "How many electrons must be removed from a neutral body to give it a positive charge of +1 C?", "a": "6.25 × 1019 electrons", "b": "6.022 × 1023 electrons", "c": "1.6 × 1019 electrons", "d": "6.25 × 1018 electrons  [n = q/e = 1 / (1.6 × 10-19)]", "ans": "D", "exp": "6.25 × 1018 electrons [n = q/e = 1 / (1.6 × 10-19)]. Electric charge is additive, conserved, invariant and quantised (q = ±ne, e = 1.602 × 10-19 C; 1 C = 6.25 × 1018 electrons). Repulsion is the sure test of charge; charging occurs by friction, conduction or induction. Coulomb's law gives F = (1/4πε0)|q1q2|/r2 with 1/(", "tag": "NCERT"}, {"id": "II_Phy_17_4", "qno": 4, "q": "When a glass rod is rubbed with silk cloth, what happens to their charges and masses?", "a": "Glass rod loses electrons (becomes positively charged, mass decreases slightly); silk gains electrons (negatively charged, mass increases slightly)", "b": "Both become positively charged", "c": "Masses remain strictly unchanged", "d": "Glass gains protons and silk loses protons", "ans": "A", "exp": "Glass rod loses electrons (becomes positively charged, mass decreases slightly); silk gains electrons (negatively charged, mass increases slightly). Electric charge is additive, conserved, invariant and quantised (q = ±ne, e = 1.602 × 10-19 C; 1 C = 6.25 × 1018 electrons). Repulsion is the sure test of charge; charging", "tag": "NCERT"}, {"id": "II_Phy_17_5", "qno": 5, "q": "If a body contains n1 protons and n2 electrons, what is the net electric charge on the body?", "a": "(n1n2)e", "b": "(n1 − n2)e", "c": "(n1 + n2)e", "d": "(n2 − n1)e", "ans": "B", "exp": "Correct answer: (n1 − n2)e. Electric charge is additive, conserved, invariant and quantised (q = ±ne, e = 1.602 × 10-19 C; 1 C = 6.25 × 1018 electrons). Repulsion is the sure test of charge; charging occurs by friction, conduction or induction. Coulomb's law gives F = (1/4πε0)|q1q2|/r2 with 1/(4πε0) = 9 × 109 N m2 C-2 ", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Potential & Cap", "questions": [{"id": "II_Phy_18_1", "qno": 1, "q": "How is Electrostatic Potential V at a point defined, and what is its SI unit?", "a": "Work done per unit positive test charge by an external agent in bringing it slowly from infinity to that point: V = Wext / q0; SI unit: Volt (V = J C-1), scalar", "b": "Charge per unit work; C J-1", "c": "Force per unit charge; N C-1", "d": "Vector quantity in V m-1", "ans": "A", "exp": "Work done per unit positive test charge by an external agent in bringing it slowly from infinity to that point: V = Wext / q0; SI unit: Volt (V = J C-1), scalar. Electrostatic potential V = Wext/q0 (Volt = J C-1, scalar, [ML2T-3A-1]) equals kq/r for a point charge and kp cos θ / r2 for a short dipole (zero on equatoria", "tag": "NCERT"}, {"id": "II_Phy_18_2", "qno": 2, "q": "What is the dimensional formula of Electric Potential (V)?", "a": "[M-1 L-2 T4 A2]", "b": "[M L2 T-3 A-1]", "c": "[M L T-3 A-1]", "d": "[M L2 T-2 A-1]", "ans": "B", "exp": "Correct answer: [M L2 T-3 A-1]. Electrostatic potential V = Wext/q0 (Volt = J C-1, scalar, [ML2T-3A-1]) equals kq/r for a point charge and kp cos θ / r2 for a short dipole (zero on equatorial plane). E = −dV/dr points toward steepest decrease of V. Equipotential surfaces are concentric spheres (point charge), coaxial c", "tag": "NCERT"}, {"id": "II_Phy_18_3", "qno": 3, "q": "What is the electrostatic potential V at distance r from an isolated point charge q in vacuum?", "a": "V = (1 / 4πε0) × (q / r3)", "b": "V = (1 / 4πε0) × (q / r2)", "c": "V = 4πε0 q r", "d": "V = (1 / 4πε0) × (q / r)  (positive for +q, negative for −q; V ∝ 1/r)", "ans": "D", "exp": "V = (1 / 4πε0) × (q / r) (positive for +q, negative for −q; V ∝ 1/r). Electrostatic potential V = Wext/q0 (Volt = J C-1, scalar, [ML2T-3A-1]) equals kq/r for a point charge and kp cos θ / r2 for a short dipole (zero on equatorial plane). E = −dV/dr points toward steepest decrease of V. Equipotential surfaces are concen", "tag": "NCERT"}, {"id": "II_Phy_18_4", "qno": 4, "q": "How do the electric potential of a point charge (VP) and a short electric dipole (VD) vary with distance r?", "a": "VP ∝ 1/r   and   VD ∝ 1/r2", "b": "Both ∝ 1/r", "c": "VP ∝ 1/r2 and VD ∝ 1/r3", "d": "VP ∝ 1/r3 and VD ∝ 1/r2", "ans": "A", "exp": "Correct answer: VP ∝ 1/r and VD ∝ 1/r2. Electrostatic potential V = Wext/q0 (Volt = J C-1, scalar, [ML2T-3A-1]) equals kq/r for a point charge and kp cos θ / r2 for a short dipole (zero on equatorial plane). E = −dV/dr points toward steepest decrease of V. Equipotential surfaces are concentric spheres (point charge), c", "tag": "NCERT"}, {"id": "II_Phy_18_5", "qno": 5, "q": "As shown in the electric dipole potential diagram, what is the potential V at distance r (r >> 2a) making angle θ with dipole moment p?", "a": "V = (1 / 4πε0) × (p cos θ / r2) = (1 / 4πε0) × (p · r̂ / r2)", "b": "V = (1 / 4πε0) × (2p cos θ / r3)", "c": "V = (1 / 4πε0) × (p / r)", "d": "V = (1 / 4πε0) × (p sin θ / r2)", "ans": "A", "exp": "V = (1 / 4πε0) × (p cos θ / r2) = (1 / 4πε0) × (p · r̂ / r2). Electrostatic potential V = Wext/q0 (Volt = J C-1, scalar, [ML2T-3A-1]) equals kq/r for a point charge and kp cos θ / r2 for a short dipole (zero on equatorial plane). E = −dV/dr points toward steepest decrease of V. Equipotential surfaces are concentric sph", "tag": "NCERT"}]}, {"chapter": "Chapter 3 - Current Electricity", "questions": [{"id": "II_Phy_19_1", "qno": 1, "q": "Electric current I = dQ/dt is a SCALAR or VECTOR quantity, and why?", "a": "SCALAR quantity (even though it has direction along a wire, currents obey ordinary scalar algebraic addition at a junction, NOT vector addition)", "b": "Dimensionless quantity", "c": "Vector quantity", "d": "Tensor quantity", "ans": "A", "exp": "SCALAR quantity (even though it has direction along a wire, currents obey ordinary scalar algebraic addition at a junction, NOT vector addition). Electric current I = dQ/dt is a scalar (Ampere); current density j = I/A is a vector (A m-2). Drift velocity vd = eEτ/m (~10-4 m s-1), I = neAvd, mobility μ = |vd|/E = eτ/m (", "tag": "NCERT"}, {"id": "II_Phy_19_2", "qno": 2, "q": "What are the mobile charge carriers in (i) metallic conductors, (ii) electrolytes, (iii) ionised gases, and (iv) semiconductors?", "a": "Only free electrons in all four", "b": "Only protons in metals", "c": "(i) Free electrons, (ii) Positive & negative ions, (iii) Electrons & positive ions, (iv) Electrons & holes", "d": "Ions in metals and electrons in electrolytes", "ans": "C", "exp": "(i) Free electrons, (ii) Positive & negative ions, (iii) Electrons & positive ions, (iv) Electrons & holes. Electric current I = dQ/dt is a scalar (Ampere); current density j = I/A is a vector (A m-2). Drift velocity vd = eEτ/m (~10-4 m s-1), I = neAvd, mobility μ = |vd|/E = eτ/m (m2 V-1 s-1), microscopic Ohm's law j =", "tag": "NCERT"}, {"id": "II_Phy_19_3", "qno": 3, "q": "How is CURRENT DENSITY j defined, and is it a scalar or vector?", "a": "Scalar quantity in A m2", "b": "j = I × A", "c": "j = I / A (I = j · A = jA cos θ); VECTOR quantity directed along conventional current / electric field E; SI unit: A m-2, dimensions [L-2 A]", "d": "Directed opposite to E in metals", "ans": "C", "exp": "j = I / A (I = j · A = jA cos θ); VECTOR quantity directed along conventional current / electric field E; SI unit: A m-2, dimensions [L-2 A]. Electric current I = dQ/dt is a scalar (Ampere); current density j = I/A is a vector (A m-2). Drift velocity vd = eEτ/m (~10-4 m s-1), I = neAvd, mobility μ = |vd|/E = eτ/m (m2 V", "tag": "NCERT"}, {"id": "II_Phy_19_4", "qno": 4, "q": "In the absence of an applied electric field, what is the average thermal velocity of free electrons in a metallic conductor at room temperature?", "a": "3 × 108 m s-1", "b": "Zero (thermal velocities ~105 m s-1 are randomly oriented in all directions, so their vector average cancels to 0)", "c": "10-4 m s-1", "d": "105 m s-1", "ans": "B", "exp": "Zero (thermal velocities ~105 m s-1 are randomly oriented in all directions, so their vector average cancels to 0). Electric current I = dQ/dt is a scalar (Ampere); current density j = I/A is a vector (A m-2). Drift velocity vd = eEτ/m (~10-4 m s-1), I = neAvd, mobility μ = |vd|/E = eτ/m (m2 V-1 s-1), microscopic Ohm's", "tag": "NCERT"}, {"id": "II_Phy_19_5", "qno": 5, "q": "What is the expression for DRIFT VELOCITY vd of free electrons in terms of electric field E, charge e, mass m and relaxation time τ?", "a": "vd = eEτ2 / m", "b": "vd = mE / (eτ)", "c": "vd = −(eE / m) τ   (magnitude vd = eEτ / m; typical order ~10-4 m s-1, opposite to E)", "d": "vd = eE / (mτ)", "ans": "C", "exp": "vd = −(eE / m) τ (magnitude vd = eEτ / m; typical order ~10-4 m s-1, opposite to E). Electric current I = dQ/dt is a scalar (Ampere); current density j = I/A is a vector (A m-2). Drift velocity vd = eEτ/m (~10-4 m s-1), I = neAvd, mobility μ = |vd|/E = eτ/m (m2 V-1 s-1), microscopic Ohm's law j = σE with σ = ne2τ/m and", "tag": "NCERT"}]}, {"chapter": "Chapter 4 - Moving Charges", "questions": [{"id": "II_Phy_20_1", "qno": 1, "q": "What is the LORENTZ FORCE F acting on a charge q moving with velocity v in combined electric field E and magnetic field B?", "a": "F = q (E · v) B", "b": "F = q (E + vB)", "c": "F = q [E + (B × v)]", "d": "F = q [E + (v × B)]", "ans": "D", "exp": "Correct answer: F = q [E + (v × B)]. Lorentz force F = q(E + v × B); magnetic force Fm = qvB sin θ does zero work (always ⊥ v), keeping speed and kinetic energy constant. In uniform B: perpendicular entry gives circle of radius r = mv/(qB), period T = 2πm/(qB) (independent of v and r), cyclotron frequency ν = qB/(2πm);", "tag": "NCERT"}, {"id": "II_Phy_20_2", "qno": 2, "q": "What is the magnetic force Fm acting on a STATIONARY charge (v = 0) placed in a strong uniform magnetic field B?", "a": "q B", "b": "Infinite", "c": "q E", "d": "Zero (0 N — magnetic force qvB sin θ acts ONLY on moving charges)", "ans": "D", "exp": "Zero (0 N — magnetic force qvB sin θ acts ONLY on moving charges). Lorentz force F = q(E + v × B); magnetic force Fm = qvB sin θ does zero work (always ⊥ v), keeping speed and kinetic energy constant. In uniform B: perpendicular entry gives circle of radius r = mv/(qB), period T = 2πm/(qB) (independent of v and r), cyc", "tag": "NCERT"}, {"id": "II_Phy_20_3", "qno": 3, "q": "What are the SI unit and dimensional formula of Magnetic Field B (magnetic flux density)?", "a": "A m-1; [L-1 A]", "b": "Tesla (T = N A-1 m-1 = Wb m-2); dimensional formula [M T-2 A-1]  (1 T = 104 gauss)", "c": "Weber (Wb); [M L2 T-2 A-1]", "d": "Henry (H); [M L2 T-2 A-2]", "ans": "B", "exp": "Tesla (T = N A-1 m-1 = Wb m-2); dimensional formula [M T-2 A-1] (1 T = 104 gauss). Lorentz force F = q(E + v × B); magnetic force Fm = qvB sin θ does zero work (always ⊥ v), keeping speed and kinetic energy constant. In uniform B: perpendicular entry gives circle of radius r = mv/(qB), period T = 2πm/(qB) (independent ", "tag": "NCERT"}, {"id": "II_Phy_20_4", "qno": 4, "q": "Why does a static magnetic field B do ZERO WORK on a moving charged particle?", "a": "Because charge is neutral", "b": "Because B is always zero", "c": "Because the magnetic force F = q(v × B) is ALWAYS perpendicular to velocity v, so power P = F · v = 0 and kinetic energy/speed remain constant", "d": "Because acceleration is zero", "ans": "C", "exp": "Because the magnetic force F = q(v × B) is ALWAYS perpendicular to velocity v, so power P = F · v = 0 and kinetic energy/speed remain constant. Lorentz force F = q(E + v × B); magnetic force Fm = qvB sin θ does zero work (always ⊥ v), keeping speed and kinetic energy constant. In uniform B: perpendicular entry gives ci", "tag": "NCERT"}, {"id": "II_Phy_20_5", "qno": 5, "q": "What is the path of a charged particle q of mass m entering a uniform magnetic field B (i) parallel (θ = 0°), (ii) perpendicular (θ = 90°), and (iii) obliquely (0° < θ < 90°)?", "a": "(i) Circle, (ii) Helix, (iii) Parabola", "b": "(i) Straight line, (ii) Circle of radius r = mv/(qB), (iii) Helix of pitch p = (v cos θ) × (2πm / qB)", "c": "Parabola in all three cases", "d": "Circle in all three cases", "ans": "B", "exp": "(i) Straight line, (ii) Circle of radius r = mv/(qB), (iii) Helix of pitch p = (v cos θ) × (2πm / qB). Lorentz force F = q(E + v × B); magnetic force Fm = qvB sin θ does zero work (always ⊥ v), keeping speed and kinetic energy constant. In uniform B: perpendicular entry gives circle of radius r = mv/(qB), period T = 2π", "tag": "NCERT"}]}, {"chapter": "Chapter 5 - Magnetism & Matter", "questions": [{"id": "II_Phy_21_1", "qno": 1, "q": "As shown in the bar magnet field lines diagram, how do MAGNETIC field lines differ fundamentally from ELECTROSTATIC field lines?", "a": "Electrostatic field lines form closed loops", "b": "Magnetic field lines start on N and terminate on S", "c": "Magnetic field lines intersect at the poles", "d": "Magnetic field lines ALWAYS form continuous CLOSED LOOPS (N → S outside and S → N inside the magnet); electrostatic field lines never form closed loops", "ans": "D", "exp": "Magnetic field lines ALWAYS form continuous CLOSED LOOPS (N → S outside and S → N inside the magnet); electrostatic field lines never form closed loops. A bar magnet has magnetic dipole moment m = qm(2l) from S to N (A m2 or J T-1); magnetic field lines form continuous closed loops (outside N→S, inside S→N) and never i", "tag": "NCERT"}, {"id": "II_Phy_21_2", "qno": 2, "q": "As shown in the bar magnet diagram, how does the magnetic length (2l) compare with the geometric length (AB) of a bar magnet?", "a": "Magnetic length is zero", "b": "Magnetic length is greater than geometric length", "c": "Magnetic length 2l is SLIGHTLY LESS than geometric length (2l ≈ 0.84 × geometric length), because poles lie slightly inside the ends", "d": "Both are strictly identical", "ans": "C", "exp": "Magnetic length 2l is SLIGHTLY LESS than geometric length (2l ≈ 0.84 × geometric length), because poles lie slightly inside the ends. A bar magnet has magnetic dipole moment m = qm(2l) from S to N (A m2 or J T-1); magnetic field lines form continuous closed loops (outside N→S, inside S→N) and never intersect. Cutting a", "tag": "NCERT"}, {"id": "II_Phy_21_3", "qno": 3, "q": "What is the SI unit of magnetic pole strength (qm) and magnetic dipole moment (m = qm × 2l) of a bar magnet?", "a": "qm: T; m: Wb", "b": "qm: A m2; m: A m", "c": "Pole strength qm: A m;   Magnetic dipole moment m: A m2 (or J T-1), directed from South pole TO North pole", "d": "Both are dimensionless", "ans": "C", "exp": "Pole strength qm: A m; Magnetic dipole moment m: A m2 (or J T-1), directed from South pole TO North pole. A bar magnet has magnetic dipole moment m = qm(2l) from S to N (A m2 or J T-1); magnetic field lines form continuous closed loops (outside N→S, inside S→N) and never intersect. Cutting a bar magnet transversely hal", "tag": "NCERT"}, {"id": "II_Phy_21_4", "qno": 4, "q": "If a bar magnet of magnetic moment M and length L is cut into TWO EQUAL HALVES (i) transverse to its length, and (ii) longitudinally along its length, what is the magnetic moment of each piece?", "a": "M/4 in both cases", "b": "M in both cases", "c": "M/2 and M respectively", "d": "M / 2 in BOTH cases (transverse cut halves length L→L/2; longitudinal cut halves pole strength qm→qm/2)", "ans": "D", "exp": "M / 2 in BOTH cases (transverse cut halves length L→L/2; longitudinal cut halves pole strength qm→qm/2). A bar magnet has magnetic dipole moment m = qm(2l) from S to N (A m2 or J T-1); magnetic field lines form continuous closed loops (outside N→S, inside S→N) and never intersect. Cutting a bar magnet transversely halv", "tag": "NCERT"}, {"id": "II_Phy_21_5", "qno": 5, "q": "As shown in the bar magnet ≡ solenoid diagram, what is the magnetic field of a short bar magnet (moment m) at large distance r (i) on its AXIAL line and (ii) on its EQUATORIAL line?", "a": "Zero on equatorial line", "b": "Both vary as 1/r2", "c": "Axial: m/r3; Equatorial: 2m/r3", "d": "Axial: Baxial = (μ0 / 4π)(2m / r3) (along m);   Equatorial: Beq = (μ0 / 4π)(m / r3) (antiparallel to m); ratio = 2 : 1", "ans": "D", "exp": "Axial: Baxial = (μ0 / 4π)(2m / r3) (along m); Equatorial: Beq = (μ0 / 4π)(m / r3) (antiparallel to m); ratio = 2 : 1. A bar magnet has magnetic dipole moment m = qm(2l) from S to N (A m2 or J T-1); magnetic field lines form continuous closed loops (outside N→S, inside S→N) and never intersect. Cutting a bar magnet tran", "tag": "NCERT"}]}, {"chapter": "Chapter 6 - EM Induction", "questions": [{"id": "II_Phy_22_1", "qno": 1, "q": "The SI unit of magnetic flux ΦB is:", "a": "Henry (H)", "b": "Ampere-turn", "c": "Weber (Wb)", "d": "Tesla (T)", "ans": "C", "exp": "Correct answer: Weber (Wb). Magnetic flux ΦB = B · A = BA cos θ is a scalar (Weber, 1 Wb = 1 T m2, [ML2T-2A-1]). Faraday's law gives e = −N(dΦB/dt), where the negative sign expresses Lenz's law (conservation of energy: induced current opposes the flux change causing it). Total induced charge q = N|ΔΦB|/R is independent", "tag": "NCERT"}, {"id": "II_Phy_22_2", "qno": 2, "q": "One weber (1 Wb) is equivalent to:", "a": "1 T m2", "b": "1 N A-1 m-1", "c": "1 T m-2", "d": "1 T m-1", "ans": "A", "exp": "Correct answer: 1 T m2. Magnetic flux ΦB = B · A = BA cos θ is a scalar (Weber, 1 Wb = 1 T m2, [ML2T-2A-1]). Faraday's law gives e = −N(dΦB/dt), where the negative sign expresses Lenz's law (conservation of energy: induced current opposes the flux change causing it). Total induced charge q = N|ΔΦB|/R is independent of ", "tag": "NCERT"}, {"id": "II_Phy_22_3", "qno": 3, "q": "The dimensional formula of magnetic flux ΦB is:", "a": "[M L T-2 A-1]", "b": "[M L2 T-2 A-2]", "c": "[M L2 T-3 A-1]", "d": "[M L2 T-2 A-1]", "ans": "D", "exp": "Correct answer: [M L2 T-2 A-1]. Magnetic flux ΦB = B · A = BA cos θ is a scalar (Weber, 1 Wb = 1 T m2, [ML2T-2A-1]). Faraday's law gives e = −N(dΦB/dt), where the negative sign expresses Lenz's law (conservation of energy: induced current opposes the flux change causing it). Total induced charge q = N|ΔΦB|/R is indepen", "tag": "NCERT"}, {"id": "II_Phy_22_4", "qno": 4, "q": "Magnetic flux through a plane surface of area A in a uniform magnetic field B making angle θ with the area vector (normal to surface) is:", "a": "ΦB = B A sin θ", "b": "ΦB = B A tan θ", "c": "ΦB = B / (A cos θ)", "d": "ΦB = B A cos θ", "ans": "D", "exp": "Correct answer: ΦB = B A cos θ. Magnetic flux ΦB = B · A = BA cos θ is a scalar (Weber, 1 Wb = 1 T m2, [ML2T-2A-1]). Faraday's law gives e = −N(dΦB/dt), where the negative sign expresses Lenz's law (conservation of energy: induced current opposes the flux change causing it). Total induced charge q = N|ΔΦB|/R is indepen", "tag": "NCERT"}, {"id": "II_Phy_22_5", "qno": 5, "q": "Magnetic flux is a:", "a": "Dimensionless number", "b": "Vector quantity", "c": "Scalar quantity", "d": "Tensor of rank 2", "ans": "C", "exp": "Correct answer: Scalar quantity. Magnetic flux ΦB = B · A = BA cos θ is a scalar (Weber, 1 Wb = 1 T m2, [ML2T-2A-1]). Faraday's law gives e = −N(dΦB/dt), where the negative sign expresses Lenz's law (conservation of energy: induced current opposes the flux change causing it). Total induced charge q = N|ΔΦB|/R is indepe", "tag": "NCERT"}]}, {"chapter": "Chapter 7 - Alternating Current", "questions": [{"id": "II_Phy_23_1", "qno": 1, "q": "The average value of a sinusoidal alternating current i = Im sin(ωt) over one complete cycle is:", "a": "Im / √2", "b": "Im / 2", "c": "2 Im / π", "d": "Zero", "ans": "D", "exp": "Correct answer: Zero. Sinusoidal AC has zero full-cycle mean, half-cycle mean 2Im/π, and Irms = Im/√2 (220 V mains → 311 V peak). Pure R: V and I in phase; pure L: I lags V by π/2 with XL = ωL (passes DC, Pavg = 0); pure C: I leads V by π/2 with XC = 1/(ωC) (blocks DC, Pavg = 0).", "tag": "NCERT"}, {"id": "II_Phy_23_2", "qno": 2, "q": "The average (mean) value of a sinusoidal alternating current i = Im sin(ωt) over a positive half-cycle is:", "a": "Im / √2 (≈ 0.707 Im)", "b": "Zero", "c": "Im / π", "d": "2 Im / π (≈ 0.637 Im)", "ans": "D", "exp": "Correct answer: 2 Im / π (≈ 0.637 Im). Sinusoidal AC has zero full-cycle mean, half-cycle mean 2Im/π, and Irms = Im/√2 (220 V mains → 311 V peak). Pure R: V and I in phase; pure L: I lags V by π/2 with XL = ωL (passes DC, Pavg = 0); pure C: I leads V by π/2 with XC = 1/(ωC) (blocks DC, Pavg = 0).", "tag": "NCERT"}, {"id": "II_Phy_23_3", "qno": 3, "q": "The root-mean-square (rms) value of a sinusoidal alternating current of peak value Im is:", "a": "Irms = Im / 2", "b": "Irms = Im / √2 (≈ 0.707 Im)", "c": "Irms = 2 Im / π", "d": "Irms = √2 Im", "ans": "B", "exp": "Irms = Im / √2 (≈ 0.707 Im). Sinusoidal AC has zero full-cycle mean, half-cycle mean 2Im/π, and Irms = Im/√2 (220 V mains → 311 V peak). Pure R: V and I in phase; pure L: I lags V by π/2 with XL = ωL (passes DC, Pavg = 0); pure C: I leads V by π/2 with XC = 1/(ωC) (blocks DC, Pavg = 0).", "tag": "NCERT"}, {"id": "II_Phy_23_4", "qno": 4, "q": "The ratio of rms value to peak value of a sinusoidal AC voltage is:", "a": "1 / √2 (≈ 0.707)", "b": "1 / 2", "c": "√2 (≈ 1.414)", "d": "2 / π (≈ 0.637)", "ans": "A", "exp": "Correct answer: 1 / √2 (≈ 0.707). Sinusoidal AC has zero full-cycle mean, half-cycle mean 2Im/π, and Irms = Im/√2 (220 V mains → 311 V peak). Pure R: V and I in phase; pure L: I lags V by π/2 with XL = ωL (passes DC, Pavg = 0); pure C: I leads V by π/2 with XC = 1/(ωC) (blocks DC, Pavg = 0).", "tag": "NCERT"}, {"id": "II_Phy_23_5", "qno": 5, "q": "Domestic AC mains in India are rated at 220 V, 50 Hz. Here 220 V represents the:", "a": "Peak (maximum) voltage", "b": "Peak-to-peak voltage", "c": "Root-mean-square (rms) voltage (peak voltage ≈ 311 V)", "d": "Average voltage over one full cycle", "ans": "C", "exp": "Root-mean-square (rms) voltage (peak voltage ≈ 311 V). Sinusoidal AC has zero full-cycle mean, half-cycle mean 2Im/π, and Irms = Im/√2 (220 V mains → 311 V peak). Pure R: V and I in phase; pure L: I lags V by π/2 with XL = ωL (passes DC, Pavg = 0); pure C: I leads V by π/2 with XC = 1/(ωC) (blocks DC, Pavg = 0).", "tag": "NCERT"}]}, {"chapter": "Chapter 8 - EM Waves", "questions": [{"id": "II_Phy_24_1", "qno": 1, "q": "The concept of displacement current was introduced by James Clerk Maxwell to resolve an inconsistency in:", "a": "Ampere's circuital law", "b": "Gauss's law of electrostatics", "c": "Gauss's law of magnetism", "d": "Faraday's law of induction", "ans": "A", "exp": "Correct answer: Ampere's circuital law. Maxwell introduced displacement current Id = ε0(dΦE/dt) (= C dV/dt in a capacitor) into Ampere-Maxwell law ∮ B · dl = μ0(Ic + Id). Accelerated/oscillating charges radiate electromagnetic waves; stationary or uniform-velocity charges do not.", "tag": "NCERT"}, {"id": "II_Phy_24_2", "qno": 2, "q": "The expression for displacement current Id in terms of rate of change of electric flux dΦE/dt is:", "a": "Id = (1 / ε0)(dΦE / dt)", "b": "Id = ε0 (dΦB / dt)", "c": "Id = μ0 (dΦE / dt)", "d": "Id = ε0 (dΦE / dt)", "ans": "D", "exp": "Correct answer: Id = ε0 (dΦE / dt). Maxwell introduced displacement current Id = ε0(dΦE/dt) (= C dV/dt in a capacitor) into Ampere-Maxwell law ∮ B · dl = μ0(Ic + Id). Accelerated/oscillating charges radiate electromagnetic waves; stationary or uniform-velocity charges do not.", "tag": "NCERT"}, {"id": "II_Phy_24_3", "qno": 3, "q": "The Ampere-Maxwell circuital law is written as:", "a": "∮ E · dl = μ0 (Ic + Id)", "b": "∮ B · dl = μ0 (Ic − ε0 dΦE/dt)", "c": "∮ B · dl = μ0 (Ic + ε0 dΦE/dt)", "d": "∮ B · dl = ε0 (Ic + Id)", "ans": "C", "exp": "∮ B · dl = μ0 (Ic + ε0 dΦE/dt). Maxwell introduced displacement current Id = ε0(dΦE/dt) (= C dV/dt in a capacitor) into Ampere-Maxwell law ∮ B · dl = μ0(Ic + Id). Accelerated/oscillating charges radiate electromagnetic waves; stationary or uniform-velocity charges do not.", "tag": "NCERT"}, {"id": "II_Phy_24_4", "qno": 4, "q": "Inside the air gap between the plates of a charging parallel-plate capacitor, the current that produces a magnetic field is:", "a": "Ionic current", "b": "Displacement current only (conduction current is zero)", "c": "Zero current and zero magnetic field", "d": "Conduction current only", "ans": "B", "exp": "Displacement current only (conduction current is zero). Maxwell introduced displacement current Id = ε0(dΦE/dt) (= C dV/dt in a capacitor) into Ampere-Maxwell law ∮ B · dl = μ0(Ic + Id). Accelerated/oscillating charges radiate electromagnetic waves; stationary or uniform-velocity charges do not.", "tag": "NCERT"}, {"id": "II_Phy_24_5", "qno": 5, "q": "During the charging of a parallel-plate capacitor, the displacement current Id between the plates is:", "a": "Always zero", "b": "Half the conduction current", "c": "Twice the conduction current", "d": "Equal to the conduction current Ic in the connecting wires", "ans": "D", "exp": "Equal to the conduction current Ic in the connecting wires. Maxwell introduced displacement current Id = ε0(dΦE/dt) (= C dV/dt in a capacitor) into Ampere-Maxwell law ∮ B · dl = μ0(Ic + Id). Accelerated/oscillating charges radiate electromagnetic waves; stationary or uniform-velocity charges do not.", "tag": "NCERT"}]}, {"chapter": "Chapter 9 - Ray Optics", "questions": [{"id": "II_Phy_25_1", "qno": 1, "q": "For a spherical mirror of small aperture, the focal length f and radius of curvature R are related by:", "a": "f = 2 R", "b": "f = R / 4", "c": "f = R", "d": "f = R / 2", "ans": "D", "exp": "Correct answer: f = R / 2. Spherical mirror: f = R/2 (unchanged in water), 1/v + 1/u = 1/f, m = −v/u. Refraction obeys n1 sin i = n2 sin r (frequency constant, λm = λ/n); apparent depth happ = hreal/n, normal shift Δh = t(1 − 1/n). TIR occurs from denser to rarer when i > ic (sin ic = 1/n), powering optical fibres (nco", "tag": "NCERT"}, {"id": "II_Phy_25_2", "qno": 2, "q": "The mirror formula relating object distance u, image distance v and focal length f (in Cartesian sign convention) is:", "a": "1/v + 1/u = 1/f", "b": "u + v = f", "c": "1/u − 1/v = 1/f", "d": "1/v − 1/u = 1/f", "ans": "A", "exp": "Correct answer: 1/v + 1/u = 1/f. Spherical mirror: f = R/2 (unchanged in water), 1/v + 1/u = 1/f, m = −v/u. Refraction obeys n1 sin i = n2 sin r (frequency constant, λm = λ/n); apparent depth happ = hreal/n, normal shift Δh = t(1 − 1/n). TIR occurs from denser to rarer when i > ic (sin ic = 1/n), powering optical fibre", "tag": "NCERT"}, {"id": "II_Phy_25_3", "qno": 3, "q": "For a spherical mirror, linear magnification m is given by:", "a": "m = −u / v", "b": "m = h' / h = −v / u", "c": "m = v u / f", "d": "m = +v / u", "ans": "B", "exp": "Correct answer: m = h' / h = −v / u. Spherical mirror: f = R/2 (unchanged in water), 1/v + 1/u = 1/f, m = −v/u. Refraction obeys n1 sin i = n2 sin r (frequency constant, λm = λ/n); apparent depth happ = hreal/n, normal shift Δh = t(1 − 1/n). TIR occurs from denser to rarer when i > ic (sin ic = 1/n), powering optical f", "tag": "NCERT"}, {"id": "II_Phy_25_4", "qno": 4, "q": "Which mirror is used as a rear-view mirror in vehicles because it always forms a virtual, erect and diminished image with a wide field of view?", "a": "Parabolic concave mirror", "b": "Concave mirror", "c": "Plane mirror", "d": "Convex mirror", "ans": "D", "exp": "Correct answer: Convex mirror. Spherical mirror: f = R/2 (unchanged in water), 1/v + 1/u = 1/f, m = −v/u. Refraction obeys n1 sin i = n2 sin r (frequency constant, λm = λ/n); apparent depth happ = hreal/n, normal shift Δh = t(1 − 1/n). TIR occurs from denser to rarer when i > ic (sin ic = 1/n), powering optical fibres ", "tag": "NCERT"}, {"id": "II_Phy_25_5", "qno": 5, "q": "Which mirror is used by dentists and in shaving mirrors to form a magnified, erect virtual image when held close to the object?", "a": "Convex mirror", "b": "Plane mirror", "c": "Concave mirror (object placed between pole P and focus F)", "d": "Cylindrical mirror", "ans": "C", "exp": "Concave mirror (object placed between pole P and focus F). Spherical mirror: f = R/2 (unchanged in water), 1/v + 1/u = 1/f, m = −v/u. Refraction obeys n1 sin i = n2 sin r (frequency constant, λm = λ/n); apparent depth happ = hreal/n, normal shift Δh = t(1 − 1/n). TIR occurs from denser to rarer when i > ic (sin ic = 1/", "tag": "NCERT"}]}, {"chapter": "Chapter 10 - Wave Optics", "questions": [{"id": "II_Phy_26_1", "qno": 1, "q": "A wavefront is defined as the locus of all points in a medium that are vibrating:", "a": "With opposite phases", "b": "In the same phase", "c": "With zero amplitude", "d": "Along the same straight ray", "ans": "B", "exp": "Correct answer: In the same phase. Wavefronts (spherical, cylindrical, plane) are always perpendicular to rays; Huygens' principle explains reflection and refraction (v = c/n). Coherent interference gives I = I1 + I2 + 2√(I1I2) cos φ (= 4I0 cos2(φ/2) for equal intensities) and Imax/Imin = (a1+a2)2/(a1−a2)2 with energy ", "tag": "NCERT"}, {"id": "II_Phy_26_2", "qno": 2, "q": "The shape of the wavefront emerging from a point source of light in a homogeneous isotropic medium at finite distance is:", "a": "Cylindrical", "b": "Parabolic", "c": "Plane", "d": "Spherical", "ans": "D", "exp": "Correct answer: Spherical. Wavefronts (spherical, cylindrical, plane) are always perpendicular to rays; Huygens' principle explains reflection and refraction (v = c/n). Coherent interference gives I = I1 + I2 + 2√(I1I2) cos φ (= 4I0 cos2(φ/2) for equal intensities) and Imax/Imin = (a1+a2)2/(a1−a2)2 with energy conserve", "tag": "NCERT"}, {"id": "II_Phy_26_3", "qno": 3, "q": "The shape of the wavefront emerging from a narrow linear slit illuminated by monochromatic light is:", "a": "Spherical", "b": "Plane", "c": "Conical", "d": "Cylindrical", "ans": "D", "exp": "Correct answer: Cylindrical. Wavefronts (spherical, cylindrical, plane) are always perpendicular to rays; Huygens' principle explains reflection and refraction (v = c/n). Coherent interference gives I = I1 + I2 + 2√(I1I2) cos φ (= 4I0 cos2(φ/2) for equal intensities) and Imax/Imin = (a1+a2)2/(a1−a2)2 with energy conser", "tag": "NCERT"}, {"id": "II_Phy_26_4", "qno": 4, "q": "The wavefront of light coming from a very distant star (or the Sun) reaching Earth is approximately:", "a": "Spherical", "b": "Cylindrical", "c": "Hyperbolic", "d": "Plane", "ans": "D", "exp": "Correct answer: Plane. Wavefronts (spherical, cylindrical, plane) are always perpendicular to rays; Huygens' principle explains reflection and refraction (v = c/n). Coherent interference gives I = I1 + I2 + 2√(I1I2) cos φ (= 4I0 cos2(φ/2) for equal intensities) and Imax/Imin = (a1+a2)2/(a1−a2)2 with energy conserved vi", "tag": "NCERT"}, {"id": "II_Phy_26_5", "qno": 5, "q": "The direction of propagation of a light ray is always:", "a": "At 45° to the wavefront", "b": "Perpendicular (normal) to the wavefront", "c": "Opposite to the wave velocity", "d": "Parallel to the wavefront", "ans": "B", "exp": "Perpendicular (normal) to the wavefront. Wavefronts (spherical, cylindrical, plane) are always perpendicular to rays; Huygens' principle explains reflection and refraction (v = c/n). Coherent interference gives I = I1 + I2 + 2√(I1I2) cos φ (= 4I0 cos2(φ/2) for equal intensities) and Imax/Imin = (a1+a2)2/(a1−a2)2 with e", "tag": "NCERT"}]}, {"chapter": "Chapter 11 - Dual Nature", "questions": [{"id": "II_Phy_27_1", "qno": 1, "q": "The minimum energy required by an electron to just escape from a metal surface is called its:", "a": "Stopping potential", "b": "Ionisation potential", "c": "Binding energy", "d": "Work function (φ0)", "ans": "D", "exp": "Correct answer: Work function (φ0). Photoelectric emission is instantaneous (<10-9 s) above threshold frequency ν0 = φ0/h. Saturation photocurrent ∝ intensity; stopping potential V0 and Kmax = eV0 depend on frequency ν (slope of V0 vs ν is h/e for all metals) and metal work function φ0, independent of intensity.", "tag": "NCERT"}, {"id": "II_Phy_27_2", "qno": 2, "q": "One electron-volt (1 eV) is equal to:", "a": "1.602 × 10-19 J", "b": "9.11 × 10-31 J", "c": "6.626 × 10-34 J", "d": "1.602 × 10-19 C", "ans": "A", "exp": "Correct answer: 1.602 × 10-19 J. Photoelectric emission is instantaneous (<10-9 s) above threshold frequency ν0 = φ0/h. Saturation photocurrent ∝ intensity; stopping potential V0 and Kmax = eV0 depend on frequency ν (slope of V0 vs ν is h/e for all metals) and metal work function φ0, independent of intensity.", "tag": "NCERT"}, {"id": "II_Phy_27_3", "qno": 3, "q": "Among common metals, which has the lowest work function (~2.14 eV) and which has the highest (~5.65 eV)?", "a": "Platinum (lowest) and Caesium (highest)", "b": "Copper (lowest) and Sodium (highest)", "c": "Caesium (lowest) and Platinum (highest)", "d": "Iron (lowest) and Zinc (highest)", "ans": "C", "exp": "Caesium (lowest) and Platinum (highest). Photoelectric emission is instantaneous (<10-9 s) above threshold frequency ν0 = φ0/h. Saturation photocurrent ∝ intensity; stopping potential V0 and Kmax = eV0 depend on frequency ν (slope of V0 vs ν is h/e for all metals) and metal work function φ0, independent of intensity.", "tag": "NCERT"}, {"id": "II_Phy_27_4", "qno": 4, "q": "The work function φ0 of a metal depends on:", "a": "The intensity of incident light", "b": "The distance of the light source", "c": "The frequency of incident light", "d": "The nature of the metal and the properties of its surface", "ans": "D", "exp": "The nature of the metal and the properties of its surface. Photoelectric emission is instantaneous (<10-9 s) above threshold frequency ν0 = φ0/h. Saturation photocurrent ∝ intensity; stopping potential V0 and Kmax = eV0 depend on frequency ν (slope of V0 vs ν is h/e for all metals) and metal work function φ0, independe", "tag": "NCERT"}, {"id": "II_Phy_27_5", "qno": 5, "q": "In the photoelectric effect, for a given metal and incident frequency ν > ν0, the photoelectric saturation current is directly proportional to:", "a": "The square of wavelength", "b": "The intensity of incident radiation", "c": "The work function of the metal", "d": "The frequency of incident radiation", "ans": "B", "exp": "The intensity of incident radiation. Photoelectric emission is instantaneous (<10-9 s) above threshold frequency ν0 = φ0/h. Saturation photocurrent ∝ intensity; stopping potential V0 and Kmax = eV0 depend on frequency ν (slope of V0 vs ν is h/e for all metals) and metal work function φ0, independent of intensity.", "tag": "NCERT"}]}, {"chapter": "Chapter 12 - Atoms", "questions": [{"id": "II_Phy_28_1", "qno": 1, "q": "In the Geiger-Marsden (Rutherford) alpha-particle scattering experiment, alpha particles were bombarded onto a thin foil of:", "a": "Aluminium", "b": "Sodium", "c": "Gold (thickness ~ 2.1 × 10-7 m)", "d": "Carbon", "ans": "C", "exp": "Gold (thickness ~ 2.1 × 10-7 m). Rutherford's gold-foil alpha-scattering experiment established the tiny dense positively charged nucleus (~10-15 m vs atom ~10-10 m). Impact parameter b = 0 gives 180° rebound at distance of closest approach d0 = (1/4πε0)(2Ze2/K) ∝ Z/K. Bound electron energies satisfy K = −E and U = 2E.", "tag": "NCERT"}, {"id": "II_Phy_28_2", "qno": 2, "q": "The observation in Rutherford's alpha-scattering experiment that most alpha particles passed straight through the gold foil undeflected showed that:", "a": "The atom is a uniform solid sphere", "b": "Electrons are heavier than alpha particles", "c": "Gold has no nucleus", "d": "Most of the space inside an atom is empty", "ans": "D", "exp": "Most of the space inside an atom is empty. Rutherford's gold-foil alpha-scattering experiment established the tiny dense positively charged nucleus (~10-15 m vs atom ~10-10 m). Impact parameter b = 0 gives 180° rebound at distance of closest approach d0 = (1/4πε0)(2Ze2/K) ∝ Z/K. Bound electron energies satisfy K = −E a", "tag": "NCERT"}, {"id": "II_Phy_28_3", "qno": 3, "q": "The rare observation (~1 in 8000) that some alpha particles were deflected by angles greater than 90° (even rebounding at 180°) led Rutherford to conclude that:", "a": "Electrons repel alpha particles backward", "b": "Alpha particles are electrically neutral", "c": "Positive charge is uniformly spread over the atom", "d": "All the positive charge and almost all the mass of the atom are concentrated in a tiny dense core (the nucleus)", "ans": "D", "exp": "All the positive charge and almost all the mass of the atom are concentrated in a tiny dense core (the nucleus). Rutherford's gold-foil alpha-scattering experiment established the tiny dense positively charged nucleus (~10-15 m vs atom ~10-10 m). Impact parameter b = 0 gives 180° rebound at distance of closest approach", "tag": "NCERT"}, {"id": "II_Phy_28_4", "qno": 4, "q": "The typical order of size of an atomic nucleus compared to the size of an atom is:", "a": "Nucleus ~ 10-15 to 10-14 m; Atom ~ 10-10 m", "b": "Both are ~ 10-10 m", "c": "Nucleus ~ 10-10 m; Atom ~ 10-15 m", "d": "Nucleus ~ 10-6 m; Atom ~ 10-3 m", "ans": "A", "exp": "Nucleus ~ 10-15 to 10-14 m; Atom ~ 10-10 m. Rutherford's gold-foil alpha-scattering experiment established the tiny dense positively charged nucleus (~10-15 m vs atom ~10-10 m). Impact parameter b = 0 gives 180° rebound at distance of closest approach d0 = (1/4πε0)(2Ze2/K) ∝ Z/K. Bound electron energies satisfy K = −E ", "tag": "NCERT"}, {"id": "II_Phy_28_5", "qno": 5, "q": "Impact parameter b in Rutherford's alpha-scattering experiment is defined as:", "a": "The minimum distance between alpha particle and nucleus", "b": "The thickness of the gold foil", "c": "The radius of the gold atom", "d": "The perpendicular distance of the initial velocity vector of the alpha particle from the centre of the nucleus", "ans": "D", "exp": "The perpendicular distance of the initial velocity vector of the alpha particle from the centre of the nucleus. Rutherford's gold-foil alpha-scattering experiment established the tiny dense positively charged nucleus (~10-15 m vs atom ~10-10 m). Impact parameter b = 0 gives 180° rebound at distance of closest approach ", "tag": "NCERT"}]}, {"chapter": "Chapter 13 - Nuclei", "questions": [{"id": "II_Phy_29_1", "qno": 1, "q": "One atomic mass unit (1 u) is defined as 1/12th the mass of a carbon-12 atom and equals approximately:", "a": "1.602 × 10-19 kg", "b": "9.11 × 10-31 kg", "c": "1.6605 × 10-27 kg", "d": "6.023 × 10-23 kg", "ans": "C", "exp": "Correct answer: 1.6605 × 10-27 kg. Nucleus AZ X has Z protons and (A−Z) neutrons; isotopes (same Z), isobars (same A), isotones (same A−Z). Nuclear radius R = R0 A1/3 (R0 ≈ 1.2 fm) gives constant nuclear density (~2.3 × 1017 kg m-3) independent of A.", "tag": "NCERT"}, {"id": "II_Phy_29_2", "qno": 2, "q": "The neutron was discovered in 1932 by:", "a": "Ernest Rutherford", "b": "Niels Bohr", "c": "James Chadwick (by bombarding beryllium with alpha particles)", "d": "J. J. Thomson", "ans": "C", "exp": "James Chadwick (by bombarding beryllium with alpha particles). Nucleus AZ X has Z protons and (A−Z) neutrons; isotopes (same Z), isobars (same A), isotones (same A−Z). Nuclear radius R = R0 A1/3 (R0 ≈ 1.2 fm) gives constant nuclear density (~2.3 × 1017 kg m-3) independent of A.", "tag": "NCERT"}, {"id": "II_Phy_29_3", "qno": 3, "q": "For a nucleus denoted by AZ X, the number of protons, nucleons and neutrons are respectively:", "a": "Z, A, and (A − Z)", "b": "Z, (A − Z), and A", "c": "(A − Z), A, and Z", "d": "A, Z, and (A + Z)", "ans": "A", "exp": "Correct answer: Z, A, and (A − Z). Nucleus AZ X has Z protons and (A−Z) neutrons; isotopes (same Z), isobars (same A), isotones (same A−Z). Nuclear radius R = R0 A1/3 (R0 ≈ 1.2 fm) gives constant nuclear density (~2.3 × 1017 kg m-3) independent of A.", "tag": "NCERT"}, {"id": "II_Phy_29_4", "qno": 4, "q": "Nuclides having the SAME atomic number Z but DIFFERENT mass numbers A (e.g., 1H, 2H, 3H) are called:", "a": "Isotopes", "b": "Isomers", "c": "Isotones", "d": "Isobars", "ans": "A", "exp": "Correct answer: Isotopes. Nucleus AZ X has Z protons and (A−Z) neutrons; isotopes (same Z), isobars (same A), isotones (same A−Z). Nuclear radius R = R0 A1/3 (R0 ≈ 1.2 fm) gives constant nuclear density (~2.3 × 1017 kg m-3) independent of A.", "tag": "NCERT"}, {"id": "II_Phy_29_5", "qno": 5, "q": "Nuclides having the SAME mass number A but DIFFERENT atomic numbers Z (e.g., 31 H and 32 He) are called:", "a": "Isotopes", "b": "Isotones", "c": "Isobars", "d": "Allotropes", "ans": "C", "exp": "Correct answer: Isobars. Nucleus AZ X has Z protons and (A−Z) neutrons; isotopes (same Z), isobars (same A), isotones (same A−Z). Nuclear radius R = R0 A1/3 (R0 ≈ 1.2 fm) gives constant nuclear density (~2.3 × 1017 kg m-3) independent of A.", "tag": "NCERT"}]}, {"chapter": "Chapter 14 - Semiconductors", "questions": [{"id": "II_Phy_30_1", "qno": 1, "q": "In the energy-band classification of solids, semiconductors are characterised by a forbidden energy gap Eg of:", "a": "Less than 3 eV (e.g., Si ≈ 1.1 eV, Ge ≈ 0.7 eV)", "b": "Zero (valence and conduction bands overlap)", "c": "Greater than 3 eV (e.g., diamond ≈ 5.4 eV)", "d": "Infinite", "ans": "A", "exp": "Less than 3 eV (e.g., Si ≈ 1.1 eV, Ge ≈ 0.7 eV). Semiconductors have band gap Eg < 3 eV (Si 1.1 eV, Ge 0.7 eV), behave as insulators at 0 K, and increase conductivity with temperature. Doping with pentavalent donors gives n-type (majority e-); trivalent acceptors give p-type (majority holes); both remain electrically n", "tag": "NCERT"}, {"id": "II_Phy_30_2", "qno": 2, "q": "At absolute zero (0 K), a pure (intrinsic) semiconductor behaves as:", "a": "A perfect insulator (valence band completely filled, conduction band completely empty)", "b": "A ferromagnet", "c": "A superconductor", "d": "A good metallic conductor", "ans": "A", "exp": "A perfect insulator (valence band completely filled, conduction band completely empty). Semiconductors have band gap Eg < 3 eV (Si 1.1 eV, Ge 0.7 eV), behave as insulators at 0 K, and increase conductivity with temperature. Doping with pentavalent donors gives n-type (majority e-); trivalent acceptors give p-type (majo", "tag": "NCERT"}, {"id": "II_Phy_30_3", "qno": 3, "q": "As temperature increases, the electrical conductivity of a semiconductor:", "a": "Remains strictly constant", "b": "Increases (and resistivity decreases, giving a negative temperature coefficient α < 0)", "c": "Drops to zero", "d": "Decreases linearly", "ans": "B", "exp": "Increases (and resistivity decreases, giving a negative temperature coefficient α < 0). Semiconductors have band gap Eg < 3 eV (Si 1.1 eV, Ge 0.7 eV), behave as insulators at 0 K, and increase conductivity with temperature. Doping with pentavalent donors gives n-type (majority e-); trivalent acceptors give p-type (majo", "tag": "NCERT"}, {"id": "II_Phy_30_4", "qno": 4, "q": "In an intrinsic (pure) semiconductor such as pure Si or Ge, the electron concentration ne and hole concentration nh satisfy:", "a": "ne >> nh", "b": "ne + nh = 0", "c": "nh >> ne", "d": "ne = nh = ni (intrinsic carrier concentration)", "ans": "D", "exp": "ne = nh = ni (intrinsic carrier concentration). Semiconductors have band gap Eg < 3 eV (Si 1.1 eV, Ge 0.7 eV), behave as insulators at 0 K, and increase conductivity with temperature. Doping with pentavalent donors gives n-type (majority e-); trivalent acceptors give p-type (majority holes); both remain electrically ne", "tag": "NCERT"}, {"id": "II_Phy_30_5", "qno": 5, "q": "An n-type extrinsic semiconductor is obtained by doping pure silicon or germanium with:", "a": "Trivalent (Group 13) acceptor impurities such as B, Al or In", "b": "Divalent impurities", "c": "Noble gases", "d": "Pentavalent (Group 15) donor impurities such as P, As or Sb", "ans": "D", "exp": "Pentavalent (Group 15) donor impurities such as P, As or Sb. Semiconductors have band gap Eg < 3 eV (Si 1.1 eV, Ge 0.7 eV), behave as insulators at 0 K, and increase conductivity with temperature. Doping with pentavalent donors gives n-type (majority e-); trivalent acceptors give p-type (majority holes); both remain el", "tag": "NCERT"}]}, {"chapter": "Unit 20 - Experimental Skills", "questions": [{"id": "II_Phy_31_1", "qno": 1, "q": "In a Vernier callipers where N divisions of the Vernier scale coincide with (N − 1) divisions of the main scale (each of value 1 MSD), the least count (LC) equals:", "a": "1 MSD / (N − 1)", "b": "(N − 1) MSD / N", "c": "N × (1 MSD)", "d": "1 MSD / N", "ans": "D", "exp": "Correct answer: 1 MSD / N.", "tag": "Booster"}, {"id": "II_Phy_31_2", "qno": 2, "q": "If the zero of the Vernier scale lies to the RIGHT of the zero of the main scale when the jaws are closed, the zero error is:", "a": "Negative, and must be added to the observed reading", "b": "Zero", "c": "Positive, and must be added to the observed reading", "d": "Positive, and must be SUBTRACTED from the observed reading", "ans": "D", "exp": "Correct answer: Positive, and must be SUBTRACTED from the observed reading.", "tag": "Booster"}, {"id": "II_Phy_31_3", "qno": 3, "q": "In a micrometer screw gauge, the least count is defined as:", "a": "Circular scale divisions / Pitch", "b": "Pitch / (Total number of divisions on the circular scale)", "c": "Pitch × (Number of circular scale divisions)", "d": "1 mm / Pitch", "ans": "B", "exp": "Correct answer: Pitch / (Total number of divisions on the circular scale).", "tag": "Booster"}, {"id": "II_Phy_31_4", "qno": 4, "q": "Backlash error in a screw gauge (due to wear/looseness of screw threads) is avoided during measurement by:", "a": "Using a larger zero error", "b": "Always rotating the thimble in the same single direction while taking readings", "c": "Doubling the pitch", "d": "Rotating the screw rapidly back and forth", "ans": "B", "exp": "Correct answer: Always rotating the thimble in the same single direction while taking readings.", "tag": "Booster"}, {"id": "II_Phy_31_5", "qno": 5, "q": "In the simple pendulum experiment to determine acceleration due to gravity g, a graph plotted between T2 (y-axis) and L (x-axis) is a straight line through the origin whose slope equals:", "a": "4π2 g", "b": "g / (4π2)", "c": "4π2 / g", "d": "2π / √g", "ans": "C", "exp": "Correct answer: 4π2 / g.", "tag": "Booster"}]}, {"chapter": "Verified PYQs (NEET & KCET)", "questions": [{"id": "II_Phy_32_1", "qno": 1, "q": "[KCET 2025] Potential at point A is −3 V and at point B is 5 V. The work done in carrying a charge of 5 mC from B to A is:", "a": "−4 J", "b": "−40 J", "c": "−0.04 J", "d": "−0.4 J", "ans": "C", "exp": "W_ext = q(V_A − V_B) = (5 × 10-3 C)(−3 − 5) V = −40 × 10-3 J = −0.04 J.", "tag": "PYQ"}, {"id": "II_Phy_32_2", "qno": 2, "q": "[KCET 2025] Given a current-carrying wire of non-uniform cross-section, which quantity is constant throughout its length?", "a": "Drift speed", "b": "Current only", "c": "Current, electric field, and drift speed", "d": "Current and drift speed", "ans": "B", "exp": "In steady state, conservation of charge keeps current I constant, whereas current density, electric field, and drift speed vary inversely with cross-sectional area.", "tag": "PYQ"}, {"id": "II_Phy_32_3", "qno": 3, "q": "[KCET 2025] A solenoid is 1 m long and 4 cm in diameter. It has five layers of windings of 1000 turns each and carries 7 A. The magnetic field at its centre is:", "a": "439.6 T", "b": "43.96 × 10-2 T", "c": "0.4396 × 10-5 T", "d": "4.396 × 10-2 T", "ans": "D", "exp": "Total turns N = 5000, n = 5000 m-1. B = μ0nI = (4π × 10-7)(5000)(7) ≈ 4.396 × 10-2 T.", "tag": "PYQ"}, {"id": "II_Phy_32_4", "qno": 4, "q": "[KCET 2025] A sinusoidal AC voltage is given by V = 311 sin(314t). The rms voltage and frequency are respectively:", "a": "200 V, 100 Hz", "b": "220 V, 100 Hz", "c": "220 V, 50 Hz", "d": "200 V, 50 Hz", "ans": "C", "exp": "V_rms = 311 / √2 ≈ 220 V and f = ω / (2π) = 314 / (2π) ≈ 50 Hz.", "tag": "PYQ"}, {"id": "II_Phy_32_5", "qno": 5, "q": "[NEET 2026 (Re-exam)] Which of the following measurements requires 'index correction'?", "a": "Measurement of focal length of lenses using optical bench", "b": "Measurement of resistance of a wire using meter bridge", "c": "Measurement of gravitational acceleration using simple pendulum", "d": "Measurement of speed of sound using resonance tube", "ans": "A", "exp": "In optical bench experiments for focal length of lenses/mirrors, index correction compensates for the difference between observed scale reading and true distance.", "tag": "PYQ"}]}], "I PUC|Chemistry": [{"chapter": "Chapter 1 - Basic Concepts", "questions": [{"id": "I _Che_33_1", "qno": 1, "q": "Which TWO life-saving drugs mentioned in Chapter 1 are used in cancer therapy, and which drug helps AIDS patients?", "a": "Penicillin and Quinine", "b": "Chloroform and DDT", "c": "Aspirin and Paracetamol (cancer); Insulin (AIDS)", "d": "Cisplatin and Taxol (cancer therapy); AZT / Azidothymidine (AIDS victims)", "ans": "D", "exp": "Cisplatin and Taxol (cancer therapy); AZT / Azidothymidine (AIDS victims). Matter is classified into pure substances (elements and compounds with fixed composition) and mixtures (homogeneous and heterogeneous). Seven SI base units are m, kg, s, A, K, mol and cd; K = °C + 273.15, °F = (9/5)°C + 32 (−40 °C = −40 °F). Pre", "tag": "NCERT"}, {"id": "I _Che_33_2", "qno": 2, "q": "Distinguish between HOMOGENEOUS MIXTURES, HETEROGENEOUS MIXTURES, ELEMENTS and recision is ", "tag": "NCERT"}, {"id": "I _Che_33_5", "qno": 5, "q": "Distinguish between PRECISION and ACCURACY in scientific measurements:", "a": "Precision is the closeness of repeated measurements to EACH OTHER; Accuracy is the agreement of a particular value to the TRUE value", "b": "Accuracy means repeated values agree even if wrong", "c": "Precision means closeness to true value only", "d": "Both mean the exact same thing", "ans": "A", "exp": "Precision is the closeness of repeated measurements to EACH OTHER; Accuracy is the agreement of a particular value to the TRUE value. Matter is classified into pure substances (elements and compounds with fixed composition) and mixtures (homogeneous and heterogeneous). Seven SI base units are m, kg, s, A, K, mol and cd", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Structure of Atom", "questions": [{"id": "I _Che_34_1", "qno": 1, "q": "Who determined the charge-to-mass ratio (e/me) of the electron, who measured the electron's charge (e) via oil-drop experiment, and who discovered the neutron?", "a": "J.J. Thomson (e/me = 1.7588 × 1011 C kg-1); R.A. Millikan (e = −1.602 × 10-19 C, giving me = 9.109 × 10-31 kg); James Chadwick (1932, neutron via α-bombardment ", "b": "Rutherford discovered neutron; Bohr did oil drop", "c": "Chadwick measured e/me", "d": "Dalton discovered electron", "ans": "A", "exp": "J.J. Thomson (e/me = 1.7588 × 1011 C kg-1); R.A. Millikan (e = −1.602 × 10-19 C, giving me = 9.109 × 10-31 kg); James Chadwick (1932, neutron via α-bombardment of Be). J.J. Thomson found e/me = 1.7588 × 1011 C kg-1, Millikan's oil-drop gave e = −1.602 × 10-19 C (me = 9.109 × 10-31 kg), and Chadwick (1932) discovered th", "tag": "NCERT"}, {"id": "I _Che_34_2", "qno": 2, "q": "Compare the radii of an ATOM vs its NUCLEUS from Rutherford's α-particle scattering experiment:", "a": "Both are 10-10 m", "b": "Nucleus is half the atom's radius", "c": "Radius of atom ≈ 10-10 m; Radius of nucleus ≈ 10-15 m (nucleus is ~105 times smalle
