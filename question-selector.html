 in dry ether), what type of alkane is best synthesised?", "a": "Symmetrical alkanes with an EVEN number of carbon atoms (methane CANNOT be prepared)", "b": "Alkenes only", "c": "Methane only", "d": "Unsymmetrical odd-carbon alkanes in pure yield", "ans": "A", "exp": "Symmetrical alkanes with an EVEN number of carbon atoms (methane CANNOT be prepared). Alkanes (CnH2n+2, sp3, paraffins) are prepared by hydrogenation (Sabatier–Senderens), R–X reduction (Zn/HCl), Wurtz reaction (2R–X + 2Na/dry ether → symmetrical even-C alkane), soda-lime decarboxylation (NaOH+CaO → 1 C less) and Kolbe", "tag": "NCERT"}, {"id": "I _Che_41_3", "qno": 3, "q": "Heating sodium ethanoate (CH3COONa) with SODA LIME (NaOH + CaO) gives methane (CH4) + Na2CO3. What is this reaction called?", "a": "Aromatisation", "b": "Wurtz reaction", "c": "Decarboxylation (yields an alkane with ONE carbon atom LESS than the parent carboxylic acid salt)", "d": "Kolbe's electrolysis", "ans": "C", "exp": "Decarboxylation (yields an alkane with ONE carbon atom LESS than the parent carboxylic acid salt). Alkanes (CnH2n+2, sp3, paraffins) are prepared by hydrogenation (Sabatier–Senderens), R–X reduction (Zn/HCl), Wurtz reaction (2R–X + 2Na/dry ether → symmetrical even-C alkane), soda-lime decarboxylation (NaOH+CaO → 1 C le", "tag": "NCERT"}, {"id": "I _Che_41_4", "qno": 4, "q": "In KOLBE'S ELECTROLYTIC METHOD, electrolysis of aqueous sodium acetate (2CH3COONa + 2H2O) produces which gases at the ANODE and CATHODE respectively?", "a": "H2 at anode; Ethane at cathode", "b": "CO2 at cathode; Na at anode", "c": "Methane at anode; O2 at cathode", "d": "Ethane (C2H6) + CO2 at the ANODE; H2 gas (+ NaOH) at the CATHODE (methane cannot be made)", "ans": "D", "exp": "Ethane (C2H6) + CO2 at the ANODE; H2 gas (+ NaOH) at the CATHODE (methane cannot be made). Alkanes (CnH2n+2, sp3, paraffins) are prepared by hydrogenation (Sabatier–Senderens), R–X reduction (Zn/HCl), Wurtz reaction (2R–X + 2Na/dry ether → symmetrical even-C alkane), soda-lime decarboxylation (NaOH+CaO → 1 C less) and ", "tag": "NCERT"}, {"id": "I _Che_41_5", "qno": 5, "q": "Why does n-pentane (309.1 K) have a HIGHER boiling point than isopentane (300.9 K) and neopentane (282.5 K)?", "a": "Neopentane has lower molecular mass", "b": "n-Pentane has hydrogen bonding", "c": "Branching makes the molecule more spherical, reducing surface area and weakening intermolecular van der Waals forces", "d": "Branching increases dipole moment", "ans": "C", "exp": "Branching makes the molecule more spherical, reducing surface area and weakening intermolecular van der Waals forces. Alkanes (CnH2n+2, sp3, paraffins) are prepared by hydrogenation (Sabatier–Senderens), R–X reduction (Zn/HCl), Wurtz reaction (2R–X + 2Na/dry ether → symmetrical even-C alkane), soda-lime decarboxylation", "tag": "NCERT"}]}, {"chapter": "Verified PYQs (NEET & KCET)", "questions": [{"id": "I _Che_42_1", "qno": 1, "q": "[NEET 2026 (Re-exam)] The numbers 17.0145 and 21.0235 were rounded to three figures after the decimal point. The resulting numbers, respectively, are:", "a": "17.015 and 21.024", "b": "17.014 and 21.024", "c": "17.014 and 21.023", "d": "17.015 and 21.023", "ans": "B", "exp": "By NCERT round-to-even rules for trailing 5: 4 is even so 17.0145 rounds to 17.014, while 3 is odd so 21.0235 rounds up to 21.024.", "tag": "PYQ"}, {"id": "I _Che_42_2", "qno": 2, "q": "[NEET 2025] Among the following, choose the ones with equal number of atoms:\nA. 212 g of Na2CO3(s) [molar mass = 106 g]\nB. 248 g of Na2O(s) [molar mass = 62 g]\nC. 240 g of NaOH(s) [molar mass = 40 g]\nD. 12 g of H2(g) [molar mass = 2 g]\nE. 220 g of CO2(g) [molar mass = 44 g]\nChoose the correct option:", "a": "B, C, and D only", "b": "A, B, and D only", "c": "B, D, and E only", "d": "A, B, and C only", "ans": "B", "exp": "Atoms = moles × atomicity × Na: A = 2×6 Na = 12 Na, B = 4×3 Na = 12 Na, C = 6×3 Na = 18 Na, D = 6×2 Na = 12 Na, E = 5×3 Na = 15 Na. Thus A, B, and D match.", "tag": "PYQ"}, {"id": "I _Che_42_3", "qno": 3, "q": "[NEET 2024] 1 g of sodium hydroxide was treated with 25 mL of 0.75 M HCl solution. The mass of sodium hydroxide left unreacted is equal to:", "a": "250 mg", "b": "Zero mg", "c": "750 mg", "d": "200 mg", "ans": "A", "exp": "Moles of HCl = 0.75 × 0.025 = 0.01875 mol, which neutralizes 0.01875 × 40 = 0.750 g NaOH. Unreacted NaOH = 1.000 − 0.750 = 0.250 g = 250 mg.", "tag": "PYQ"}, {"id": "I _Che_42_4", "qno": 4, "q": "[NEET 2022] What mass of 95% pure CaCO3 will be required to neutralise 50 mL of 0.5 M HCl solution according to CaCO3(s) + 2HCl(aq) → CaCl2(aq) + CO2(g) + H2O(l)?", "a": "1.25 g", "b": "3.65 g", "c": "1.32 g", "d": "9.50 g", "ans": "C", "exp": "Moles of HCl = 0.050 × 0.5 = 0.025 mol → pure CaCO3 needed = 0.0125 mol = 1.25 g. Mass of 95% pure sample = 1.25 / 0.95 ≈ 1.32 g.", "tag": "PYQ"}, {"id": "I _Che_42_5", "qno": 5, "q": "[NEET 2021] An organic compound contains 78% (by wt.) carbon and the remaining percentage of hydrogen. The empirical formula of this compound is (Atomic wt.: C = 12, H = 1):", "a": "CH2", "b": "CH4", "c": "CH", "d": "CH3", "ans": "D", "exp": "Mole ratio C : H = (78/12) : (22/1) = 6.5 : 22 ≈ 1 : 3.38 ≈ 1 : 3, giving empirical formula CH3.", "tag": "PYQ"}]}, {"chapter": "NEET High-Order Booster", "questions": [{"id": "I _Che_43_1", "qno": 1, "q": "Given below are two statements:\nStatement I: Molality and mole fraction are independent of temperature.\nStatement II: Molarity decreases with increase in temperature because solution volume expands.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Both Statement I and Statement II are correct", "c": "Both Statement I and Statement II are incorrect", "d": "Statement I is incorrect but Statement II is correct", "ans": "B", "exp": "Mass-based units (molality, mole fraction) are temperature-independent, while volume-based molarity varies with temperature.", "tag": "Booster"}, {"id": "I _Che_43_2", "qno": 2, "q": "Given below are two statements:\nStatement I: For a 3p orbital, the number of radial nodes is 1 and angular nodes is 1.\nStatement II: The total number of nodes in any orbital with principal quantum number n is n.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Both Statement I and Statement II are correct", "c": "Both Statement I and Statement II are incorrect", "d": "Statement I is incorrect but Statement II is correct", "ans": "A", "exp": "For 3p (n=3, l=1): radial = n−l−1 = 1, angular = l = 1 (True); total nodes = n − 1, not n (False).", "tag": "Booster"}, {"id": "I _Che_43_3", "qno": 3, "q": "Given below are two statements:\nStatement I: The energy of an electron in a hydrogen atom depends only on the principal quantum number n.\nStatement II: In multi-electron atoms, orbital energy depends on both n and l (following the n + l rule).\nChoose the correct option:", "a": "Both Statement I and Statement II are incorrect", "b": "Statement I is incorrect but Statement II is correct", "c": "Both Statement I and Statement II are correct", "d": "Statement I is correct but Statement II is incorrect", "ans": "C", "exp": "Hydrogen subshells of the same n are degenerate; electron-electron repulsion lifts degeneracy in multi-electron atoms.", "tag": "Booster"}, {"id": "I _Che_43_4", "qno": 4, "q": "Given below are two statements:\nStatement I: Chlorine has a more negative electron gain enthalpy than fluorine.\nStatement II: Oxygen has a more negative electron gain enthalpy than sulphur.\nChoose the correct option:", "a": "Both Statement I and Statement II are correct", "b": "Statement I is correct but Statement II is incorrect", "c": "Statement I is incorrect but Statement II is correct", "d": "Both Statement I and Statement II are incorrect", "ans": "B", "exp": "Due to compact 2p inter-electronic repulsion, both Cl > F and S > O in magnitude of negative electron gain enthalpy.", "tag": "Booster"}, {"id": "I _Che_43_5", "qno": 5, "q": "Given below are two statements:\nStatement I: First ionisation enthalpy of nitrogen is greater than that of oxygen.\nStatement II: Nitrogen has a stable half-filled 2p3 configuration.\nChoose the correct option:", "a": "Both Statement I and Statement II are correct", "b": "Statement I is incorrect but Statement II is correct", "c": "Statement I is correct but Statement II is incorrect", "d": "Both Statement I and Statement II are incorrect", "ans": "A", "exp": "Half-filled 2p3 stability in N (and paired-electron repulsion in O 2p4) makes IE1(N) > IE1(O).", "tag": "Booster"}]}], "II PUC|Chemistry": [{"chapter": "Chapter 1 - Solutions", "questions": [{"id": "II_Che_44_1", "qno": 1, "q": "What is the composition of BRASS, BRONZE and GERMAN SILVER alloys respectively?", "a": "Brass: Cu + Zn; Bronze: Cu + Sn; German silver: Cu + Zn + Ni", "b": "Brass: Cu + Sn; Bronze: Cu + Zn; German silver: Ag + Cu", "c": "Brass: Fe + C; Bronze: Al + Mg; German silver: Ag + Zn", "d": "Brass: Cu + Ni; Bronze: Zn + Sn; German silver: Ag + Pb", "ans": "A", "exp": "Brass: Cu + Zn; Bronze: Cu + Sn; German silver: Cu + Zn + Ni. A solution is a homogeneous mixture of two or more chemically non-reacting components (solvent in largest quantity determines physical state). Nine binary solution types span gaseous, liquid and solid solutions (e.g., camphor in N2, chloroform in N2, H2 in P", "tag": "NCERT"}, {"id": "II_Che_44_2", "qno": 2, "q": "What fluoride ion (F-) concentration in water prevents tooth decay, vs what concentration causes mottling of teeth?", "a": "10 ppm prevents decay; 0.1 ppm causes mottling", "b": "0.01 ppm prevents decay; 0.05 ppm causes mottling", "c": "100 ppm prevents decay; 1 ppm causes mottling", "d": "1 ppm prevents tooth decay; 1.5 ppm causes teeth to become mottled (higher concentrations are poisonous, e.g. sodium fluoride as rat poison)", "ans": "D", "exp": "1 ppm prevents tooth decay; 1.5 ppm causes teeth to become mottled (higher concentrations are poisonous, e.g. sodium fluoride as rat poison). A solution is a homogeneous mixture of two or more chemically non-reacting components (solvent in largest quantity determines physical state). Nine binary solution types span gas", "tag": "NCERT"}, {"id": "II_Che_44_3", "qno": 3, "q": "Which physical state of a binary solution is determined by the component present in the LARGEST quantity (solvent)?", "a": "The molar mass of the solute", "b": "The physical state in which the solution exists", "c": "Only the colour of the solute", "d": "Only the boiling point of the solute", "ans": "B", "exp": "The physical state in which the solution exists. A solution is a homogeneous mixture of two or more chemically non-reacting components (solvent in largest quantity determines physical state). Nine binary solution types span gaseous, liquid and solid solutions (e.g., camphor in N2, chloroform in N2, H2 in Pd, Hg–Na amal", "tag": "NCERT"}, {"id": "II_Che_44_4", "qno": 4, "q": "Camphor in nitrogen gas (N2) is a textbook example of which type of solution?", "a": "Solid in gas (gaseous solution)", "b": "Solid in liquid (liquid solution)", "c": "Liquid in gas (gaseous solution)", "d": "Gas in solid (solid solution)", "ans": "A", "exp": "Solid in gas (gaseous solution). A solution is a homogeneous mixture of two or more chemically non-reacting components (solvent in largest quantity determines physical state). Nine binary solution types span gaseous, liquid and solid solutions (e.g., camphor in N2, chloroform in N2, H2 in Pd, Hg–Na amalgam, brass Cu–Zn", "tag": "NCERT"}, {"id": "II_Che_44_5", "qno": 5, "q": "Chloroform (CHCl3) mixed with nitrogen gas (N2) is an example of which type of solution?", "a": "Gas in liquid (liquid solution)", "b": "Solid in gas (gaseous solution)", "c": "Liquid in gas (gaseous solution)", "d": "Liquid in solid (solid solution)", "ans": "C", "exp": "Liquid in gas (gaseous solution). A solution is a homogeneous mixture of two or more chemically non-reacting components (solvent in largest quantity determines physical state). Nine binary solution types span gaseous, liquid and solid solutions (e.g., camphor in N2, chloroform in N2, H2 in Pd, Hg–Na amalgam, brass Cu–Z", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Electrochemistry", "questions": [{"id": "II_Che_45_1", "qno": 1, "q": "What is the overall redox reaction and standard cell potential (E°cell) of a DANIELL CELL (Zn2+ = 1 M, Cu2+ = 1 M)?", "a": "Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s);  E°cell = 1.1 V", "b": "Cu(s) + Zn2+(aq) → Cu2+(aq) + Zn(s);  E°cell = 1.1 V", "c": "Zn(s) + 2H+(aq) → Zn2+(aq) + H2(g);  E°cell = 0.0 V", "d": "2H2(g) + O2(g) → 2H2O(l);  E°cell = 1.5 V", "ans": "A", "exp": "Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s); E°cell = 1.1 V. A galvanic (voltaic) cell converts chemical energy of a spontaneous redox reaction into electrical energy — e.g., Daniell cell: Zn(s) | Zn2+(1 M) || Cu2+(1 M) | Cu(s) with Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s) and E°cell = 1.1 V (Eext < 1.1 V: galvanic, e- Zn → Cu; Eex", "tag": "NCERT"}, {"id": "II_Che_45_2", "qno": 2, "q": "What is the standard IUPAC cell representation of a Daniell cell?", "a": "Cu(s) | Cu2+(aq, 1 M) || Zn2+(aq, 1 M) | Zn(s)", "b": "Zn(s) | Zn2+(aq, 1 M) || Cu2+(aq, 1 M) | Cu(s)", "c": "Zn(s) || Cu(s)", "d": "Zn2+(aq) | Zn(s) || Cu(s) | Cu2+(aq)", "ans": "B", "exp": "Zn(s) | Zn2+(aq, 1 M) || Cu2+(aq, 1 M) | Cu(s). A galvanic (voltaic) cell converts chemical energy of a spontaneous redox reaction into electrical energy — e.g., Daniell cell: Zn(s) | Zn2+(1 M) || Cu2+(1 M) | Cu(s) with Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s) and E°cell = 1.1 V (Eext < 1.1 V: galvanic, e- Zn → Cu; Eext = 1", "tag": "NCERT"}, {"id": "II_Che_45_3", "qno": 3, "q": "In a Daniell cell, what happens when an opposing external potential Eext > 1.1 V is applied?", "a": "No current flows and reaction stops", "b": "It functions as an ELECTROLYTIC CELL: electrons flow from Cu to Zn, current flows from Zn to Cu, Cu dissolves at copper electrode and Zn deposits at zinc electr", "c": "Electrons continue flowing from Zn to Cu", "d": "Zn dissolves twice as fast", "ans": "B", "exp": "It functions as an ELECTROLYTIC CELL: electrons flow from Cu to Zn, current flows from Zn to Cu, Cu dissolves at copper electrode and Zn deposits at zinc electrode. A galvanic (voltaic) cell converts chemical energy of a spontaneous redox reaction into electrical energy — e.g., Daniell cell: Zn(s) | Zn2+(1 M) || Cu2+(1", "tag": "NCERT"}, {"id": "II_Che_45_4", "qno": 4, "q": "In a Daniell cell, what happens when the opposing external potential is exactly Eext = 1.1 V?", "a": "It acts as an electrolytic cell", "b": "Copper dissolves rapidly", "c": "It acts as a galvanic cell", "d": "The reaction stops altogether; no current or electron flow occurs", "ans": "D", "exp": "The reaction stops altogether; no current or electron flow occurs. A galvanic (voltaic) cell converts chemical energy of a spontaneous redox reaction into electrical energy — e.g., Daniell cell: Zn(s) | Zn2+(1 M) || Cu2+(1 M) | Cu(s) with Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s) and E°cell = 1.1 V (Eext < 1.1 V: galvanic, e", "tag": "NCERT"}, {"id": "II_Che_45_5", "qno": 5, "q": "In a galvanic cell, which electrode is placed on the LEFT, what reaction occurs there, and what is its polarity?", "a": "Cathode (left); REDUCTION occurs; POSITIVE polarity", "b": "Anode (left); REDUCTION occurs; POSITIVE polarity", "c": "Cathode (right); OXIDATION occurs; NEGATIVE polarity", "d": "Anode (left); OXIDATION occurs; NEGATIVE polarity", "ans": "D", "exp": "Anode (left); OXIDATION occurs; NEGATIVE polarity. A galvanic (voltaic) cell converts chemical energy of a spontaneous redox reaction into electrical energy — e.g., Daniell cell: Zn(s) | Zn2+(1 M) || Cu2+(1 M) | Cu(s) with Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s) and E°cell = 1.1 V (Eext < 1.1 V: galvanic, e- Zn → Cu; Eext ", "tag": "NCERT"}]}, {"chapter": "Chapter 3 - Chemical Kinetics", "questions": [{"id": "II_Che_46_1", "qno": 1, "q": "For a general reaction aA + bB → cC + dD, write the exact expression for the RATE OF REACTION in terms of concentrations:", "a": "Rate = [A]a[B]b / t", "b": "Rate = −(1/a)(d[A]/dt) = −(1/b)(d[B]/dt) = +(1/c)(d[C]/dt) = +(1/d)(d[D]/dt)", "c": "Rate = −a(d[A]/dt) = +c(d[C]/dt)", "d": "Rate = +(1/a)(d[A]/dt) = −(1/c)(d[C]/dt)", "ans": "B", "exp": "Rate = −(1/a)(d[A]/dt) = −(1/b)(d[B]/dt) = +(1/c)(d[C]/dt) = +(1/d)(d[D]/dt). Rate of reaction measures the change in concentration of a reactant or product per unit time: for aA + bB → cC + dD, Rate = −(1/a)d[A]/dt = −(1/b)d[B]/dt = +(1/c)d[C]/dt = +(1/d)d[D]/dt (units: mol L-1 s-1 or atm s-1). Rate law is an experime", "tag": "NCERT"}, {"id": "II_Che_46_2", "qno": 2, "q": "What is the SI / standard unit of RATE OF REACTION for solutions and gaseous reactions respectively?", "a": "mol L-1 s-1 for solutions; atm s-1 (or bar s-1) for gaseous reactions", "b": "L mol-1 s-1 always", "c": "s-1 for all orders", "d": "mol kg-1 s-1", "ans": "A", "exp": "mol L-1 s-1 for solutions; atm s-1 (or bar s-1) for gaseous reactions. Rate of reaction measures the change in concentration of a reactant or product per unit time: for aA + bB → cC + dD, Rate = −(1/a)d[A]/dt = −(1/b)d[B]/dt = +(1/c)d[C]/dt = +(1/d)d[D]/dt (units: mol L-1 s-1 or atm s-1). Rate law is an experimentally ", "tag": "NCERT"}, {"id": "II_Che_46_3", "qno": 3, "q": "For the reaction 2N2O5(g) → 4NO2(g) + O2(g), write the rate of reaction in terms of each species:", "a": "Rate = −½(d[N2O5]/dt) = +¼(d[NO2]/dt) = +(d[O2]/dt)", "b": "Rate = −(d[N2O5]/dt) = +(d[NO2]/dt)", "c": "Rate = +½(d[N2O5]/dt) = −¼(d[NO2]/dt)", "d": "Rate = −2(d[N2O5]/dt) = +4(d[NO2]/dt)", "ans": "A", "exp": "Rate = −½(d[N2O5]/dt) = +¼(d[NO2]/dt) = +(d[O2]/dt). Rate of reaction measures the change in concentration of a reactant or product per unit time: for aA + bB → cC + dD, Rate = −(1/a)d[A]/dt = −(1/b)d[B]/dt = +(1/c)d[C]/dt = +(1/d)d[D]/dt (units: mol L-1 s-1 or atm s-1). Rate law is an experimentally determined express", "tag": "NCERT"}, {"id": "II_Che_46_4", "qno": 4, "q": "For the reaction 5Br-(aq) + BrO3-(aq) + 6H+(aq) → 3Br2(aq) + 3H2O(l), how is the rate of disappearance of Br- related to the rate of appearance of Br2?", "a": "−d[Br-]/dt = (3/5)(d[Br2]/dt)", "b": "−d[Br-]/dt = 15(d[Br2]/dt)", "c": "−(1/5)(d[Br-]/dt) = +(1/3)(d[Br2]/dt), so −d[Br-]/dt = (5/3)(d[Br2]/dt)", "d": "−d[Br-]/dt = d[Br2]/dt", "ans": "C", "exp": "−(1/5)(d[Br-]/dt) = +(1/3)(d[Br2]/dt), so −d[Br-]/dt = (5/3)(d[Br2]/dt). Rate of reaction measures the change in concentration of a reactant or product per unit time: for aA + bB → cC + dD, Rate = −(1/a)d[A]/dt = −(1/b)d[B]/dt = +(1/c)d[C]/dt = +(1/d)d[D]/dt (units: mol L-1 s-1 or atm s-1). Rate law is an experimentall", "tag": "NCERT"}, {"id": "II_Che_46_5", "qno": 5, "q": "For the reaction Hg(l) + Cl2(g) → HgCl2(s), write the average rate of reaction:", "a": "rav = −Δ[HgCl2]/Δt", "b": "rav = +Δ[Cl2]/Δt", "c": "rav = −2Δ[Hg]/Δt", "d": "rav = −Δ[Hg]/Δt = −Δ[Cl2]/Δt = +Δ[HgCl2]/Δt", "ans": "D", "exp": "rav = −Δ[Hg]/Δt = −Δ[Cl2]/Δt = +Δ[HgCl2]/Δt. Rate of reaction measures the change in concentration of a reactant or product per unit time: for aA + bB → cC + dD, Rate = −(1/a)d[A]/dt = −(1/b)d[B]/dt = +(1/c)d[C]/dt = +(1/d)d[D]/dt (units: mol L-1 s-1 or atm s-1). Rate law is an experimentally determined expression Rate", "tag": "NCERT"}]}, {"chapter": "Chapter 4 - d and f Block", "questions": [{"id": "II_Che_47_1", "qno": 1, "q": "How is a TRANSITION ELEMENT strictly defined by IUPAC, and why are Zn, Cd and Hg NOT regarded as transition elements?", "a": "Zn, Cd and Hg have empty d0 orbitals", "b": "Any element in Groups 1–18; Zn is a noble gas", "c": "An element with INCOMPLETELY FILLED d orbitals in its ground state or any common oxidation state; Zn, Cd and Hg have full d10 configuration in both ground state", "d": "Only elements with f orbitals", "ans": "C", "exp": "An element with INCOMPLETELY FILLED d orbitals in its ground state or any common oxidation state; Zn, Cd and Hg have full d10 configuration in both ground state and common +2 oxidation state. Transition elements (d-block, Groups 3–12) have incompletely filled d-orbitals in their ground state or any common oxidation sta", "tag": "NCERT"}, {"id": "II_Che_47_2", "qno": 2, "q": "Silver (Ag, Z = 47) has completely filled 4d10 orbitals in its ground state, yet it IS a transition element. Why?", "a": "Because silver is a liquid at room temperature", "b": "Because silver is a coinage metal", "c": "Because silver has 5f electrons", "d": "In its +2 oxidation state (e.g. AgF2), silver has an incompletely filled 4d9 configuration", "ans": "D", "exp": "In its +2 oxidation state (e.g. AgF2), silver has an incompletely filled 4d9 configuration. Transition elements (d-block, Groups 3–12) have incompletely filled d-orbitals in their ground state or any common oxidation state; Zn, Cd, Hg (d10) are d-block but NOT transition elements. General outer configuration is (n−1)d1", "tag": "NCERT"}, {"id": "II_Che_47_3", "qno": 3, "q": "What are the TWO elements in the 3d transition series that show exceptional ground-state electronic configurations due to half-filled / completely filled d-orbital stability?", "a": "Chromium (Cr, Z = 24: [Ar] 3d5 4s1) and Copper (Cu, Z = 29: [Ar] 3d10 4s1)", "b": "Scandium (Sc) and Zinc (Zn)", "c": "Iron (Fe) and Cobalt (Co)", "d": "Manganese (Mn) and Nickel (Ni)", "ans": "A", "exp": "'Chromium (Cr, Z = 24: [Ar] 3d5 4s1) and Copper (Cu, Z = 29: [Ar] 3d10 4s1)' is the incorrect/exception choice; the other three options are accurate. Transition elements (d-block, Groups 3–12) have incompletely filled d-orbitals in their ground state or any common oxidation state; Zn, Cd, Hg (d10) are d-block but NOT t", "tag": "NCERT"}, {"id": "II_Che_47_4", "qno": 4, "q": "Which element in the 3d transition series has the HIGHEST melting point and which Group-6 metal has the highest melting point in the entire d-block?", "a": "Cr (highest in 3d series); Tungsten W (highest in d-block, 3,695 K), while Mn and Tc show anomalously low dips in melting point", "b": "Zn has the highest melting point", "c": "Sc has the highest melting point", "d": "Hg has the highest melting point", "ans": "A", "exp": "Cr (highest in 3d series); Tungsten W (highest in d-block, 3,695 K), while Mn and Tc show anomalously low dips in melting point. Transition elements (d-block, Groups 3–12) have incompletely filled d-orbitals in their ground state or any common oxidation state; Zn, Cd, Hg (d10) are d-block but NOT transition elements. G", "tag": "NCERT"}, {"id": "II_Che_47_5", "qno": 5, "q": "Why do transition metals exhibit VERY HIGH enthalpies of atomisation, whereas Zn, Cd and Hg have the lowest?", "a": "Transition metals have ionic bonds", "b": "Presence of a large number of unpaired (n−1)d and ns electrons creates strong interatomic metallic bonding; Zn, Cd and Hg have no unpaired d-electrons", "c": "Zn has 5 unpaired electrons", "d": "Transition metals are gases", "ans": "B", "exp": "Presence of a large number of unpaired (n−1)d and ns electrons creates strong interatomic metallic bonding; Zn, Cd and Hg have no unpaired d-electrons. Transition elements (d-block, Groups 3–12) have incompletely filled d-orbitals in their ground state or any common oxidation state; Zn, Cd, Hg (d10) are d-block but NOT", "tag": "NCERT"}]}, {"chapter": "Chapter 5 - Coordination Comp", "questions": [{"id": "II_Che_48_1", "qno": 1, "q": "According to Werner's theory of coordination compounds, what are the TWO types of valencies exhibited by metals?", "a": "Secondary valency equals atomic mass", "b": "Primary valency is non-ionisable and directional", "c": "Only ionic valency and nuclear valency", "d": "Primary valency (ionisable, satisfied by negative ions, corresponds to oxidation state) and Secondary valency (non-ionisable, satisfied by neutral molecules or ", "ans": "D", "exp": "Primary valency (ionisable, satisfied by negative ions, corresponds to oxidation state) and Secondary valency (non-ionisable, satisfied by neutral molecules or negative ions, corresponds to coordination number). Werner's theory distinguishes primary valency (ionisable, oxidation state, satisfied by anions) from seconda", "tag": "NCERT"}, {"id": "II_Che_48_2", "qno": 2, "q": "How many moles of AgCl are precipitated when excess AgNO3 solution is added to 1 mole of [Co(NH3)5Cl]Cl2?", "a": "0 moles of AgCl", "b": "1 mole of AgCl", "c": "2 moles of AgCl (two ionisable Cl- ions outside the coordination sphere)", "d": "3 moles of AgCl", "ans": "C", "exp": "2 moles of AgCl (two ionisable Cl- ions outside the coordination sphere). Werner's theory distinguishes primary valency (ionisable, oxidation state, satisfied by anions) from secondary valency (non-ionisable, directional, coordination number fixing geometry). Double salts (Mohr's salt, carnallite, potash alum) dissocia", "tag": "NCERT"}, {"id": "II_Che_48_3", "qno": 3, "q": "How many moles of AgCl precipitate when excess AgNO3 is treated with 1 mole of CoCl3·4NH3 (green/violet, [Co(NH3)4Cl2]Cl)?", "a": "3 moles of AgCl", "b": "2 moles of AgCl", "c": "1 mole of AgCl (1:1 electrolyte, giving 2 ions in solution)", "d": "0 moles of AgCl", "ans": "C", "exp": "1 mole of AgCl (1:1 electrolyte, giving 2 ions in solution). Werner's theory distinguishes primary valency (ionisable, oxidation state, satisfied by anions) from secondary valency (non-ionisable, directional, coordination number fixing geometry). Double salts (Mohr's salt, carnallite, potash alum) dissociate completely", "tag": "NCERT"}, {"id": "II_Che_48_4", "qno": 4, "q": "How does a COORDINATION COMPOUND (e.g. K4[Fe(CN)6]) differ from a DOUBLE SALT (e.g. Mohr's salt FeSO4·(NH4)2SO4·6H2O or carnallite KCl·MgCl2·6H2O)?", "a": "Both give a positive test for free Fe2+ ions", "b": "Double salts dissociate completely into simple ions in water, whereas coordination compounds retain their complex ion identity ([Fe(CN)6]4-) in solution", "c": "Double salts never dissolve in water", "d": "Coordination compounds dissociate completely into simple ions", "ans": "B", "exp": "Double salts dissociate completely into simple ions in water, whereas coordination compounds retain their complex ion identity ([Fe(CN)6]4-) in solution. Werner's theory distinguishes primary valency (ionisable, oxidation state, satisfied by anions) from secondary valency (non-ionisable, directional, coordination numbe", "tag": "NCERT"}, {"id": "II_Che_48_5", "qno": 5, "q": "What is the DENTATE nature (denticity) of the ethylenediaminetetraacetate ion (EDTA4-)?", "a": "Unidentate ligand", "b": "Tridentate ligand", "c": "Hexadentate ligand (binds through two nitrogen atoms and four carboxylate oxygen atoms)", "d": "Bidentate ligand", "ans": "C", "exp": "Hexadentate ligand (binds through two nitrogen atoms and four carboxylate oxygen atoms). Werner's theory distinguishes primary valency (ionisable, oxidation state, satisfied by anions) from secondary valency (non-ionisable, directional, coordination number fixing geometry). Double salts (Mohr's salt, carnallite, potash", "tag": "NCERT"}]}, {"chapter": "Chapter 6 - Haloalkanes", "questions": [{"id": "II_Che_49_1", "qno": 1, "q": "How are ALLYLIC HALIDES and BENZYLIC HALIDES defined in terms of the carbon atom bonded to the halogen?", "a": "Halogen is bonded directly to an sp2 carbon of C=C or benzene ring", "b": "Halogen is bonded to an sp3-hybridised carbon atom located next to a C=C double bond (allylic) or next to an aromatic benzene ring (benzylic)", "c": "Halogen is bonded to an sp carbon of an alkyne", "d": "Two halogens on the same carbon", "ans": "B", "exp": "Halogen is bonded to an sp3-hybridised carbon atom located next to a C=C double bond (allylic) or next to an aromatic benzene ring (benzylic). Haloalkanes and haloarenes are classified by carbon hybridisation: sp3 C–X (alkyl, allylic, benzylic) vs sp2 C–X (vinylic, aryl), and geminal (same carbon) vs vicinal (adjacent ", "tag": "NCERT"}, {"id": "II_Che_49_2", "qno": 2, "q": "How are VINYLIC HALIDES and ARYL HALIDES defined?", "a": "Halogen is bonded to an sp3 carbon adjacent to a double bond", "b": "Halogen is bonded to a primary alkyl carbon", "c": "Halogen is bonded directly to an sp2-hybridised carbon atom of a C=C double bond (vinylic) or of an aromatic ring (aryl)", "d": "Halogen is bonded to an sp carbon", "ans": "C", "exp": "Halogen is bonded directly to an sp2-hybridised carbon atom of a C=C double bond (vinylic) or of an aromatic ring (aryl). Haloalkanes and haloarenes are classified by carbon hybridisation: sp3 C–X (alkyl, allylic, benzylic) vs sp2 C–X (vinylic, aryl), and geminal (same carbon) vs vicinal (adjacent carbons) dihalides. C", "tag": "NCERT"}, {"id": "II_Che_49_3", "qno": 3, "q": "Distinguish between GEMINAL (gem-) DIHALIDES and VICINAL (vic-) DIHALIDES:", "a": "Gem-dihalides have halogens on adjacent carbons", "b": "Both contain three halogen atoms", "c": "Vic-dihalides have both halogens on the same carbon", "d": "Gem-dihalides (alkylidene halides, e.g. CH3CHCl2) have both halogen atoms on the SAME carbon; vic-dihalides (alkylene dihalides, e.g. ClCH2CH2Cl) have halogens ", "ans": "D", "exp": "Gem-dihalides (alkylidene halides, e.g. CH3CHCl2) have both halogen atoms on the SAME carbon; vic-dihalides (alkylene dihalides, e.g. ClCH2CH2Cl) have halogens on ADJACENT carbons. Haloalkanes and haloarenes are classified by carbon hybridisation: sp3 C–X (alkyl, allylic, benzylic) vs sp2 C–X (vinylic, aryl), and gemin", "tag": "NCERT"}, {"id": "II_Che_49_4", "qno": 4, "q": "What is the order of C—X bond length and bond enthalpy from CH3—F to CH3—I?", "a": "All four have identical bond lengths", "b": "Bond length increases (C–F 139 pm < C–Cl 178 pm < C–Br 193 pm < C–I 214 pm); bond enthalpy decreases (C–F 452 > C–Cl 351 > C–Br 293 > C–I 234 kJ mol-1)", "c": "Bond length decreases and bond enthalpy increases from F to I", "d": "C–I has the highest bond enthalpy", "ans": "B", "exp": "Bond length inc e 2° carbocation). Bond angles and C–O lengths: methanol (108.9°, 142 pm), phenol (109°, 136 pm — shorter due to sp2 C & resonance), methoxymethane (111.7°, 141 pm). Alcohols are prepared by acid-catalysed alkene hydration (Markovnikov), hydroboration–oxi", "tag": "NCERT"}, {"id": "II_Che_50_5", "qno": 5, "q": "What is the major product of HYDROBORATION–OXIDATION of propene ((1) B2H6/THF, (2) H2O2/OH-)?", "a": "Propan-1-ol (CH3–CH2–CH2OH — apparent anti-Markovnikov hydration with excellent yield)", "b": "Propanoic acid", "c": "Propan-2-ol", "d": "Propanone", "ans": "A", "exp": "Propan-1-ol (CH3–CH2–CH2OH — apparent anti-Markovnikov hydration with excellent yield). Bond angles and C–O lengths: methanol (108.9°, 142 pm), phenol (109°, 136 pm — shorter due to sp2 C & resonance), methoxymethane (111.7°, 141 pm). Alcohols are prepared by acid-catalysed alkene hydration (Markovnikov), hydroboration", "tag": "NCERT"}]}, {"chapter": "Chapter 8 - Aldehydes Ketones", "questions": [{"id": "II_Che_51_1", "qno": 1, "q": "What are the hybridisation, geometry, bond angle and polarity of the carbonyl carbon (C=O) in aldehydes and ketones?", "a": "sp2-hybridised, trigonal planar (~120°), 3 σ bonds + 1 π bond; polarised with electrophilic δ+ carbon (Lewis acid) and nucleophilic δ- oxygen (Lewis base)", "b": "sp3 tetrahedral (109.5°) and completely non-polar", "c": "Carbon is δ- and oxygen is δ+", "d": "sp linear (180°)", "ans": "A", "exp": "sp2-hybridised, trigonal planar (~120°), 3 σ bonds + 1 π bond; polarised with electrophilic δ+ carbon (Lewis acid) and nucleophilic δ- oxygen (Lewis base). The carbonyl carbon (C=O) is sp2-hybridised and trigonal planar (~120°), with electrophilic δ+ carbon and nucleophilic δ- oxygen. Aldehydes are prepared via Rosenmu", "tag": "NCERT"}, {"id": "II_Che_51_2", "qno": 2, "q": "What is the ROSENMUND REDUCTION for preparing aldehydes from acyl chlorides?", "a": "Reaction with SnCl2 + HCl", "b": "Hydrogenation of an acyl chloride (e.g. benzoyl chloride) over palladium on barium sulphate (H2 / Pd–BaSO4) → aldehyde (benzaldehyde) + HCl", "c": "Reduction with LiAlH4 to alcohol", "d": "Oxidation with CrO2Cl2", "ans": "B", "exp": "Hydrogenation of an acyl chloride (e.g. benzoyl chloride) over palladium on barium sulphate (H2 / Pd–BaSO4) → aldehyde (benzaldehyde) + HCl. The carbonyl carbon (C=O) is sp2-hybridised and trigonal planar (~120°), with electrophilic δ+ carbon and nucleophilic δ- oxygen. Aldehydes are prepared via Rosenmund reduction (R", "tag": "NCERT"}, {"id": "II_Che_51_3", "qno": 3, "q": "What is the STEPHEN REACTION for preparing aldehydes from nitriles (R–CN)?", "a": "R–COCl + H2/Pd–BaSO4", "b": "Benzene + CO + HCl / anh. AlCl3", "c": "Reduction of nitriles with stannous chloride (SnCl2) and HCl to imine hydrochloride (R–CH=NH), followed by hydrolysis (H3O+) → R–CHO", "d": "Toluene + CrO2Cl2 in CS2", "ans": "C", "exp": "Reduction of nitriles with stannous chloride (SnCl2) and HCl to imine hydrochloride (R–CH=NH), followed by hydrolysis (H3O+) → R–CHO. The carbonyl carbon (C=O) is sp2-hybridised and trigonal planar (~120°), with electrophilic δ+ carbon and nucleophilic δ- oxygen. Aldehydes are prepared via Rosenmund reduction (RCOCl + ", "tag": "NCERT"}, {"id": "II_Che_51_4", "qno": 4, "q": "Which selective reagent reduces nitriles (R–CN) AND esters (R–COOR') directly to ALDEHYDES (R–CHO) without attacking C=C double bonds?", "a": "Zn–Hg / conc. HCl", "b": "Diisobutylaluminium hydride (DIBAL-H, AlH(i-Bu)2) followed by H2O", "c": "NH2NH2 / KOH", "d": "Acidified KMnO4", "ans": "B", "exp": "Diisobutylaluminium hydride (DIBAL-H, AlH(i-Bu)2) followed by H2O. The carbonyl carbon (C=O) is sp2-hybridised and trigonal planar (~120°), with electrophilic δ+ carbon and nucleophilic δ- oxygen. Aldehydes are prepared via Rosenmund reduction (RCOCl + H2/Pd–BaSO4), Stephen reaction (RCN + SnCl2/HCl → H3O+), DIBAL-H re", "tag": "NCERT"}, {"id": "II_Che_51_5", "qno": 5, "q": "What is the ETARD REACTION for preparing benzaldehyde from toluene?", "a": "Benzene + CO + HCl / anh. AlCl3", "b": "Benzoyl chloride + H2/Pd–BaSO4", "c": "Oxidation of toluene with chromyl chloride (CrO2Cl2) in CS2 to form a brown chromium complex, which on hydrolysis (H3O+) yields BENZALDEHYDE", "d": "Toluene + Cl2/hν → benzal chloride → H2O", "ans": "C", "exp": "Oxidation of toluene with chromyl chloride (CrO2Cl2) in CS2 to form a brown chromium complex, which on hydrolysis (H3O+) yields BENZALDEHYDE. The carbonyl carbon (C=O) is sp2-hybridised and trigonal planar (~120°), with electrophilic δ+ carbon and nucleophilic δ- oxygen. Aldehydes are prepared via Rosenmund reduction (", "tag": "NCERT"}]}, {"chapter": "Chapter 9 - Amines", "questions": [{"id": "II_Che_52_1", "qno": 1, "q": "What are the hybridisation, molecular geometry and C–N–C bond angle of the nitrogen atom in trimethylamine (CH3)3N?", "a": "sp2 trigonal planar (120°)", "b": "sp linear (180°)", "c": "Tetrahedral (109.5°) with no lone pair", "d": "sp3-hybridised, PYRAMIDAL geometry, C–N–C angle = 108° (less than 109.5° due to lone-pair–bond-pair repulsion)", "ans": "D", "exp": "sp3-hybridised, PYRAMIDAL geometry, C–N–C angle = 108° (less than 109.5° due to lone-pair–bond-pair repulsion). Amines have sp3-hybridised pyramidal nitrogen (C–N–C = 108° in Me3N) with an unshared lone pair conferring basicity and nucleophilicity. Preparations: Fe/HCl reduction of nitrobenzene (regenerates HCl), ammon", "tag": "NCERT"}, {"id": "II_Che_52_2", "qno": 2, "q": "How are amines classified as 1°, 2° and 3°?", "a": "By the degree of carbon attached to N (as in alcohols)", "b": "By the number of alkyl/aryl groups replacing H atoms of NH3: 1° (R–NH2), 2° (R2NH), 3° (R3N)", "c": "By number of N atoms", "d": "By molar mass", "ans": "B", "exp": "By the number of alkyl/aryl groups replacing H atoms of NH3: 1° (R–NH2), 2° (R2NH), 3° (R3N). Amines have sp3-hybridised pyramidal nitrogen (C–N–C = 108° in Me3N) with an unshared lone pair conferring basicity and nucleophilicity. Preparations: Fe/HCl reduction of nitrobenzene (regenerates HCl), ammonolysis of R–X (exc", "tag": "NCERT"}, {"id": "II_Che_52_3", "qno": 3, "q": "Why is reduction of nitrobenzene with IRON SCRAP + HCl (Fe/HCl) preferred industrially over Sn/HCl?", "a": "Because FeCl2 formed during reaction gets hydrolysed to release HCl, so ONLY A SMALL INITIAL AMOUNT of HCl is needed to initiate the reaction", "b": "Because Fe is more expensive than Sn", "c": "Because Fe/HCl produces benzene", "d": "Because Sn/HCl does not reduce –NO2", "ans": "A", "exp": "Because FeCl2 formed during reaction gets hydrolysed to release HCl, so ONLY A SMALL INITIAL AMOUNT of HCl is needed to initiate the reaction. Amines have sp3-hybridised pyramidal nitrogen (C–N–C = 108° in Me3N) with an unshared lone pair conferring basicity and nucleophilicity. Preparations: Fe/HCl reduction of nitrob", "tag": "NCERT"}, {"id": "II_Che_52_4", "qno": 4, "q": "What is the major drawback of AMMONOLYSIS of alkyl halides (R–X + NH3 at 373 K) for preparing pure 1° amines, and how can 1° amine yield be maximised?", "a": "Adding excess R–X gives pure 1° amine", "b": "Ammonolysis fails with CH3I", "c": "Ammonolysis yields only 3° amines", "d": "Drawback: yields a mixture of 1°, 2°, 3° amines and quaternary ammonium salt (R4N+X-); 1° amine becomes major by using a LARGE EXCESS of NH3", "ans": "D", "exp": "Drawback: yields a mixture of 1°, 2°, 3° amines and quaternary ammonium salt (R4N+X-); 1° amine becomes major by using a LARGE EXCESS of NH3. Amines have sp3-hybridised pyramidal nitrogen (C–N–C = 108° in Me3N) with an unshared lone pair conferring basicity and nucleophilicity. Preparations: Fe/HCl reduction of nitrobe", "tag": "NCERT"}, {"id": "II_Che_52_5", "qno": 5, "q": "What is GABRIEL PHTHALIMIDE SYNTHESIS, and why can it NOT be used to prepare AROMATIC PRIMARY AMINES (like aniline)?", "a": "It prepares only 3° amines", "b": "Phthalimide does not react with KOH", "c": "Phthalimide + alc. KOH → potassium phthalim yielding them on", "tag": "NCERT"}, {"id": "II_Che_53_3", "qno": 3, "q": "What distinguishes a REDUCING SUGAR from a NON-REDUCING SUGAR?", "a": "Glucose is a non-reducing sugar", "b": "All disaccharides are non-reducing", "c": "Reducing sugars reduce Fehling's and Tollens' reagents (all monosaccharides + disaccharides with free aldehydic/ketonic group like maltose & lactose); non-reduc", "d": "Sucrose is a reducing sugar", "ans": "C", "exp": "Reducing sugars reduce Fehling's and Tollens' reagents (all monosaccharides + disaccharides with free aldehydic/ketonic group like maltose & lactose); non-reducing sugars have both anomeric carbons tied in glycosidic linkage (SUCROSE). Carbohydrates are optically active polyhydroxy aldehydes or ketones (or compounds yi", "tag": "NCERT"}, {"id": "II_Che_53_4", "qno": 4, "q": "What does the reaction of D-glucose with (i) HI (prolonged heating), (ii) NH2OH / HCN, (iii) Br2 water, (iv) Acetic anhydride, and (v) Conc. HNO3 prove about its open-chain structure?", "a": "(i) HI → n-hexane (6 C in straight chain); (ii) NH2OH/HCN → oxime/cyanohydrin (carbonyl group); (iii) Br2 water → gluconic acid (–CHO group); (iv) (CH3CO)2O → g", "b": "(iii) Br2 water gives saccharic acid", "c": "(i) HI gives benzene", "d": "(iv) gives triacetate", "ans": "A", "exp": "(i) HI → n-hexane (6 C in straight chain); (ii) NH2OH/HCN → oxime/cyanohydrin (carbonyl group); (iii) Br2 water → gluconic acid (–CHO group); (iv) (CH3CO)2O → glucose pentaacetate (5 –OH on different C); (v) HNO3 → saccharic acid (1° –OH group). Carbohydrates are optically active polyhydroxy aldehydes or ketones (or co", "tag": "NCERT"}, {"id": "II_Che_53_5", "qno": 5, "q": "Which THREE experimental facts could NOT be explained by the open-chain structure of glucose and led to its cyclic hemiacetal (pyranose) structure?", "a": "(1) Glucose does NOT give Schiff's test or NaHSO3 adduct despite having –CHO; (2) Glucose pentaacetate does NOT react with NH2OH (no free –CHO); (3) Glucose exi", "b": "Glucose has 5 carbon atoms", "c": "Glucose does not dissolve in water", "d": "Glucose does not react with HI", "ans": "A", "exp": "(1) Glucose does NOT give Schiff's test or NaHSO3 adduct despite having –CHO; (2) Glucose pentaacetate does NOT react with NH2OH (no free –CHO); (3) Glucose exists in TWO crystalline anomeric forms: α-form (m.p. 419 K) and β-form (m.p. 423 K). Carbohydrates are optically active polyhydroxy aldehydes or ketones (or comp", "tag": "NCERT"}]}, {"chapter": "Unit 20 - Practical Chemistry", "questions": [{"id": "II_Che_54_1", "qno": 1, "q": "In systematic qualitative salt analysis, the group reagent for Group I cations (Pb2+) is:", "a": "Dilute HCl (precipitating white PbCl2)", "b": "NH4OH in presence of NH4Cl", "c": "H2S gas in acidic medium", "d": "(NH4)2CO3 in presence of NH4Cl", "ans": "A", "exp": "Correct answer: Dilute HCl (precipitating white PbCl2).", "tag": "Booster"}, {"id": "II_Che_54_2", "qno": 2, "q": "The group reagent for Group II cations (Cu2+, As3+, Pb2+) is:", "a": "H2S gas passed in the presence of dilute HCl", "b": "NaOH solution", "c": "Dilute H2SO4", "d": "H2S gas in ammoniacal medium", "ans": "A", "exp": "Correct answer: H2S gas passed in the presence of dilute HCl.", "tag": "Booster"}, {"id": "II_Che_54_3", "qno": 3, "q": "Why is solid NH4Cl added BEFORE NH4OH during Group III cation analysis (Fe3+, Al3+)?", "a": "Common-ion effect of NH4+ suppresses the ionisation of NH4OH so [OH−] stays low enough to precipitate only Group III hydroxides without precipitating Group IV/V", "b": "To precipitate Mg(OH)2 first", "c": "To dissolve Fe(OH)3", "d": "To increase [OH−] concentration", "ans": "A", "exp": "Correct answer: Common-ion effect of NH4+ suppresses the ionisation of NH4OH so [OH−] stays low enough to precipitate only Group III hydroxides without precipitating Group IV/V hydroxides.", "tag": "Booster"}, {"id": "II_Che_54_4", "qno": 4, "q": "Which set of cations belongs to Group IV (precipitated as sulphides by H2S in ammoniacal NH4OH + NH4Cl medium)?", "a": "Fe3+ and Al3+", "b": "Ba2+, Sr2+, and Ca2+", "c": "Zn2+, Mn2+, Co2+, and Ni2+", "d": "Cu2+ and Pb2+", "ans": "C", "exp": "Correct answer: Zn2+, Mn2+, Co2+, and Ni2+.", "tag": "Booster"}, {"id": "II_Che_54_5", "qno": 5, "q": "Which set of cations belongs to Group V (precipitated as carbonates by (NH4)2CO3 in presence of NH4Cl and NH4OH)?", "a": "Ba2+, Sr2+, and Ca2+", "b": "Zn2+, Co2+, and Ni2+", "c": "Mg2+ and NH4+", "d": "Fe3+ and Al3+", "ans": "A", "exp": "Correct answer: Ba2+, Sr2+, and Ca2+.", "tag": "Booster"}]}, {"chapter": "Verified PYQs (NEET & KCET)", "questions": [{"id": "II_Che_55_1", "qno": 1, "q": "[KCET 2025] 180 g of glucose (C6H12O6) is dissolved in 1 kg of water in a vessel. The temperature at which water boils at 1.013 bar (K_b = 0.52 K kg mol-1, boiling point of pure water = 373.15 K) is:", "a": "373.0 K", "b": "373.202 K", "c": "373.67 K", "d": "373.015 K", "ans": "C", "exp": "Molality m = (180/180)/1 = 1 mol kg-1; ΔT_b = K_b m = 0.52 K, giving T_b = 373.15 + 0.52 = 373.67 K.", "tag": "PYQ"}, {"id": "II_Che_55_2", "qno": 2, "q": "[KCET 2025] For a given half-cell Al3+ + 3e- → Al, on increasing the concentration of aluminium ion, the electrode potential will:", "a": "Increase", "b": "Show no change", "c": "First increase then decrease", "d": "Decrease", "ans": "A", "exp": "By the Nernst equation, E = E° + (0.0591/3) log[Al3+], so increasing [Al3+] increases electrode potential E.", "tag": "PYQ"}, {"id": "II_Che_55_3", "qno": 3, "q": "[KCET 2025] Half-life of a first-order reaction is 20 seconds and initial concentration of reactant is 0.2 M. The concentration of reactant left after 80 seconds is:", "a": "0.1 M", "b": "0.0125 M", "c": "0.05 M", "d": "0.2 M", "ans": "B", "exp": "Number of half-lives n = 80/20 = 4; remaining concentration [R] = 0.2 × (1/2)4 = 0.2/16 = 0.0125 M.", "tag": "PYQ"}, {"id": "II_Che_55_4", "qno": 4, "q": "[NEET 2026 (Re-exam)] Given below are two statements: Assertion (A) and Reason (R).\nAssertion (A): Generally, 3d transition metals have high melting points.\nReason (R): Involvement of 3d-electrons in addition to 4s-electrons in interatomic metallic bonding.\nChoose the most appropriate answer:", "a": "A is not correct but R is correct", "b": "Both A and R are correct and R is the correct explanation of A", "c": "A is correct but R is not correct", "d": "Both A and R are correct and R is NOT the correct explanation of A", "ans": "B", "exp": "Strong metallic bonding involving both ns and (n−1)d electrons explains the high melting points of 3d transition metals.", "tag": "PYQ"}, {"id": "II_Che_55_5", "qno": 5, "q": "[NEET 2025] Given below are two statements:\nStatement I: Ferromagnetism is considered as an extreme form of paramagnetism.\nStatement II: The number of unpaired electrons in a Cr2+ ion (Z = 24) is the same as that of a Nd3+ ion (Z = 60).\nChoose the correct option:", "a": "Both Statement I and Statement II are false", "b": "Both Statement I and Statement II are true", "c": "Statement I is false but Statement II is true", "d": "Statement I is true but Statement II is false", "ans": "D", "exp": "Ferromagnetism is an extreme form of paramagnetism (Statement I true). Cr2+ (3d4) has 4 unpaired electrons whereas Nd3+ (4f3) has 3 unpaired electrons (Statement II false).", "tag": "PYQ"}]}, {"chapter": "NEET High-Order Booster", "questions": [{"id": "II_Che_56_1", "qno": 1, "q": "Given below are two statements:\nStatement I: An ethanol–acetone mixture shows positive deviation from Raoult's law because acetone disrupts hydrogen bonding between ethanol molecules.\nStatement II: A chloroform–acetone mixture shows negative deviation from Raoult's law due to intermolecular H-bonding.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Both Statement I and Statement II are incorrect", "c": "Both Statement I and Statement II are correct", "d": "Statement I is incorrect but Statement II is correct", "ans": "C", "exp": "Breaking ethanol H-bonds weakens A–B interactions (+ve deviation), while CHCl3–acetone forms H-bonds (−ve deviation).", "tag": "Booster"}, {"id": "II_Che_56_2", "qno": 2, "q": "Given below are two statements:\nStatement I: Molar conductivity Λ_m increases on dilution for both strong and weak electrolytes.\nStatement II: Specific conductivity (κ) decreases on dilution because the number of ions per unit volume decreases.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Both Statement I and Statement II are incorrect", "c": "Both Statement I and Statement II are correct", "d": "Statement I is incorrect but Statement II is correct", "ans": "C", "exp": "Dilution lowers ion concentration per cm3 (κ decreases) while total volume V increases more strongly (Λ_m = κV increases).", "tag": "Booster"}, {"id": "II_Che_56_3", "qno": 3, "q": "Given below are two statements:\nStatement I: The half-life of a first-order reaction is independent of the initial concentration of reactant.\nStatement II: The half-life of a zero-order reaction is inversely proportional to the initial concentration of reactant.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Both Statement I and Statement II are incorrect", "c": "Both Statement I and Statement II are correct", "d": "Statement I is incorrect but Statement II is correct", "ans": "A", "exp": "First-order t1/2 = 0.693/k (independent of [R]0); zero-order t1/2 = [R]0/(2k) is directly proportional to [R]0.", "tag": "Booster"}, {"id": "II_Che_56_4", "qno": 4, "q": "Given below are two statements:\nStatement I: Zr (4d) and Hf (5d) have almost identical atomic radii due to lanthanoid contraction.\nStatement II: Poor shielding of nuclear charge by 4f electrons causes lanthanoid contraction.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Statement I is incorrect but Statement II is correct", "c": "Both Statement I and Statement II are correct", "d": "Both Statement I and Statement II are incorrect", "ans": "C", "exp": "Poor 4f shielding contracts 5d radii so Zr and Hf have nearly identical sizes and chemical behaviour.", "tag": "Booster"}, {"id": "II_Che_56_5", "qno": 5, "q": "Given below are two statements:\nStatement I: Acidified KMnO4 oxidises Fe2+ to Fe3+ while MnO4- is reduced to Mn2+.\nStatement II: In neutral or faintly alkaline medium, MnO4- is reduced to Mn2+.\nChoose the correct option:", "a": "Statement I is correct but Statement II is incorrect", "b": "Statement I is incorrect but Statement II is correct", "c": "Both Statement I and Statement II are incorrect", "d": "Both Statement I and Statement II are correct", "ans": "A", "exp": "In acidic medium MnO4- → Mn2+ (n = 5); in neutral/faintly alkaline medium MnO4- → MnO2 (n = 3).", "tag": "Booster"}]}], "I PUC|Biology": [{"chapter": "Chapter 1 - The Living World", "questions": [{"id": "I _Bio_57_1", "qno": 1, "q": "Who is famously called 'The Darwin of the 20th century' for his monumental work in evolutionary biology and systematics?", "a": "Charles Darwin", "b": "Ernst Mayr", "c": "Carolus Linnaeus", "d": "R.H. Whittaker", "ans": "B", "exp": "Correct answer: Ernst Mayr. Earth has 1.7–1.8 million known and described species (biodiversity). Ernst Mayr ('The Darwin of the 20th century', Harvard, triple crown: Balzan 1983, International Prize for Biology 1994, Crafoord 1999) pioneered the biological species concept. Standardised naming uses ICBN (plants) and IC", "tag": "NCERT"}, {"id": "I _Bio_57_2", "qno": 2, "q": "Where and in which year was Ernst Mayr born?", "a": "Kempten, Germany on 5 July 1904", "b": "Cambridge, England in 1809", "c": "Vienna, Austria in 1822", "d": "Uppsala, Sweden in 1707", "ans": "A", "exp": "Correct answer: Kempten, Germany on 5 July 1904. Earth has 1.7–1.8 million known and described species (biodiversity). Ernst Mayr ('The Darwin of the 20th century', Harvard, t 0th century', Harvard, triple crown: Balzan 1983, International Prize for Biology 1994, Crafoord 1999) pioneered the biological species concept. Standardised naming u", "tag": "NCERT"}]}, {"chapter": "Chapter 2 - Biological Class", "questions": [{"id": "I _Bio_58_1", "qno": 1, "q": "Who was the earliest to attempt a more scientific basis for classification using simple morphological characters?", "a": "R.H. Whittaker", "b": "Ernst Mayr", "c": "Aristotle", "d": "Carolus Linnaeus", "ans": "C", "exp": "Correct answer: Aristotle. Aristotle classified plants (trees, shrubs, herbs) and animals (red blood vs no red blood); Linnaeus proposed Two Kingdoms (Plantae, Animalia); R.H. Whittaker (1969) proposed Five Kingdoms (Monera, Protista, Fungi, Plantae, Animalia) using cell structure, body organisation, nutrition, reprodu", "tag": "NCERT"}, {"id": "I _Bio_58_2", "qno": 2, "q": "How did Aristotle classify plants using simple morphological characters?", "a": "Into monocots and dicots", "b": "Into algae, bryophytes and pteridophytes", "c": "Into trees, shrubs and herbs", "d": "Into vascular and non-vascular plants", "ans": "C", "exp": "Correct answer: Into trees, shrubs and herbs. Aristotle classified plants (trees, shrubs, herbs) and animals (red blood vs no red blood); Linnaeus proposed Two Kingdoms (Plantae, Animalia); R.H. Whittaker (1969) proposed Five Kingdoms (Monera, Protista, Fungi, Plantae, Animalia) using cell structure, body organisation,", "tag": "NCERT"}, {"id": "I _Bio_58_3", "qno": 3, "q": "How did Aristotle divide animals into two groups?", "a": "Aquatic and terrestrial", "b": "Autotrophic and heterotrophic", "c": "Those which had red blood and those that did not", "d": "Vertebrates and invertebrates", "ans": "C", "exp": "Correct answer: Those which had red blood and those that did not. Aristotle classified plants (trees, shrubs, herbs) and animals (red blood vs no red blood); Linnaeus proposed Two Kingdoms (Plantae, Animalia); R.H. Whittaker (1969) proposed Five Kingdoms (Monera, Protista, Fungi, Plantae, Animalia) using cell structure", "tag": "NCERT"}, {"id": "I _Bio_58_4", "qno": 4, "q": "Which scientist developed the Two-Kingdom system of classification (Plantae and Animalia)?", "a": "R.H. Whittaker", "b": "Carl Woese", "c": "Aristotle", "d": "Carolus Linnaeus", "ans": "D", "exp": "Correct answer: Carolus Linnaeus. Aristotle classified plants (trees, shrubs, herbs) and animals (red blood vs no red blood); Linnaeus proposed Two Kingdoms (Plantae, Animalia); R.H. Whittaker (1969) proposed Five Kingdoms (Monera, Protista, Fungi, Plantae, Animalia) using cell structure, body organisation, nutrition, ", "tag": "NCERT"}, {"id": "I _Bio_58_5", "qno": 5, "q": "Which major limitation did Linnaeus's Two-Kingdom system of classification suffer from?", "a": "It placed humans in Kingdom Plantae", "b": "It created too many kingdoms (six)", "c": "It did not distinguish between eukaryotes and prokaryotes, unicellular and multicellular organisms, and photosynthetic (green algae) and non-photosynthetic (fun", "d": "It excluded all flowering plants", "ans": "C", "exp": "It did not distinguish between eukaryotes and prokaryotes, unicellular and multicellular organisms, and photosynthetic (green algae) and non-photosynthetic (fungi) organisms. Aristotle classified plants (trees, shrubs, herbs) and animals (red blood vs no red blood); Linnaeus proposed Two Kingdoms (Plantae, Animalia); R", "tag": "NCERT"}]}, {"chapter": "Chapter 3 - Plant Kingdom", "questions": [{"id": "I _Bio_59_1", "qno": 1, "q": "Earliest plant classification systems used only gross superficial morphological characters such as habit, colour, number and shape of leaves, or androecium structure. Such systems are called:", "a": "Artificial systems", "b": "Natural systems", "c": "Phylogenetic systems", "d": "Chemotaxonomic systems", "ans": "A", "exp": "Correct answer: Artificial systems. Plant classification progressed from Artificial systems (Linnaeus, superficial vegeta rs are more easily affected by environment than sexual/floral characters", "ans": "D", "exp": "Because vegetative characters are more easily affected by environment than sexual/floral characters. Plant classification progressed from Artificial systems (Linnaeus, superficial vegetative/androecium traits) to Natural systems (Bentham & Hooker, internal + external traits) and Phylogenetic systems (evolutionary relat", "tag": "NCERT"}, {"id": "I _Bio_59_5", "qno": 5, "q": "Natural classification systems were based on natural affinities among organisms and considered NOT ONLY external features, but also internal features such as:", "a": "Leaf colour and height only", "b": "Androecium number only", "c": "Habitat depth only", "d": "Ultrastructure, anatomy, embryology and phytochemistry", "ans": "D", "exp": "Correct answer: Ultrastructure, anatomy, embryology and phytochemistry. Plant classification progressed from Artificial systems (Linnaeus, superficial vegetative/androecium traits) to Natural systems (Bentham & Hooker, internal + external traits) and Phylogenetic systems (evolutionary relationships), supported by Numer", "tag": "NCERT"}]}, {"chapter": "Chapter 4 - Animal Kingdom", "questions": [{"id": "I _Bio_60_1", "qno": 1, "q": "What are the six fundamental features used as the basis of animal classification?", "a": "Height, colour, diet and lifespan", "b": "Presence of wings and feathers only", "c": "Chlorophyll type, cell wall and seed coat", "d": "Arrangement of cells (levels of organisation), body symmetry, nature of coelom, patterns of digestive/circulatory/reproductive systems, segmentation and notocho", "ans": "D", "exp": "Arrangement of cells (levels of organisation), body symmetry, nature of coelom, patterns of digestive/circulatory/reproductive systems, segmentation and notochord. Animal classification rests on level of organisation (cellular, tissue, organ, organ-system), symmetry (asymmetrical, radial, bilateral), germ layers (diplo", "tag": "NCERT"}, {"id  Hemichordata and Chordata", "b": "Porifera and Coelenterata only", "c": "Platyhelminthes only", "d": "Ctenophora and Porifera", "ans": "A", "exp": "Aschelminthes, Annelida, Arthropoda, Mollusca, Echinodermata, Hemichordata and Chordata. Animal classification rests on level of organisation (cellular, tissue, organ, organ-system), symmetry (asymmetrical, radial, bilateral), germ layers (diploblastic with mesoglea vs triploblastic with mesoderm), coelom (acoelomate, ", "tag": "NCERT"}]}, {"chapter": "Chapter 5 - Morphology Plants", "questions": [{"id": "I _Bio_61_1", "qno": 1, "q": "In majority of dicotyledonous plants, the direct elongation of the radicle leads to the formation of:", "a": "Plumule shoot axis", "b": "Adventitious roots from leaves", "c": "Primary root which grows inside the soil", "d": "Fibrous root system from the stem base", "ans": "C", "exp": "Correct answer: Primary root which grows inside the soil. Roots arise from the radicle (tap root in mustard; short-lived primary root replaced by stem-base fibrous roots in wheat) or non-radicle parts (adventitious roots in grass, Monstera, banyan). Root regions from tip up: thimble-like root cap → region of meristemat", "tag": "NCERT"}, {"id": "I _Bio_61_2", "qno": 2, "q": "The primary root and its lateral branches (secondary and tertiary roots) together constitute the:", "a": "Aerial shoot system", "b": "Adventitious root system (as seen in Monstera)", "c": "Tap root system (as seen in the mustard plant)", "d": "Fibrous root system (as seen in wheat)", "ans": "C", "exp": "Correct answer: Tap root system (as seen in the mustard plant). Roots arise from the radicle (tap root in mustard; short-lived primary root replaced by stem-base fibrous roots in wheat) or non-radicle parts (adventitious roots in grass, Monstera, banyan). Root regions from tip up: thimble-like root cap → region of meri", "tag": "NCERT"}, {"id": "I _Bio_61_3", "qno": 3, "q": "In monocotyledonous plants like wheat, the primary root is short- : "NCERT"}]}, {"chapter": "Chapter 6 - Anatomy Plants", "questions": [{"id": "I _Bio_62_1", "qno": 1, "q": "The study of internal structure of plants is called:", "a": "Taxonomy", "b": "Morphology", "c": "Anatomy", "d": "Ecology", "ans": "C", "exp": "Correct answer: Anatomy. Plant tissues form three systems: Epidermal (single-layered compact parenchymatous epidermis, waxy cuticle absent in roots, stomata with bean-shaped dicot / dumb-bell grass guard cells having thin outer & thick inner walls + chloroplasts + subsidiary cells forming the stomatal apparatus, unicel", "tag": "NCERT"}, {"id": "I _Bio_62_2", "qno": 2, "q": "On the basis of their structure and location, plant tissues are grouped into which three tissue systems?", "a": "Apical, intercalary and lateral tissue systems", "b": "Dermal, muscular and nervous tissue systems", "c": "Meristematic, root cap and floral tissue systems", "d": "Epidermal tissue system, ground or fundamental tissue system, and vascular or conducting tissue system", "ans": "D", "exp": "Epidermal tissue system, ground or fundamental tissue system, and vascular or conducting tissue system. Plant tissues form three systems: Epidermal (single-layered compact parenchymatous epidermis, waxy cuticle absent in roots, stomata with bean-shaped dicot / dumb-bell grass guard cells having thin outer & thick inner", "tag": "NCERT"}, {"id": "I _Bio_62_3", "qno": 3, "q": "What forms the outermost covering of the whole plant body and comprises epidermal cells, stomata and epidermal appendages (trichomes and hairs)?", "a": "Vascular tissue system", "b": "Conjunctive tissue", "c": "Epidermal tissue system", "d": "Ground tissue system", "ans": "C", "exp": "Correct answer: Epidermal tissue system. Plant tissues form three systems: Epidermal (single-layered compact parenchymatous epidermis, waxy cuticle absent in roots, stomata with bean-shaped dicot / dumb-bell grass guard cells having thin outer & thick inner walls + chloroplasts + subsidiary cells forming a", "tag": "NCERT"}]}, {"chapter": "Chapter 18 - Neural Control", "questions": [{"id": "I _Bio_74_1", "qno": 1, "q": "How do the neural system and the endocrine system differ in the nature of coordination they provide?", "a": "The neural system acts slowly over weeks whereas hormones act in milliseconds", "b": "Both act exclusively via blood-borne hormones", "c": "Only invertebrates have a neural system", "d": "The neural system provides an organised network of point-to-point connections for quick coordination; the endocrine system provides chemical integration through", "ans": "D", "exp": "The neural system provides an organised network of point-to-point connections for quick coordination; the endocrine system provides chemical integration through hormones. The neural system provides quick point-to-point coordination (simple nerve net in Hydra → brain + ganglia in insects → highly developed in vertebrate", "tag": "NCERT"}, {"id": "I _Bio_74_2", "qno": 2, "q": "What are the highly specialised cells composing the neural system that can detect, receive and transmit different kinds of stimuli?", "a": "Nephrons", "b": "Sarcomeres", "c": "Neurons", "d": "Podocytes", "ans": "C", "exp": "As illustrated in the diagram, the correct answer is 'Neurons'. The neural system provides quick point-to-point coordination (simple nerve net in Hydra → brain + ganglia in insects → highly developed in vertebrates). Human neural system comprises CNS (brain & spinal cord) and PNS (afferent sensory & efferent motor fibr", "tag": "NCERT"}, {"id": "I _Bio_74_3", "qno": 3, "q": "How does neural organisation progress from Hydra to insects to vertebrates?", "a": "Vertebrates have only a diffuse nerve net like Hydra", "b": "Hydra has a 4-chambered brain", "c": "Insects lack a brain and ganglia", "d": "Very simple network of neurons in Hydra → better organised with a brain, ganglia and neural tissues in insects → most developed neural system in vertebrates", "ans": "D", "exp": "Very simple network of neurons in Hydra → better organised with a brain, ganglia and neural tissues in insects → most developed neural system in vertebrates. The neural system provides quick point-to-point coordination (simple nerve net in Hydra → brain + ganglia in insects → highly developed in vertebrates). Human neu", "tag": "NCERT"}, {"id": "I _Bio_74_4", "qno": 4, "q": "Into what TWO main divisions is the HUMAN NEURAL SYSTEM divided?", "a": "Sympathetic and hormonal only", "b": "Somatic and enteric only", "c": "Central Neural System (CNS) and Peripheral Neural System (PNS)", "d": "Cranial and spinal nerves only", "ans": "C", "exp": "Correct answer: Central Neural System (CNS) and Peripheral Neural System (PNS). The neural system provides quick point-to-point coordination (simple nerve net in Hydra → brain + ganglia in insects → highly developed in vertebrates). Human neural system comprises CNS (brain & spinal cord) and PNS (afferent sensory & eff", "tag": "NCERT"}, {"id": "I _Bio_74_5", "qno": 5, "q": "Which two organs make up the Central Neural System (CNS), serving as the site of information processing and control?", "a": "Heart and lungs", "b": "Brain and spinal cord", "c": "Kidneys and adrenals", "d": "Cranial nerves and ganglia", "ans": "B", "exp": "As illustrated in the diagram, the correct answer is 'Brain and spinal cord'. The neural system provides quick point-to-point coordination (simple nerve net in Hydra → brain + ganglia in insects → highly developed in vertebrates). Human neural system comprises CNS (brain & spinal cord) and PNS (afferent sensory & effer", "tag": "NCERT"}]}, {"chapter": "Chapter 19 - Chemical Coord", "questions": [{"id": "I _Bio_75_1", "qno": 1, "q": "Why are endocrine glands called DUCTLESS GLANDS, and what are their secretions called?", "a": "They lack ducts and release their secretions called HORMONES directly into the blood", "b": "They secrete digestive enzymes into the stomach", "c": "They have long ducts opening onto skin", "d": "They relea  to improved crop varieties, but mainly due to the use of:", "a": "Better management practices and use of agrochemicals (fertilisers and pesticides)", "b": "RNA interference", "c": "Genetically engineered Bt crops", "d": "Gene therapy", "ans": "A", "exp": "Better management practices and use of agrochemicals (fertilisers and pesticides). Biotechnology's three critical areas are best catalyst, optimal engineering conditions, and downstream processing. GMOs tolerate abiotic stresses, reduce pesticide reliance and post-harvest losses, improve mineral efficiency, and enhance", "tag": "NCERT"}]}, {"chapter": "Chapter 11 - Organisms & Pop", "questions": [{"id": "II_Bio_87_1", "qno": 1, "q": "In nature, we rarely find isolated, single individuals of any species; majority of them live in groups in a well-defined geographical area, share or compete for similar resources, potentially interbreed, and thus constitute a:", "a": "Population", "b": "Biosphere", "c": "Single organism", "d": "Biome", "ans": "A", "exp": "Correct answer: Population. Population ecology links ecology to population genetics and evolution because natural selection operates at the population level. Populations have birth/death rates (lotus 8/20 = 0.4/yr; fruitflies 4/40 = 0.1/wk), sex ratio, age pyramids (expanding, stable, declining), and population density", "tag": "NCERT"}, {"id": "II_Bio_87_2", "qno": 2, "q": "Are all the bacteria in a culture plate or all the lotus plants in a pond also considered a 'population' in ecological studies, even if they reproduce asexually?", "a": "No, bacteria cannot form populations", "b": "Only woody trees form populations", "c": "Yes, for the purpose of ecological studies, a group of individuals resulting from even asexual reproduction is generally considered a population", "d": "No, only sexually reproducing mammals form populations", "ans": "C", "exp": "Yes, for the purpose of ecological studies, a group of individuals resulting from even asexual reproduction is generally considered a population. Population ecology links ecology to population genetics and evolution because natural selection operates at the population level. Populations have birth/death rates (lotus 8/", "tag": "NCERT"}, {"id": "II_Bio_87_3", "qno": 3, "q": "Which of the following is an example of a population cited in ecology?", "a": "All the cormorants in a wetland, rats in an abandoned dwelling, teakwood trees in a forest tract, bacteria in a culture plate, and lotus plants in a pond", "b": "One single tiger in a zoo", "c": "A mixture of frogs, algae and fishes together", "d": "Non-living soil and water", "ans": "A", "exp": "All the cormorants in a wetland, rats in an abandoned dwelling, teakwood trees in a forest tract, bacteria in a culture plate, and lotus plants in a pond. Population ecology links ecology to population genetics and evolution because natural selection operates at the population level. Populations have birth/death rates ", "tag": "NCERT"}, {"id": "II_Bio_87_4", "qno": 4, "q": "Why is population ecology an important area linking ecology to population genetics and evolution?", "a": "Because individual organisms evolve new species in one day", "b": "Although an individual organism copes with a changed environment, it is at the population level that natural selection operates to evolve the desired traits", "c": "Because populations have no genetic variation", "d": "Because natural selection operates only on non-living rocks", "ans": "B", "exp": "Although an individual organism copes with a changed environment, it is at the population level that natural selection operates to evolve the desired traits. Population ecology links ecology to population genetics and evolution because natural selection operates at the population level. Populations have birth/death rat", "tag": "NCERT"}, {"id": "II_Bio_87_5", "qno": 5, "q": "Which attributes belong to a POPULATION rather than an individual organism?", "a": "Individual height and eye colour only", "b": "Single birth and single death only", "c": "Heartbeat rate only", "d": "Birth rates, death rates, sex ratio, age distribution (age pyramid) and population density", "ans": "D", "exp": "Birth rates, death rates, sex ratio, age distribution (age pyramid) and population density. Population ecology links ecology to population genetics and evolution because natural selection operates at the population level. Populations have birth/death rates (lotus 8/20 = 0.4/yr; fruitflies 4/40 = 0.1/wk), sex ratio, age", "tag": "NCERT"}]}, {"chapter": "Chapter 12 - Ecosystem", "questions": [{"id": "II_Bio_88_1", "qno": 1, "q": "An ecosystem can be visualised as a _______ unit of nature, where living organisms interact among themselves and also with the surrounding physical environment.", "a": "Functional", "b": "Isolated single-species", "c": "Purely non-living", "d": "Static geological", "ans": "A", "exp": "Correct answer: Functional. An ecosystem is a functional unit of nature with biotic and abiotic components interacting across terrestrial (forest, grassland, desert), aquatic (pond, lake, wetland, river, estuary) and man-made (crop fields, aquarium) systems. Vertical distribution of species at different levels is strat", "tag": "NCERT"}, {"id": "II_Bio_88_2", "qno": 2, "q": "Many ecologists regard the entire _______ as a global ecosystem, as a composite of all local ecosystems on Earth.", "a": "Biosphere", "b": "Single pond", "c": "Population", "d": "Single tree", "ans": "A", "exp": "Correct answer: Biosphere. An ecosystem is a functional unit of nature with biotic and abiotic components interacting across terrestrial (forest, grassland, desert), aquatic (pond, lake, wetland, river, estuary) and man-made (crop fields, aquarium) systems. Vertical distribution of species at different levels is strati", "tag": "NCERT"}, {"id": "II_Bio_88_3", "qno": 3, "q": "For convenience of study, the global biosphere is broadly divided into two basic categories of natural ecosystems:", "a": "Terrestrial and aquatic", "b": "Hot and cold only", "c": "Microbial and viral", "d": "Domestic and industrial", "ans": "A", "exp": "Correct answer: Terrestrial and aquatic. An ecosystem is a functional unit of nature with biotic and abiotic components interacting across terrestrial (forest, grassland, desert), aquatic (pond, lake, wetland, river, estuary) and man-made (crop fields, aquarium) systems. Vertical distribution of species at different le", "tag": "NCERT"}, {"id": "II_Bio_88_4", "qno": 4, "q": "Examples of TERRESTRIAL ecosystems include:", "a": "Pond, lake, wetland, river and estuary", "b": "Estuary and lake", "c": "Aquarium and ocean", "d": "Forest, grassland and desert", "ans": "D", "exp": "Correct answer: Forest, grassland and desert. An ecosystem is a functional unit of nature with biotic and abiotic components interacting across terrestrial (forest, grassland, desert), aquatic (pond, lake, wetland, river, estuary) and man-made (crop fields, aquarium) systems. Vertical distribution of species at differe", "tag": "NCERT"}, {"id": "II_Bio_88_5", "qno": 5, "q": "Examples of AQUATIC ecosystems include:", "a": "Forest, grassland and desert", "b": "Grassland and forest", "c": "Pond, lake, wetland, river and estuary", "d": "Crop fields and deserts", "ans": "C", "exp": "Correct answer: Pond, lake, wetland, river and estuary. An ecosystem is a functional unit of nature with biotic and abiotic components interacting across terrestrial (forest, grassland, desert), aquatic (pond, lake, wetland, river, estuary) and man-made (crop fields, aquarium) systems. Vertical distribution of species ", "tag": "NCERT"}]}, {"chapter": "Chapter 13 - Biodiversity", "questions": [{"id": "II_Bio_89_1", "qno": 1, "q": "Who popularised the term 'biodiversity' to describe the combined diversity at all levels of biological organisation?", "a": "Robert May", "b": "Alexander von Humboldt", "c": "Edward Wilson (sociobiologist)", "d": "Paul Ehrlich", "ans": "C", "exp": "Correct answer: Edward Wil
