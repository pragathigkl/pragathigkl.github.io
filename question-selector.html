              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Selection Mode</label>
                <select id="rndMode" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                  <option value="fill">Fill Remaining (${existingCount} kept)</option>
                  <option value="replace">Replace All in ${esc(subName)}</option>
                </select>
              </div>
            </div>

            <!-- NEET PATTERN PERCENTAGE BLUEPRINT -->
            <div class="rounded-xl border border-indigo-200 bg-indigo-50/50 p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-indigo-950">NEET Paper Pattern Mix (%)</span>
                <span id="rndPctTotal" class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">Total: 100%</span>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div>
                  <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Direct / Concept %</label>
                  <input id="pctConcept" type="number" min="0" max="100" value="${mix.concept}" class="rnd-pct-in w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-bold bg-white" />
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Numerical / Calc %</label>
                  <input id="pctNum" type="number" min="0" max="100" value="${mix.numerical}" class="rnd-pct-in w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-bold bg-white" />
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Stmt / A-R / Match %</label>
                  <input id="pctStmt" type="number" min="0" max="100" value="${mix.stmtAR}" class="rnd-pct-in w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-bold bg-white" />
                </div>
                <div>
                  <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Diagram / Graph / PYQ %</label>
                  <input id="pctDiag" type="number" min="0" max="100" value="${mix.diagramPyq}" class="rnd-pct-in w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-bold bg-white" />
                </div>
              </div>
            </div>

            <!-- CHAPTER CHECKBOX PICKER -->
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold text-slate-800">Select Chapters (${esc(ex.examClass)} ${esc(subName)})</span>
                <div class="flex gap-2">
                  <button id="rndAllChBtn" type="button" class="text-xs font-bold text-indigo-700 hover:underline">Select All</button>
                  <button id="rndClrChBtn" type="button" class="text-xs font-bold text-slate-500 hover:underline">Clear</button>
                </div>
              </div>
              <div class="max-h-48 overflow-y-auto rounded-xl border border-slate-200 p-2.5 grid grid-cols-1 sm:grid-cols-2 gap-1.5 bg-slate-50">
                ${chapters.map((ch, idx) => `
                  <label class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-xs cursor-pointer hover:border-slate-400">
                    <input type="checkbox" class="rnd-ch-cb accent-slate-900" value="${idx}" checked />
                    <span class="truncate font-medium text-slate-800">${esc(ch.chapter)}</span>
                    <span class="ml-auto text-[10px] text-slate-400 shrink-0">${ch.questions.length}Q</span>
                  </label>
                `).join('')}
              </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-200">
              <button id="rndCancelBtn" type="button" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">Cancel</button>
              <button id="rndRunBtn" type="button" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow">Generate &amp; Load into Excel Sheet</button>
            </div>
          </div>
        `;
      };

      const mount = async (subName) => {
        await ensureFullBankLoaded(ex.examClass, subName);
        openModal(`${ex.name} — NEET Smart Random Selector (Admin)`, buildModalInner(subName));
        const updateTotal = () => {
          const sum = ['pctConcept', 'pctNum', 'pctStmt', 'pctDiag'].reduce((acc, id) => acc + (Number(document.getElementById(id).value) || 0), 0);
          const badge = document.getElementById('rndPctTotal');
          badge.textContent = `Total: ${sum}%`;
          badge.className = `text-xs font-bold px-2 py-0.5 rounded-full ${sum === 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`;
        };
        document.querySelectorAll('.rnd-pct-in').forEach(inp => inp.addEventListener('input', updateTotal));
        document.getElementById('rndSubSel').addEventListener('change', (e) => mount(e.target.value));
        document.getElementById('rndAllChBtn').addEventListener('click', () => document.querySelectorAll('.rnd-ch-cb').forEach(c => { c.checked = true; }));
        document.getElementById('rndClrChBtn').addEventListener('click', () => document.querySelectorAll('.rnd-ch-cb').forEach(c => { c.checked = false; }));
        document.getElementById('rndCancelBtn').addEventListener('click', closeModal);

        document.getElementById('rndRunBtn').addEventListener('click', async () => {
          const chosenSub = document.getElementById('rndSubSel').value;
          const subObj = cfg.subjects.find(s => s.name === chosenSub) || cfg.subjects[0];
          const targetN = Math.max(1, Math.min(subObj.quota, Number(document.getElementById('rndCount').value) || subObj.quota));
          const mode = document.getElementById('rndMode').value;
          const checkedIdxs = Array.from(document.querySelectorAll('.rnd-ch-cb:checked')).map(c => Number(c.value));
          if (checkedIdxs.length === 0) {
            toast('Please select at least one chapter.', 'error');
            return;
          }

          const chapters = getBankChaptersFor(ex.examClass, chosenSub);
          let baseList = (mode === 'fill' && ex.selections && ex.selections[chosenSub]) ? ex.selections[chosenSub].slice() : [];
          const usedIds = new Set(baseList.map(q => q.id));
          const needed = Math.min(targetN, subObj.quota - baseList.length);
          if (needed <= 0) {
            toast(`${chosenSub} already has ${baseList.length}/${subObj.quota} questions. Switch mode to "Replace All" to regenerate.`, 'info');
            return;
          }

          // Gather candidate pool from checked chapters & bucket by NEET type
          const buckets = { concept: [], numerical: [], stmtAR: [], diagramPyq: [] };
          checkedIdxs.forEach(idx => {
            const ch = chapters[idx];
            if (!ch) return;
            ch.questions.forEach(q => {
              if (!usedIds.has(q.id)) {
                const b = classifyQuestionType(q);
                buckets[b].push(Object.assign({ chapter: ch.chapter, _neetType: b }, q));
              }
            });
          });
          Object.keys(buckets).forEach(k => { buckets[k] = shuffleArr(buckets[k]); });

          const pC = Number(document.getElementById('pctConcept').value) || 0;
          const pN = Number(document.getElementById('pctNum').value) || 0;
          const pS = Number(document.getElementById('pctStmt').value) || 0;
          const pD = Number(document.getElementById('pctDiag').value) || 0;
          const pTot = Math.max(1, pC + pN + pS + pD);

          const targets = {
            concept: Math.round(needed * (pC / pTot)),
            numerical: Math.round(needed * (pN / pTot)),
            stmtAR: Math.round(needed * (pS / pTot)),
            diagramPyq: Math.round(needed * (pD / pTot))
          };

          const picked = [];
          const pickedCounts = { concept: 0, numerical: 0, stmtAR: 0, diagramPyq: 0 };
          const takeFrom = (bKey, count) => {
            while (count > 0 && buckets[bKey].length > 0 && picked.length < needed) {
              picked.push(buckets[bKey].pop());
              pickedCounts[bKey]++;
              count--;
            }
          };
          takeFrom('stmtAR', targets.stmtAR);
          takeFrom('diagramPyq', targets.diagramPyq);
          takeFrom('numerical', targets.numerical);
          takeFrom('concept', targets.concept);

          // Top up any shortfall from remaining available questions across selected chapters
          const leftovers = shuffleArr([].concat(buckets.concept, buckets.numerical, buckets.stmtAR, buckets.diagramPyq));
          while (picked.length < needed && leftovers.length > 0) {
            const item = leftovers.pop();
            picked.push(item);
            pickedCounts[item._neetType]++;
          }

          if (picked.length === 0) {
            toast('No unused questions available in the selected chapter(s). Upload the full .xlsx bank under Settings for 1,000 Qs/chapter!', 'error');
            return;
          }

          ex.selections = ex.selections || {};
          ex.selections[chosenSub] = baseList.concat(picked);
          ex.pushedStatus = ex.pushedStatus || {};
          ex.pushedStatus[chosenSub] = {
            pushedBy: ADMIN_EMAIL + ' (Auto-Pick)',
            count: ex.selections[chosenSub].length,
            pushedAt: new Date().toISOString()
          };
          saveState();
          closeModal();

          if (state.appsScriptUrl) {
            toast(`Saving ${ex.selections[chosenSub].length} ${chosenSub} questions to Drive Excel sheet...`, 'info');
            await callAppsScript('POST', {
              action: 'pushToAdmin',
              examId: ex.id,
              subject: chosenSub,
              lecturerEmail: ADMIN_EMAIL + ' (Auto-Pick)',
              questions: ex.selections[chosenSub]
            });
          }

          toast(`Auto-picked ${picked.length} ${chosenSub} Qs (Concept: ${pickedCounts.concept}, Numerical: ${pickedCounts.numerical}, Stmt/A-R: ${pickedCounts.stmtAR}, Graph/PYQ: ${pickedCounts.diagramPyq})`, 'success');
          render();
        });
      };

      mount(firstSub);
    }

      document.querySelectorAll('[data-pick-subj]').forEach(btn => {

          const subject = btn.getAttribute('data-pick-subj');
          const used = Object.values(state.lecturerProfiles).filter(p => p.subject === subject && p.email !== state.session.email).length;
          if (used >= MAX_LECTURERS_PER_SUBJECT) {
            toast(`${subject} already has 2 registered lecturers (max 2 per subject). Contact Admin.`, 'error');
            return;

          const name = document.getElementById('onboardName').value.trim() || state.session.name;

            const res = await callAppsScript('POST', { action: 'saveLecturerProfile', email: state.session.email, name, subject });

              return;

          }
          const profile = { email: state.session.email, name, subject, slot: used + 1, lockedAt: new Date().toISOString() };
          state.lecturerProfiles[state.session.email] = profile;
          state.session.subject = subject;
          state.session.name = name;
          saveState();
          toast(`Subject locked to ${subject}! Future logins will open ${subject} directly.`, 'success');
          render();
        });
      });
    }

    // =========================================================================
    // LECTURER PORTAL (LOCKED TO 1 SUBJECT, AUTO-SAVE, NO COPY, NO PDF, PUSH TO ADMIN)
    // =========================================================================
    function getBankKey(examClass, subjectName) {
      const bankSubj = (subjectName === 'Botany' || subjectName === 'Zoology') ? 'Biology'
                     : (subjectName === 'Maths' ? 'Mathematics' : subjectName);
      return `${examClass}|${bankSubj}`;
    }

    function getBankChaptersFor(examClass, subjectName) {
      return state.bank[getBankKey(examClass, subjectName)] || [];
    }

    async function ensureFullBankLoaded(examClass, subjectName) {
      const key = getBankKey(examClass, subjectName);
      if (state.loadedFullBanks[key]) return;
      const parts = key.split('|');
      const baseName = `${parts[0].replace(/\s+/g, '_')}_${parts[1]}`;
      try {
        let chapters = null;
        // Prefer ultra-compact .json.gz (decompressed natively in browser via DecompressionStream)
        const gzResp = await fetch(`question_banks_json/${baseName}.json.gz`);
        if (gzResp.ok && typeof DecompressionStream !== 'undefined' && gzResp.body) {
          const ds = new DecompressionStream('gzip');
          const text = await new Response(gzResp.body.pipeThrough(ds)).text();
          chapters = JSON.parse(text);
        } else {
          const rawResp = await fetch(`question_banks_json/${baseName}.json`);
          if (rawResp.ok) chapters = await rawResp.json();
        }
        if (Array.isArray(chapters) && chapters.length > 0) {
          state.bank[key] = chapters;
          state.loadedFullBanks[key] = true;
          const tot = chapters.reduce((s, c) => s + (c.questions ? c.questions.length : 0), 0);
          toast(`Loaded full ${parts[0]} ${parts[1]} bank (${tot.toLocaleString()} questions)!`, 'success');
          render();
        }
      } catch (e) {
        // Preview/local fallback uses embedded 600-question sample bank
      }
    }

    async function autoSaveLecturerSelection(exam, subject) {
      const picked = (exam.selections && exam.selections[subject]) || [];
      saveState();
      state.autoSaveState = 'saving';
      updateAutoSavePill();
      if (state.appsScriptUrl) {
        const res = await callAppsScript('POST', {
          action: 'autoSaveSelection',
          examId: exam.id,
          subject,
          lecturerEmail: state.session.email,
          questions: picked
        });
        state.autoSaveState = (res && res.ok) ? 'saved' : 'error';
      } else {
        state.autoSaveState = 'saved';
      }
      updateAutoSavePill();
    }

    async function pushSelectionToAdmin(exam, subject) {
      const picked = (exam.selections && exam.selections[subject]) || [];
      if (picked.length === 0) {
        toast('Please select at least 1 question before pushing to Admin.', 'error');
        return;
      }
      exam.pushedStatus = exam.pushedStatus || {};
      exam.pushedStatus[subject] = {
        pushedBy: state.session.email,
        count: picked.length,
        pushedAt: new Date().toISOString()
      };
      saveState();
      if (state.appsScriptUrl) {
        toast('Pushing finalized questions to Admin Excel sheet in Drive...', 'info');
        const res = await callAppsScript('POST', {
          action: 'pushToAdmin',
          examId: exam.id,
          subject,
          lecturerEmail: state.session.email,
          questions: picked
        });
        if (res && res.ok) {
          toast(`Pushed ${picked.length} ${subject} questions to Admin! Saved in weekly Drive Excel sheet.`, 'success');
        } else {
          toast('Pushed locally (Drive sync error: ' + (res.error || 'offline') + ')', 'error');
        }
      } else {
        toast(`Pushed ${picked.length} ${subject} questions to Admin (${ADMIN_EMAIL})!`, 'success');
      }
      render();
    }

    function updateAutoSavePill() {
      const el = document.getElementById('autoSavePill');
      if (!el) return;
      if (state.autoSaveState === 'saving') {
        el.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800';
        el.textContent = 'Auto-saving to Excel...';
      } else if (state.autoSaveState === 'saved') {
        el.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800';
        el.textContent = 'Auto-saved to Admin Excel';
      } else if (state.autoSaveState === 'error') {
        el.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-rose-100 text-rose-800';
        el.textContent = 'Saved locally (Drive offline)';
      } else {
        el.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600';
        el.textContent = 'Auto-save Ready';
      }
    }

      if (!state.session.subject) {
        renderLecturerSubjectOnboarding();
        return;
      }

      const root = document.getElementById('appRoot');
      const subject = state.session.subject;

      // VIEW 1: EXAMS FOR THIS LECTURER'S LOCKED SUBJECT ONLY

        const matchingExams = state.exams.filter(ex => {
          const cfg = TEMPLATE_CONFIG[ex.type] || TEMPLATE_CONFIG.NEET;
          return cfg.subjects.some(s => s.name === subject);
        });

        root.innerHTML = `
          <div class="space-y-5 fade-in no-copy-zone no-print-lecturer">

              <h1 class="text-2xl font-extrabold text-slate-900">${esc(subject)} — Active Weekly Exams</h1>

            </div>

            ${matchingExams.length === 0 ? `<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">No active exams currently require ${esc(subject)}.</div>` : `

                  const cnt = (ex.selections && ex.selections[subject]) ? ex.selections[subject].length : 0;
                  const pushed = ex.pushedStatus && ex.pushedStatus[subject];
                  const pct = Math.min(100, Math.round((cnt / quota) * 100));
                  return `
                    <button type="button" data-open-exam="${esc(ex.id)}" class="text-left bg-white rounded-2xl shadow-sm border ${pushed ? 'border-emerald-400' : 'border-slate-200'} hover:border-slate-900 hover:shadow-md p-5 transition group">
                      <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${ex.type === 'NEET' ? 'bg-indigo-100 text-indigo-800' : 'bg-amber-100 text-amber-800'}">${esc(ex.type)}</span>
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700">${esc(ex.examClass)}</span>
                      </div>
                      <div class="font-extrabold text-base text-slate-900 group-hover:text-emerald-700 transition">${esc(ex.name)}</div>
                      <div class="text-xs text-slate-500 mt-1">Date: ${esc(ex.date || 'TBD')} &bull; Sheet: <span class="font-bold text-slate-800">${esc(subject)}</span></div>
                      <div class="mt-4">
                        <div class="flex justify-between text-xs font-bold mb-1">
                          <span class="${pushed ? 'text-emerald-700' : 'text-slate-700'}">${cnt} / ${quota} Selected</span>
                          <span>${pushed ? 'Pushed' : pct + '%'}</span>
                        </div>
                        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full ${pushed ? 'bg-emerald-600' : 'bg-slate-900'}" style="width:${pct}%"></div>
                        </div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;

        document.querySelectorAll('[data-open-exam]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeExamId = btn.getAttribute('data-open-exam');

      if (!exam) { state.lecView = 'exams'; render(); return; }
      const quota = (exam.quotas && exam.quotas[subject]) || 45;
      const selectedList = (exam.selections && exam.selections[subject]) ? exam.selections[subject] : [];
      const selectedIds = new Set(selectedList.map(q => q.id));
      const pushed = exam.pushedStatus && exam.pushedStatus[subject];
      const chapters = getBankChaptersFor(exam.examClass, subject);

      // VIEW 2: CHAPTER NAMES (NO DOWNLOAD / NO PDF — PUSH TO ADMIN AT BOTTOM)
      if (state.lecView === 'chapters') {
        root.innerHTML = `
          <div class="space-y-5 pb-24 fade-in no-copy-zone no-print-lecturer">

                <button id="backToExamsBtn" type="button" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800">&larr; All Exams</button>
                <div>
                  <div class="font-extrabold text-base text-slate-900">${esc(exam.name)} — ${esc(subject)} (${esc(exam.examClass)})</div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">

      // VIEW 3: QUESTIONS WORKBENCH (NO COPY, NO PDF, AUTO-SAVE ON CLICK, PUSH TO ADMIN AT BOTTOM)
      const chObj = chapters[state.activeChapterIdx] || { chapter: 'Chapter', questions: [] };
      const qTerm = state.searchQuery.trim().toLowerCase();
      const filteredQs = chObj.questions.filter(q => {
        if (state.showOnlySelected && !selectedIds.has(q.id)) return false;
        if (state.tagFilter !== 'ALL' && q.tag !== state.tagFilter) return false;
        if (qTerm && !(q.q.toLowerCase().includes(qTerm) || q.exp.toLowerCase().includes(qTerm))) return false;
        return true;
      });

      root.innerHTML = `
        <div class="space-y-4 pb-24 fade-in no-copy-zone no-print-lecturer">
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <button id="backToChBtn" type="button" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 shrink-0">&larr; Chapters</button>
              <div class="min-w-0">
                <div class="font-extrabold text-sm sm:text-base text-slate-900 truncate">${esc(chObj.chapter)}</div>
                <div class="text-xs text-slate-500 truncate">${esc(exam.name)} &bull; ${esc(subject)} Sheet (Protected View)</div>
              </div>
            </div>
            <span class="px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-extrabold">${selectedList.length} / ${quota} Selected</span>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-3.5 flex flex-wrap items-center gap-3">
            <input id="qSearchInput" type="text" value="${esc(state.searchQuery)}" placeholder="Search question or explanation..." class="flex-1 min-w-[200px] px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none" />
            <div class="flex items-center gap-1.5 flex-wrap">
              ${['ALL', 'NCERT', 'PYQ', 'Booster'].map(t => `<button type="button" data-tag-f="${t}" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${state.tagFilter === t ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">${t}</button>`).join('')}
              <button id="toggleSelOnlyBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${state.showOnlySelected ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">Selected Only</button>
            </div>
          </div>

          ${(() => {
            const perPage = 50;
            const totalPages = Math.max(1, Math.ceil(filteredQs.length / perPage));
            if (state.qPage > totalPages) state.qPage = 1;
            const startIdx = (state.qPage - 1) * perPage;
            const pageQs = filteredQs.slice(startIdx, startIdx + perPage);
            return `
              <div class="flex items-center justify-between text-xs text-slate-600 px-1">
                <span>Showing ${filteredQs.length === 0 ? 0 : startIdx + 1}–${Math.min(startIdx + perPage, filteredQs.length)} of ${filteredQs.length.toLocaleString()} questions</span>
                ${totalPages > 1 ? `
                  <div class="flex items-center gap-1.5">
                    <button id="prevPageBtn" type="button" ${state.qPage <= 1 ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-slate-300 bg-white font-bold disabled:opacity-40">&larr; Prev</button>
                    <span class="font-bold text-slate-900">Page ${state.qPage} / ${totalPages}</span>
                    <button id="nextPageBtn" type="button" ${state.qPage >= totalPages ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-slate-300 bg-white font-bold disabled:opacity-40">Next &rarr;</button>
                  </div>
                ` : ''}
              </div>
              <div class="space-y-3.5">
                ${pageQs.length === 0 ? `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">No questions match your filter.</div>` : ''}
                ${pageQs.map(q => {
              const isSel = selectedIds.has(q.id);
              const opts = [['A', q.a], ['B', q.b], ['C', q.c], ['D', q.d]];
              return `
                <div class="bg-white rounded-2xl border-2 ${isSel ? 'q-card-selected' : 'border-slate-200'} p-4 sm:p-5 shadow-xs transition">
                  <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="px-2.5 py-0.5 rounded-lg bg-slate-900 text-white text-xs font-bold">Q.${q.qno}</span>
                      <span class="px-2 py-0.5 rounded-full text-xs font-bold ${q.tag === 'PYQ' ? 'bg-amber-100 text-amber-800' : (q.tag === 'Booster' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-700')}">${esc(q.tag)}</span>
                    </div>
                    <button type="button" data-toggle-q="${esc(q.id)}" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${isSel ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs' : 'bg-slate-100 hover:bg-slate-900 hover:text-white text-slate-800'}">
                      ${isSel ? '&#10003; Selected (Auto-Saved)' : '+ Select Question'}
                    </button>
                  </div>
                  <div class="eq-text text-sm font-semibold text-slate-900 mb-3 leading-relaxed">${renderRichEq(q.q)}</div>
                  ${(() => {
                    const dSrc = getDiagramSrc(q.img || q.diagram);
                    return dSrc ? `<div class="my-3 flex justify-center"><img src="${dSrc}" alt="Question Diagram" class="max-h-56 max-w-full rounded-xl border border-slate-200 bg-white p-1.5 shadow-xs object-contain" /></div>` : '';
                  })()}
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                    ${opts.map(([lettr, val]) => {
                      const isAns = q.ans === lettr;
                      return `
                        <div class="eq-text px-3 py-2 rounded-xl border text-xs ${isAns ? 'border-emerald-400 bg-emerald-50 text-emerald-950 font-bold' : 'border-slate-200 bg-slate-50 text-slate-700'}">
                          <span class="inline-block w-5 font-extrabold">${lettr}.</span> ${renderRichEq(val)}
                        </div>
                      `;
                    }).join('')}
                  </div>
                  <div class="flex items-center justify-between gap-2 pt-1">
                    <span class="text-xs font-extrabold text-emerald-800 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg">Ans: (${esc(q.ans)})</span>
                    <button type="button" data-toggle-sol="${esc(q.id)}" class="px-3 py-1 rounded-lg text-xs font-bold border transition ${state.openSolutions[q.id] ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 hover:bg-amber-100 text-amber-900 border-amber-200'}">
                      ${state.openSolutions[q.id] ? 'Hide Solution' : '&#128161; View Solution'}
                    </button>
                  </div>
                  ${state.openSolutions[q.id] ? `
                    <div class="eq-text mt-2.5 rounded-xl bg-amber-50/80 border border-amber-200 px-3.5 py-2.5 text-xs text-slate-800 leading-relaxed fade-in">
                      <span class="font-extrabold text-emerald-800">Correct Answer: (${esc(q.ans)})</span>
                      <span class="mx-1.5 text-slate-300">|</span>
                      <span class="font-semibold text-slate-700">Explanation:</span> ${renderRichEq(q.exp)}
                    </div>
                  ` : ''}
                </div>
              `;
                }).join('')}
              </div>
            `;
          })()}

          <!-- STICKY BOTTOM PUSH TO ADMIN BAR (ONLY ACTION FOR LECTURER) -->
          <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 px-4 py-3 z-30 shadow-lg">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <span class="text-xs font-extrabold text-slate-900">${selectedList.length} / ${quota} Selected</span>
                <span id="autoSavePill" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">Auto-saved to Admin Excel</span>
              </div>
              <button id="pushAdminQBtn" type="button" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow transition">
                ${pushed ? '&#10003; Re-Push to Admin' : 'Push to Admin &rarr;'}
              </button>
            </div>
          </div>
        </div>
      `;

      updateAutoSavePill();
      document.getElementById('backToChBtn').addEventListener('click', () => { state.lecView = 'chapters'; render(); });
      document.getElementById('pushAdminQBtn').addEventListener('click', () => pushSelectionToAdmin(exam, subject));
      document.getElementById('qSearchInput').addEventListener('input', (e) => { state.searchQuery = e.target.value; state.qPage = 1; render(); });
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => { state.qPage = Math.max(1, state.qPage - 1); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      if (nextBtn) nextBtn.addEventListener('click', () => { state.qPage += 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      document.getElementById('toggleSelOnlyBtn').addEventListener('click', () => { state.showOnlySelected = !state.showOnlySelected; render(); });
      document.querySelectorAll('[data-tag-f]').forEach(btn => {
        btn.addEventListener('click', () => { state.tagFilter = btn.getAttribute('data-tag-f'); render(); });
      });
      document.querySelectorAll('[data-toggle-sol]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.getAttribute('data-toggle-sol');
          state.openSolutions[qid] = !state.openSolutions[qid];
          render();
        });
      });
      document.querySelectorAll('[data-toggle-q]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const qid = btn.getAttribute('data-toggle-q');
          exam.selections = exam.selections || {};
          exam.selections[subject] = exam.selections[subject] || [];
          const idx = exam.selections[subject].findIndex(x => x.id === qid);
          if (idx >= 0) {
            exam.selections[subject].splice(idx, 1);
          } else {
            if (exam.selections[subject].length >= quota) {
              toast(`Quota reached (${quota} questions max for ${subject}).`, 'error');
              return;
            }
            const qObj = chObj.questions.find(x => x.id === qid);
            if (qObj) exam.selections[subject].push(Object.assign({ chapter: chObj.chapter }, qObj));
          }
          render();
          await autoSaveLecturerSelection(exam, subject);
        });
      });
    }

    function notifyAndroidRole() {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.onUserRole === 'function') {
          window.AndroidBridge.onUserRole(state.session ? state.session.role : 'guest');
        }
      } catch (e) {}
    }

    function render() {
      notifyAndroidRole();
      renderNav();
      if (!state.session) renderLogin();
      else if (state.session.role === 'admin') renderAdmin();
      else renderLecturer();
    }

    loadState();
    initFirebaseIfReady();
    ensureDiagramsLoaded();
    render();
  </script>
</body>
</html>
